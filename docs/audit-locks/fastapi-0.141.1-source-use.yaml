      Pydantic AI's optional Google provider brings in Google Auth, whose pure-Python RSA backend uses pyasn1 to decode ASN.1 data; FastAPI's translator selects OpenAI chat, not Google Auth.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L73-L76
      - https://github.com/googleapis/google-cloud-python/blob/d3d684007a429dc64d8480ceda04658306c52842/packages/google-auth/google/auth/crypt/_python_rsa.py#L15-L31
      - https://github.com/googleapis/google-cloud-python/blob/d3d684007a429dc64d8480ceda04658306c52842/packages/google-auth/google/auth/crypt/_python_rsa.py#L116-L125
      - https://github.com/pyasn1/pyasn1/blob/72e4803405816c371ed3b2cb4be181c47f038406/pyasn1/codec/der/decoder.py#L7-L12
  pyasn1-modules:
    purpose: >-
      Google Auth's optional pure-Python RSA backend imports its X.509 and PKCS#8 schemas from this module collection; FastAPI's translation script does not select the Google provider.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L73-L76
      - https://github.com/googleapis/google-cloud-python/blob/d3d684007a429dc64d8480ceda04658306c52842/packages/google-auth/google/auth/crypt/_python_rsa.py#L15-L31
      - https://github.com/googleapis/google-cloud-python/blob/d3d684007a429dc64d8480ceda04658306c52842/packages/google-auth/setup.py#L24-L30
      - https://github.com/pyasn1/pyasn1-modules/blob/7154ca47caea6e012ef58d6a9975c719f2b6213b/pyasn1_modules/rfc2459.py#L10-L25
  pydantic-evals:
    purpose: >-
      The Pydantic AI convenience distribution selects the evals package for datasets, evaluators, and experiment results; FastAPI's translation script does not run evaluations.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pyproject.toml#L50-L53
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L109-L110
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_evals/pydantic_evals/dataset.py#L177-L204
  pytokens:
    purpose: >-
      Black imports pytokens in its source-tokenization pipeline; this docs/development formatting capability is not FastAPI runtime behavior.
    evidence:
      - https://github.com/psf/black/blob/87928e6d6761a4a6d22250e1fee5601b3998086e/pyproject.toml#L56-L62
      - https://github.com/psf/black/blob/87928e6d6761a4a6d22250e1fee5601b3998086e/src/blib2to3/pgen2/tokenize.py#L60-L61
      - https://github.com/psf/black/blob/87928e6d6761a4a6d22250e1fee5601b3998086e/src/blib2to3/pgen2/tokenize.py#L170-L178
  pyyaml-env-tag:
    purpose: >-
      MkDocs registers this loader extension to support !ENV values in documentation configuration; this is a docs-tooling capability rather than FastAPI runtime behavior.
    evidence:
      - https://github.com/mkdocs/mkdocs/blob/bb7e8b62185b11d9f59bb7f50b13c15134f62f8a/mkdocs/utils/yaml.py#L9-L12
      - https://github.com/mkdocs/mkdocs/blob/bb7e8b62185b11d9f59bb7f50b13c15134f62f8a/mkdocs/utils/yaml.py#L109-L124
      - https://github.com/waylan/pyyaml-env-tag/blob/8f43568693ebd7fcad5c3b79ef6ce0072225914f/yaml_env_tag.py#L9-L28
  referencing:
    purpose: >-
      The optional MCP client path brings jsonschema into translation dependencies; jsonschema uses referencing.Resource and Registry to resolve JSON Schema resources, while FastAPI's script does not call that MCP path.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L105-L110
