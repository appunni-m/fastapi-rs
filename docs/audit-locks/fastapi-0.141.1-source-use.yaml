      - https://github.com/python-jsonschema/jsonschema/blob/a7277432b0f7bcd0551f6e589d30457017125df4/jsonschema/validators.py#L125-L132
      - https://github.com/python-jsonschema/referencing/blob/9a82e6c7e5e2e395b61bb4017dc6adc52ac52e7c/referencing/_core.py#L8-L18
  secretstorage:
    purpose: >-
      Keyring's optional Linux Secret Service backend uses SecretStorage over D-Bus; this is an optional Pydantic AI/FastMCP keyring capability, not a FastAPI translation behavior demonstrated by source.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L105-L108
      - https://github.com/jaraco/keyring/blob/38c040133559682902f25fe96496756ee6849820/pyproject.toml#L28-L31
      - https://github.com/jaraco/keyring/blob/38c040133559682902f25fe96496756ee6849820/keyring/backends/SecretService.py#L16-L20
      - https://github.com/jaraco/keyring/blob/38c040133559682902f25fe96496756ee6849820/keyring/backends/SecretService.py#L42-L68
  tenacity:
    purpose: >-
      Pydantic AI's optional retries and Google GenAI provider use Tenacity for retry strategies; FastAPI's translation script uses the OpenAI chat provider and does not demonstrate those paths.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L73-L76
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L117-L118
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pydantic_ai/retries.py#L1-L34
      - https://github.com/googleapis/python-genai/blob/6066ccaa207433e82bb94529cee0fede669527d1/google/genai/_api_client.py#L492-L523
  tqdm:
    purpose: >-
      The optional OpenAI SDK upload CLI uses tqdm for file-upload progress; FastAPI's translator uses the OpenAI chat API and does not exercise file uploads.
    evidence:
      - https://github.com/pydantic/pydantic-ai/blob/7ab3bff5e09ae950992a714f00b49c7a8e700054/pydantic_ai_slim/pyproject.toml#L71-L76
      - https://github.com/openai/openai-python/blob/750354ed65565b31d0547bf00f4f3180ac1bfeef/src/openai/cli/_progress.py#L20-L55
  wcwidth:
    purpose: >-
      Prompt-toolkit uses wcwidth to measure Unicode terminal display cells; this is the optional Pydantic AI CLI's interactive UI capability, not FastAPI translation behavior.
    evidence:
      - https://github.com/prompt-toolkit/python-prompt-toolkit/blob/d8adbe9bfcf5f7e95b015d8ab12e2985b9a7822b/src/prompt_toolkit/utils.py#L18-L18
      - https://github.com/prompt-toolkit/python-prompt-toolkit/blob/d8adbe9bfcf5f7e95b015d8ab12e2985b9a7822b/src/prompt_toolkit/utils.py#L127-L175
      - https://github.com/jquast/wcwidth/blob/666c501154765ee20dbddc92c340d759b567cfff/wcwidth/wcwidth.py#L186-L205
  zipp:
    purpose: >-
      OpenTelemetry API's optional importlib-metadata compatibility path uses zipp to read zip-backed metadata; FastAPI's translator does not configure telemetry.
    evidence:
      - https://github.com/open-telemetry/opentelemetry-python/blob/b4c13279187941b561de5d62e6483a91759ba123/opentelemetry-api/pyproject.toml#L27-L32
