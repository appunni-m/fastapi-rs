schema: fastapi-rs/dependency-source-use-review@1

authority:
  fastapi_version: 0.141.1
  fastapi_commit: 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f
  upstream_lock_sha256: 96ae079a121e11b4cc0d260df5b7f77189bb90fa23a2da368f607418c2d98165
  starlette_version: 1.6.0
  starlette_commit: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f

scope:
  source_review: Pinned FastAPI and Starlette sources plus exact-version dependency sources that explain a package's selected lock path, including tests, docs, tooling, and optional extras.
  unresolved_default: No package-specific purpose evidence is recorded; the lock-derived consumer path shows role and reachability only. Transitive optional capability records describe installed package features, not FastAPI behavior, unless direct invocation is explicitly evidenced.

source_backed:
  a2wsgi:
    purpose: The WSGI interoperability example and guide use a2wsgi; it is a docs/test integration, not FastAPI's core ASGI request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/wsgi/tutorial001_py310.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/advanced/wsgi.md
  argon2-cffi:
    purpose: FastAPI's OAuth2 tutorial and test group select pwdlib's optional argon2 backend; this distribution supplies that optional hashing backend, not FastAPI core behavior.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/tutorial/security/oauth2-jwt.md
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  argon2-cffi-bindings:
    purpose: Transitive native binding selected by the pwdlib[argon2] optional backend documented by FastAPI; it is not imported by FastAPI.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/tutorial/security/oauth2-jwt.md
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  certifi:
    purpose: HTTPX's default TLS verification context uses certifi's bundled CA file unless SSL_CERT_FILE or SSL_CERT_DIR overrides it; this supports FastAPI's optional HTTPX client and TestClient paths.
    evidence:
      - https://github.com/encode/httpx/blob/26d48e0634e6ee9cdc0533996db289ce4b430177/httpx/_config.py#L23-L40
      - https://github.com/certifi/python-certifi/blob/9044f1ba68a28fef3b3f51229227178407fefc96/certifi/core.py#L40-L47
  click:
    purpose: Uvicorn uses Click to define its command-line options and to style server log levels and status codes; this is optional server command-line and terminal-output support.
    evidence:
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/main.py#L14-L36
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/main.py#L62-L86
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/logging.py#L9-L30
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/logging.py#L73-L80
  colorama:
    purpose: Click wraps Windows output streams with Colorama to support ANSI colors, and Uvicorn uses Click's styled output for server logs; this is conditional Windows terminal support.
    evidence:
      - https://github.com/pallets/click/blob/fd183b2ced1cb5857784fe7fb22f4982f671f098/src/click/_compat.py#L509-L538
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/logging.py#L9-L30
  cross-web:
    purpose: A FastAPI Strawberry tutorial test filters a deprecation warning containing cross_web; this is test warning handling, not an application dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_tutorial/test_graphql/test_tutorial001.py
  cryptography:
    purpose: FastAPI's OAuth2/JWT guide documents the optional pyjwt[crypto] feature for RSA and ECDSA algorithms.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/tutorial/security/oauth2-jwt.md
  dirty-equals:
    purpose: FastAPI tests use dirty-equals matchers to assert request, validation, and response values.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_multi_body_errors.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_request_params/test_header/test_required_str.py
  fastapi-cloud-cli:
    purpose: FastAPI documents its optional CLI/deployment integration and fastapi deploy workflow; it is outside the ASGI request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/index.md
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/deployment/fastapicloud.md
  fastar:
    purpose: FastAPI Cloud CLI's deployment command uses fastar to write application files into a zstd-compressed tar archive for upload; this is optional deployment packaging.
    evidence:
      - https://github.com/fastapilabs/fastapi-cloud-cli/blob/fae7dee8a48ec5aa4a69999d0b3a88f1d8a8c608/fastapi_cloud_cli/commands/deploy.py#L71-L90
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L59-L66
  ghp-import:
    purpose: >-
      FastAPI's docs group selects mkdocstrings[python], whose locked MkDocs
      dependency chain brings ghp-import. This package provides the helper for
      importing a built documentation directory into a gh-pages branch and uses
      python-dateutil for local-time commit offsets. FastAPI's pinned docs
      workflow builds with Zensical and deploys the resulting artifact through
      Cloudflare Pages; no direct ghp-import invocation is evidenced. This is
      documentation-toolchain closure, not FastAPI product runtime.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L131-L145
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L2235-L2253
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L2287-L2318
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L1361-L1367
      - https://github.com/c-w/ghp-import/blob/168d3d5df282d16c9059d08faedc5a323254d951/README.md#L17-L31
      - https://github.com/c-w/ghp-import/blob/168d3d5df282d16c9059d08faedc5a323254d951/ghp_import.py#L8-L9
      - https://github.com/c-w/ghp-import/blob/168d3d5df282d16c9059d08faedc5a323254d951/ghp_import.py#L122-L126
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/docs.py#L284-L299
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/.github/workflows/deploy-docs.yml#L59-L70
  griffe-typingdoc:
    purpose: FastAPI's documentation configuration enables the Griffe typing documentation extension for API reference generation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  griffe-warnings-deprecated:
    purpose: >-
      FastAPI declares this package in its docs group. It provides a Griffe PEP
      702 extension that recognizes warnings.deprecated and
      typing_extensions.deprecated decorators and adds deprecation admonitions
      to documented classes and functions. FastAPI's checked-in mkdocstrings
      configuration names griffe_typingdoc but not this extension, so its
      activation in the current FastAPI docs build is not established. This is
      a docs-tooling dependency, not product runtime behavior.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L131-L145
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L1530-L1536
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml#L54-L61
      - https://github.com/mkdocstrings/griffe-warnings-deprecated/blob/5eefa86a463d0b10d579795d022d90eeebffdc57/README.md#L49-L61
      - https://github.com/mkdocstrings/griffe-warnings-deprecated/blob/5eefa86a463d0b10d579795d022d90eeebffdc57/src/griffe_warnings_deprecated/__init__.py#L1-L9
      - https://github.com/mkdocstrings/griffe-warnings-deprecated/blob/5eefa86a463d0b10d579795d022d90eeebffdc57/src/griffe_warnings_deprecated/_internal/extension.py#L11-L25
      - https://github.com/mkdocstrings/griffe-warnings-deprecated/blob/5eefa86a463d0b10d579795d022d90eeebffdc57/src/griffe_warnings_deprecated/_internal/extension.py#L61-L75
  h11:
    purpose: Uvicorn's HTTP/1.1 protocol handler constructs an h11 server connection and uses it to parse and frame requests and responses for FastAPI applications.
    evidence:
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/protocols/http/h11_impl.py#L11-L12
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/protocols/http/h11_impl.py#L40-L62
      - https://github.com/Kludex/uvicorn/blob/9ff60042a53cd1bbfd5580ab0a91ea2d1d8f2f8c/uvicorn/config.py#L42-L46
  httpcore:
    purpose: HTTPX's synchronous and asynchronous default transports create httpcore connection pools and forward requests through them; this is part of FastAPI's optional HTTPX client and TestClient dependency path.
    evidence:
      - https://github.com/encode/httpx/blob/26d48e0634e6ee9cdc0533996db289ce4b430177/httpx/_transports/default.py#L140-L167
      - https://github.com/encode/httpx/blob/26d48e0634e6ee9cdc0533996db289ce4b430177/httpx/_transports/default.py#L279-L311
  httptools:
    purpose: FastAPI recommends Uvicorn as its ASGI server and documents that Uvicorn is built on httptools; this is an optional server implementation dependency, not FastAPI's in-process ASGI behavior.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/alternatives.md#L465-L471
  httpx2:
    purpose: FastAPI's documentation tests use HTTPX2 and CI has a matrix case that removes it; this is a docs-test profile, not the ASGI server path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/.github/workflows/test.yml
  jieba:
    purpose: >-
      FastAPI explicitly includes jieba in its docs dependency group, and the
      pinned package supplies Chinese word segmentation. FastAPI's docs tooling
      includes zh and zh-hant locales, but the pinned FastAPI source and docs
      configuration do not identify a jieba call site or consumer. The lock
      establishes a docs-toolchain role; the package's exact use in the current
      docs build remains unresolved. It is not a FastAPI runtime dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L131-L145
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L1770-L1774
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/docs.py#L21-L34
      - https://github.com/fxsjy/jieba/blob/1e20c89b66f56c9301b0feed211733ffaa1bd72a/setup.py#L7-L10
  markdown-include-variants:
    purpose: FastAPI's docs configuration enables Markdown include variants for documentation builds.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  markupsafe:
    purpose: The WSGI documentation example uses MarkupSafe to escape a query value; it is an example dependency, not FastAPI core behavior.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/wsgi/tutorial001_py310.py
  mdx-include:
    purpose: FastAPI's docs configuration enables the Markdown include extension for documentation builds.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  mkdocstrings:
    purpose: FastAPI's docs configuration enables mkdocstrings to render Python API references.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  mkdocstrings-python:
    purpose: FastAPI's docs configuration selects the mkdocstrings Python handler for API reference generation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  playwright:
    purpose: FastAPI's checked-in screenshot-generation scripts use Playwright; it is a developer tool, not a runtime dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/playwright/request_form_models/image01.py
  pymdown-extensions:
    purpose: FastAPI's docs configuration enables pymdownx Markdown extensions for rendering documentation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  pytest-cov:
    purpose: FastAPI's coverage script invokes pytest-cov to collect test coverage; this is test tooling.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/test-cov.sh
  pytest-timeout:
    purpose: FastAPI's pytest configuration enables per-test timeouts to detect hanging tests.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  pytest-xdist:
    purpose: FastAPI's test script invokes pytest-xdist for parallel test execution.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/test.sh
  python-dotenv:
    purpose: FastAPI's settings guide says Pydantic Settings uses an external library for dotenv files and explicitly directs users to install python-dotenv to read them.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/advanced/settings.md#L199-L203
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/advanced/settings.md#L216-L228
  python-dateutil:
    purpose: >-
      This is a transitive docs-and-test dependency, not FastAPI product runtime.
      The locked MkDocs publishing helper ghp-import uses dateutil.tz for local
      commit-time offsets; locked Strawberry GraphQL uses dateutil.parser for
      GraphQL scalar parsing and is included in FastAPI's tutorial-test group.
      FastAPI's own pinned source does not import dateutil.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L131-L145
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L160-L175
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L1361-L1367
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L3336-L3343
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/uv.lock#L4159-L4168
      - https://github.com/c-w/ghp-import/blob/168d3d5df282d16c9059d08faedc5a323254d951/ghp_import.py#L8-L9
      - https://github.com/c-w/ghp-import/blob/168d3d5df282d16c9059d08faedc5a323254d951/ghp_import.py#L122-L126
      - https://github.com/strawberry-graphql/strawberry/blob/8ec0d496afb20a89dc85b07fcd31e66cb30bdae7/strawberry/schema/types/base_scalars.py#L7-L8
      - https://github.com/strawberry-graphql/strawberry/blob/8ec0d496afb20a89dc85b07fcd31e66cb30bdae7/strawberry/schema/types/base_scalars.py#L45-L53
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/graphql_/tutorial001_py310.py#L1-L3
  pyyaml:
    purpose: FastAPI docs and scripts parse YAML, and the all extra includes the Starlette schema-related feature; it is not required by the ordinary request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/path_operation_advanced_configuration/tutorial007_py310.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/docs.py
  python-slugify:
    purpose: FastAPI's docs-generation script uses python-slugify when preparing documentation content.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/docs.py
  rich:
    purpose: FastAPI's tooling scripts use Rich for terminal output; CLI use is optional and outside the ASGI request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
  sqlalchemy:
    purpose: FastAPI tutorial tests exercise SQLAlchemy through SQLModel; it is a tutorial/test integration, not a FastAPI runtime dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_orjson_response_class.py
  smokeshow:
    purpose: FastAPI's GitHub Actions workflow publishes coverage reports with Smokeshow.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/.github/workflows/smokeshow.yml
  typer:
    purpose: FastAPI repository scripts and tests use Typer for command-line interfaces; FastAPI's CLI integration is optional.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/cli.py
  annotated-doc:
    purpose: FastAPI attaches Doc metadata to public parameters and API objects.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/param_functions.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/applications.py
  annotated-types:
    purpose: >-
      The pinned Pydantic runtime uses annotated-types metadata such as Interval,
      Gt, Ge, Lt, Le, MultipleOf, MinLen, and MaxLen to build constrained
      Annotated schemas. FastAPI passes parameter and FieldInfo metadata through
      dependency analysis and Pydantic TypeAdapter validation; this is an
      indirect FastAPI runtime dependency, not a direct FastAPI import.
    evidence:
      - https://github.com/annotated-types/annotated-types/blob/0.7.0/annotated_types/__init__.py
      - https://github.com/pydantic/pydantic/blob/v2.13.4/pydantic/types.py
      - https://github.com/pydantic/pydantic/blob/v2.13.4/pydantic/_internal/_known_annotated_metadata.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/_compat/v2.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/dependencies/utils.py
  anyio:
    purpose: FastAPI uses AnyIO thread offload, task groups, and streams in concurrency and streaming routes.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/concurrency.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/routing.py
  coverage:
    purpose: The repository configures coverage collection, exclusions, and reports for the test suite.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  email-validator:
    purpose: The optional email validator enables Pydantic EmailStr support in FastAPI OpenAPI models.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/openapi/models.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  exceptiongroup:
    purpose: >-
      The pinned FastAPI runtime reaches AnyIO through Starlette. AnyIO 4.12.1
      declares exceptiongroup only for Python <3.11, then conditionally imports
      ExceptionGroup to group multiple failed TCP connection attempts and
      listener-bind failures. This is a conditional indirect runtime dependency
      through Starlette and AnyIO; the current Python 3.12 target does not
      activate it.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L44-L50
      - https://github.com/Kludex/starlette/blob/4f250d6b814587e20c5365f0a5f0c4d42bcb929f/pyproject.toml#L33-L36
      - https://github.com/agronholm/anyio/blob/4.12.1/pyproject.toml#L29-L33
