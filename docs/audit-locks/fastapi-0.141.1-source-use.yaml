schema: fastapi-rs/dependency-source-use-review@1

authority:
  fastapi_version: 0.141.1
  fastapi_commit: 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f
  upstream_lock_sha256: 96ae079a121e11b4cc0d260df5b7f77189bb90fa23a2da368f607418c2d98165
  starlette_version: 1.6.0
  starlette_commit: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f

scope:
  source_review: Pinned FastAPI source and selected Starlette source, including their checked-in tests, docs, and tooling.
  unresolved_default: No package-specific source-use mapping is recorded; the lock-derived consumer path shows role and reachability only, not proof that source was reviewed or that the package is unused.

source_backed:
  a2wsgi:
    purpose: The WSGI interoperability example and guide use a2wsgi; it is a docs/test integration, not FastAPI's core ASGI request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/wsgi/tutorial001_py310.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/advanced/wsgi.md
  argon2-cffi:
    purpose: FastAPI's OAuth2 tutorial and test group select pwdlib's optional argon2 backend; this distribution supplies that optional hashing backend, not FastAPI core behavior.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/tutorial/security/oauth2-jwt.md
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  argon2-cffi-bindings:
    purpose: Transitive native binding selected by the pwdlib[argon2] optional backend documented by FastAPI; it is not imported by FastAPI.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/tutorial/security/oauth2-jwt.md
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  cross-web:
    purpose: A FastAPI Strawberry tutorial test filters a deprecation warning containing cross_web; this is test warning handling, not an application dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_tutorial/test_graphql/test_tutorial001.py
  cryptography:
    purpose: FastAPI's OAuth2/JWT guide documents the optional pyjwt[crypto] feature for RSA and ECDSA algorithms.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/tutorial/security/oauth2-jwt.md
  dirty-equals:
    purpose: FastAPI tests use dirty-equals matchers to assert request, validation, and response values.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_multi_body_errors.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_request_params/test_header/test_required_str.py
  fastapi-cloud-cli:
    purpose: FastAPI documents its optional CLI/deployment integration and fastapi deploy workflow; it is outside the ASGI request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/index.md
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/docs/deployment/fastapicloud.md
  griffe-typingdoc:
    purpose: FastAPI's documentation configuration enables the Griffe typing documentation extension for API reference generation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  httpx2:
    purpose: FastAPI's documentation tests use HTTPX2 and CI has a matrix case that removes it; this is a docs-test profile, not the ASGI server path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/.github/workflows/test.yml
  markdown-include-variants:
    purpose: FastAPI's docs configuration enables Markdown include variants for documentation builds.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  markupsafe:
    purpose: The WSGI documentation example uses MarkupSafe to escape a query value; it is an example dependency, not FastAPI core behavior.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/wsgi/tutorial001_py310.py
  mdx-include:
    purpose: FastAPI's docs configuration enables the Markdown include extension for documentation builds.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  mkdocstrings:
    purpose: FastAPI's docs configuration enables mkdocstrings to render Python API references.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  mkdocstrings-python:
    purpose: FastAPI's docs configuration selects the mkdocstrings Python handler for API reference generation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  playwright:
    purpose: FastAPI's checked-in screenshot-generation scripts use Playwright; it is a developer tool, not a runtime dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/playwright/request_form_models/image01.py
  pymdown-extensions:
    purpose: FastAPI's docs configuration enables pymdownx Markdown extensions for rendering documentation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs/en/mkdocs.yml
  pytest-cov:
    purpose: FastAPI's coverage script invokes pytest-cov to collect test coverage; this is test tooling.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/test-cov.sh
  pytest-timeout:
    purpose: FastAPI's pytest configuration enables per-test timeouts to detect hanging tests.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  pytest-xdist:
    purpose: FastAPI's test script invokes pytest-xdist for parallel test execution.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/test.sh
  pyyaml:
    purpose: FastAPI docs and scripts parse YAML, and the all extra includes the Starlette schema-related feature; it is not required by the ordinary request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/path_operation_advanced_configuration/tutorial007_py310.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/docs.py
  python-slugify:
    purpose: FastAPI's docs-generation script uses python-slugify when preparing documentation content.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/docs.py
  rich:
    purpose: FastAPI's tooling scripts use Rich for terminal output; CLI use is optional and outside the ASGI request path.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
  sqlalchemy:
    purpose: FastAPI tutorial tests exercise SQLAlchemy through SQLModel; it is a tutorial/test integration, not a FastAPI runtime dependency.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_orjson_response_class.py
  smokeshow:
    purpose: FastAPI's GitHub Actions workflow publishes coverage reports with Smokeshow.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/.github/workflows/smokeshow.yml
  typer:
    purpose: FastAPI repository scripts and tests use Typer for command-line interfaces; FastAPI's CLI integration is optional.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/cli.py
  annotated-doc:
    purpose: FastAPI attaches Doc metadata to public parameters and API objects.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/param_functions.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/applications.py
  annotated-types:
    purpose: >-
      The pinned Pydantic runtime uses annotated-types metadata such as Interval,
      Gt, Ge, Lt, Le, MultipleOf, MinLen, and MaxLen to build constrained
      Annotated schemas. FastAPI passes parameter and FieldInfo metadata through
      dependency analysis and Pydantic TypeAdapter validation; this is an
      indirect FastAPI runtime dependency, not a direct FastAPI import.
    evidence:
      - https://github.com/annotated-types/annotated-types/blob/0.7.0/annotated_types/__init__.py
      - https://github.com/pydantic/pydantic/blob/v2.13.4/pydantic/types.py
      - https://github.com/pydantic/pydantic/blob/v2.13.4/pydantic/_internal/_known_annotated_metadata.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/_compat/v2.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/dependencies/utils.py
  anyio:
    purpose: FastAPI uses AnyIO thread offload, task groups, and streams in concurrency and streaming routes.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/concurrency.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/routing.py
  coverage:
    purpose: The repository configures coverage collection, exclusions, and reports for the test suite.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  email-validator:
    purpose: The optional email validator enables Pydantic EmailStr support in FastAPI OpenAPI models.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/openapi/models.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  exceptiongroup:
    purpose: >-
      The pinned FastAPI runtime reaches AnyIO through Starlette. AnyIO 4.12.1
      declares exceptiongroup only for Python <3.11, then conditionally imports
      ExceptionGroup to group multiple failed TCP connection attempts and
      listener-bind failures. This is a conditional indirect runtime dependency
      through Starlette and AnyIO; the current Python 3.12 target does not
      activate it.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L44-L50
      - https://github.com/Kludex/starlette/blob/4f250d6b814587e20c5365f0a5f0c4d42bcb929f/pyproject.toml#L33-L36
      - https://github.com/agronholm/anyio/blob/4.12.1/pyproject.toml#L29-L33
      - https://github.com/agronholm/anyio/blob/4.12.1/src/anyio/_core/_sockets.py#L41-L42
      - https://github.com/agronholm/anyio/blob/4.12.1/src/anyio/_core/_sockets.py#L242-L248
      - https://github.com/agronholm/anyio/blob/4.12.1/src/anyio/_core/_sockets.py#L413-L415
  idna:
    purpose: >-
      AnyIO 4.12.1 uses idna to convert non-ASCII host names to IDNA-compatible
      ASCII before asynchronous address resolution. This is an indirect FastAPI
      runtime dependency through Starlette and AnyIO, not a direct FastAPI import.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml#L44-L50
      - https://github.com/Kludex/starlette/blob/4f250d6b814587e20c5365f0a5f0c4d42bcb929f/pyproject.toml#L33-L36
      - https://github.com/agronholm/anyio/blob/4.12.1/pyproject.toml#L29-L33
      - https://github.com/agronholm/anyio/blob/4.12.1/src/anyio/_core/_sockets.py#L609-L650
  fastapi-cli:
    purpose: FastAPI's CLI module delegates the console command to fastapi-cli.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/cli.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  flask:
    purpose: FastAPI's WSGI tutorial demonstrates mounting a Flask application.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/wsgi/tutorial001_py310.py
  gitpython:
    purpose: Translation automation opens and manipulates the project checkout with GitPython.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
  httpx:
    purpose: FastAPI re-exports Starlette TestClient; the selected Starlette implementation uses HTTPX for in-process requests.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/testclient.py
      - https://github.com/Kludex/starlette/blob/4f250d6b814587e20c5365f0a5f0c4d42bcb929f/starlette/testclient.py
  inline-snapshot:
    purpose: FastAPI tests use inline snapshots to pin observable values.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/test_security_http_digest.py
  itsdangerous:
    purpose: The `all` extra includes Starlette's signed-cookie SessionMiddleware support, which FastAPI marks as uncommon.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
      - https://github.com/Kludex/starlette/blob/4f250d6b814587e20c5365f0a5f0c4d42bcb929f/starlette/middleware/sessions.py
  jinja2:
    purpose: FastAPI re-exports Starlette's Jinja2Templates integration, whose implementation imports Jinja2.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/templating.py
      - https://github.com/Kludex/starlette/blob/4f250d6b814587e20c5365f0a5f0c4d42bcb929f/starlette/templating.py
  mypy:
    purpose: FastAPI's lint script runs mypy and its project config enables the Pydantic plugin.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/lint.sh
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  pydantic:
    purpose: FastAPI uses Pydantic models, fields, validation errors, and schemas throughout dependency resolution and OpenAPI generation.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/_compat/v2.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/dependencies/utils.py
  pydantic-ai:
    purpose: Translation automation uses Pydantic AI's Agent API to generate translations.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
  pydantic-core:
    purpose: FastAPI directly imports CoreSchema, PydanticUndefined, Url, and core-schema helpers.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/_compat/v2.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/encoders.py
  pydantic-extra-types:
    purpose: FastAPI conditionally recognizes Pydantic Extra Types' Color during JSON encoding.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/encoders.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  pydantic-settings:
    purpose: FastAPI's settings examples and repository automation instantiate Pydantic Settings models.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/settings/tutorial001_py310.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/sponsors.py
  pygithub:
    purpose: Translation and repository automation call GitHub APIs through PyGithub.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/translate.py
  pyjwt:
    purpose: FastAPI's OAuth2 tutorial uses PyJWT to sign and validate bearer tokens.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/security/tutorial005_py310.py
  python-multipart:
    purpose: FastAPI checks for python-multipart when a route declares form or file fields.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/dependencies/utils.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/params.py
  pytest:
    purpose: FastAPI's test command runs the repository suite with pytest.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/test.sh
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  pytest-codspeed:
    purpose: The benchmark and memory-benchmark suites use pytest-codspeed's `benchmark` fixture.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/tests/benchmarks/test_general_performance.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  pwdlib:
    purpose: FastAPI's OAuth2 password-hashing tutorial uses pwdlib's PasswordHash API.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/security/tutorial005_py310.py
  ruff:
    purpose: FastAPI's lint and format scripts run Ruff on application, test, docs, and script sources.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/lint.sh
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/format.sh
  sqlmodel:
    purpose: FastAPI's SQL tutorial apps use SQLModel for typed tables, sessions, and queries.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/sql_databases/tutorial001_py310.py
  starlette:
    purpose: FastAPI subclasses Starlette and imports its ASGI, routing, request, response, middleware, and WebSocket APIs.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/applications.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/routing.py
  strawberry-graphql:
    purpose: FastAPI's GraphQL guide defines a Strawberry schema and mounts its GraphQLRouter.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/graphql_/tutorial001_py310.py
  ty:
    purpose: FastAPI's lint script runs the ty type checker over the source configuration.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/scripts/lint.sh
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
  typing-extensions:
    purpose: FastAPI uses ParamSpec, TypedDict, deprecated, and other typing APIs at runtime and in public annotations.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/params.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/routing.py
  typing-inspection:
    purpose: FastAPI uses is_typealiastype while extracting dependency and endpoint annotations.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/fastapi/dependencies/utils.py
  uvicorn:
    purpose: FastAPI's debugging tutorial runs an ASGI app with Uvicorn; the standard extra is optional.
    evidence:
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/docs_src/debugging/tutorial001_py310.py
      - https://github.com/fastapi/fastapi/blob/95f8322ee1dcda7ceace7b1c4f6c9915b36d748f/pyproject.toml
