schema: fastapi-rs/benchmark-workload@1
id: fastapi.request.repeated-sequence-query.asgi
title: Repeated query values parsed and validated as an integer list
python_identity:
  implementation: CPython
  version: 3.12.13
input:
  path: tests/fixtures/inputs/parity/core-multi-query-errors-upstream.json
  case_id: fastapi.request.multi-query-errors.core-upstream
  action_id: repeated-valid-integers
correctness_gate:
  parity_runner: scripts/parity/run_first_slice.py
  parity_case_id: fastapi.request.multi-query-errors.core-upstream
  required_comparison: all-selected-cases-pass
  require_equal_untimed_observation:
  - status
  - body
subjects:
- id: fastapi-0.141.1
  kind: fastapi
  environment: oracle
- id: fastapi-rs-release
  kind: fastapi-rs
  environment: target
timing:
  boundary: direct ASGI per-request latency times only await app(scope, receive, send); sequential request-loop throughput also includes per-call setup, response observation, correctness checks, and loop bookkeeping
  includes:
  - Query string parsing and repeated-value extraction
  - Pydantic validation of the integer sequence
  - Endpoint invocation and JSON response construction
  - FastAPI-RS Python facade and PyO3 conversion overhead for the target
  excludes:
  - interpreter and module startup
  - app construction and route registration
  - ASGI scope and receive/send callback construction from per-request latency
  - response signature extraction and correctness checks from per-request latency
  - sequential loop bookkeeping from per-request latency
  - HTTP server startup and server-side request processing
  - network and HTTP client
  warmups: 50
  rounds: 5
  samples_per_round: 200
  concurrency: 1
  metrics:
  - "per-request latency nanoseconds: min, median, p95, p99, max, mean"
  - sequential request-loop throughput including per-call setup, response observation, correctness checks, and loop bookkeeping
  raw_samples: retain all per-request latency samples
reporting:
  fastapi_rs_over_fastapi: report median and p95 ratios only
