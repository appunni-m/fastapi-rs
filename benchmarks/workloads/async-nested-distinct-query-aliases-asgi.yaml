schema: fastapi-rs/benchmark-workload@1
id: fastapi.async-nested-distinct-query-aliases.asgi
title: Two distinct query aliases through one async nested dependency override
python_identity:
  implementation: CPython
  version: 3.12.13
input:
  path: tests/fixtures/inputs/parity/dependency-override-async-nested-two-required-query-wave.json
  case_id: fastapi.dependency-overrides.async-nested-two-distinct-query-aliases
  action_id: both-aliased-query-values-valid
correctness_gate:
  parity_runner: scripts/parity/run_first_slice.py
  parity_case_id: fastapi.dependency-overrides.async-nested-two-distinct-query-aliases
  required_comparison: all-selected-cases-pass
  require_equal_untimed_observation:
  - status
  - body
subjects:
- id: fastapi-0.141.1
  kind: fastapi
  environment: oracle
- id: fastapi-rs-release
  kind: fastapi-rs
  environment: target
timing:
  boundary: One direct ASGI request through an async nested override with two explicit query aliases
  includes:
  - FastAPI dependency override resolution and query extraction/validation
  - FastAPI-RS Python facade and PyO3 value conversion
  - FastAPI-RS native dependency resolution and query validation
  - ASGI application dispatch and response construction
  excludes:
  - interpreter and module startup
  - app construction and route registration
  - ASGI scope and receive/send callback construction
  - HTTP server startup and server-side request processing
  - network and HTTP client
  warmups: 50
  rounds: 5
  samples_per_round: 200
  concurrency: 1
  metrics:
  - "per-request latency nanoseconds: min, median, p95, p99, max, mean"
  - sequential request-loop throughput
  raw_samples: retain all per-request latency samples
reporting:
  fastapi_rs_over_fastapi: report median and p95 ratios only
  starlette_control: omitted because standalone Starlette has no FastAPI dependency injection semantics
