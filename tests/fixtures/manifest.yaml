  status: foundation-incomplete
  purpose: >-
    Compact, digest-backed source contract foundation. The referenced inventory
    and atlas are discovery/candidate artifacts; this file is not an exhaustive
    operation manifest, executable input specification, support declaration,
    or parity result.
  intended_denominator: >-
    The public FastAPI 0.141.1 Python API and its observable HTTP, WebSocket,
    lifecycle, validation, serialization, and OpenAPI integration behavior.
  implementation_gate: >-
    Complete and review the operation-level contract and identity checks;
    extend the Rust implementation and input workflows, and gate compatibility
    claims on fresh isolated oracle/target comparison results.

