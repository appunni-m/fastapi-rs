  - action_id: request-explicit
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /response/explicit
      query_string: value=indigo
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 41234
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_include_router_defaults_overrides.py
