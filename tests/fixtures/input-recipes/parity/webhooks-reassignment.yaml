schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/webhooks_reassignment.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.webhooks.router-reassignment-before-openapi
  actions:
  - action_id: inspect-reassigned-webhook-router-identity
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /_probe/webhook-identity
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: inspect-openapi-webhook-router-after-reassignment
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /webhooks
      comparison: exact
  source_evidence:
  - path: tests/test_webhooks_security.py
    kind: upstream_test
  - path: docs/en/docs/advanced/openapi-webhooks.md
    kind: upstream_documentation
- case_id: fastapi.webhooks.router-reassignment-after-openapi-cache
  actions:
