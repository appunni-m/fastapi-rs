schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/tutorial_additional_responses_file_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.tutorial-additional-responses.file-response
  actions:
  - action_id: return-file-response
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      method: GET
      path: /items/foo
      query_string: img=1
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_additional_responses/test_tutorial002.py
    kind: upstream_test
  - path: docs_src/additional_responses/tutorial002_py310.py
    kind: upstream_documentation_example
  - path: docs_src/additional_responses/tutorial004_py310.py
    kind: upstream_documentation_example
