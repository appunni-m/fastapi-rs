schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/plain_text_openapi.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.openapi.plain-text-response-class-media-type
  actions:
  - action_id: inspect-response-media-types
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /openapi.json
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1plain/get/responses/200
      - /paths/~1plain-without-media-type/get/responses/200
      comparison: exact
  source_evidence:
  - path: tests/test_default_response_class.py
    kind: upstream_test
  - path: docs/en/docs/advanced/custom-response.md
    kind: upstream_documentation
