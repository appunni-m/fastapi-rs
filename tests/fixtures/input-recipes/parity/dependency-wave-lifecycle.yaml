- case_id: fastapi.dependencies.websocket-yield-cleanup
  actions:
  - action_id: receive-inventory
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws/inventory
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.disconnect
      code: 1000
    observations:
    - kind: websocket
      selector: messages
      comparison: ordered
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: close_code
      comparison: exact
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /events
