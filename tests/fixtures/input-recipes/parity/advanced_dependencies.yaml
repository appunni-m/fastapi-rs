schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/advanced_dependencies.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.advanced-dependencies.matching-query
  actions:
  - action_id: matching-query
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query-checker/
      query_string: q=foobar
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/advanced-dependencies.md
    kind: upstream_documentation
  - path: docs_src/dependencies/tutorial011_an_py310.py
    kind: upstream_documentation
  - path: tests/test_tutorial/test_dependencies/test_tutorial011.py
    kind: upstream_test
- case_id: fastapi.docs.advanced-dependencies.nonmatching-query
  actions:
  - action_id: nonmatching-query
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query-checker/
      query_string: q=qwerty
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/advanced-dependencies.md
    kind: upstream_documentation
  - path: docs_src/dependencies/tutorial011_an_py310.py
    kind: upstream_documentation
  - path: tests/test_tutorial/test_dependencies/test_tutorial011.py
    kind: upstream_test
