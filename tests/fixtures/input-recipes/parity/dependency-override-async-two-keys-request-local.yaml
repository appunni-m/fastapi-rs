# Historical component-test provenance: the cache and override dimensions were
# reviewed alongside FastAPI 0.141.1's `test_sub_counter` and `test_override_simple`.
# Pinned FastAPI 0.157.0, commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1,
# builds direct edges in signature order at `fastapi/dependencies/utils.py:337-373`;
# `solve_dependencies` visits them in order, applies current overrides, and
# resolves/cache results at :700-762. The cache key at
# `fastapi/dependencies/models.py:83-97` includes the callable and scope data;
# `Depends.use_cache` defaults to true at `fastapi/params.py:790-795`. The route
# repeats two distinct direct dependencies, exposing one cache hit per key in
# each request. A second request exposes request-local lifetime. Both replacement
# callables are flat async functions that suspend at asyncio.sleep(0).
schema: fastapi-rs/python-asgi-workflow@15
workload:
  file: tests/fixtures/workloads/dependency_override_async_two_keys_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-two-keys-request-local
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  verification: parity
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-two-keys
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
    - {kind: workload_trace, selector: dependency.call_order, comparison: ordered}
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-two-keys
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
    - {kind: workload_trace, selector: dependency.call_order, comparison: ordered}
  source_evidence:
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
