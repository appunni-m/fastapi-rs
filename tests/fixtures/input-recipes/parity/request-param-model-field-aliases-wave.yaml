schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_param_model_aliases.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-param-model-alias.header-alias-valid
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /header
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - param_alias
        - amber
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_request_param_model_by_alias.py
    kind: upstream_test
