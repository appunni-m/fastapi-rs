schema: fastapi-rs/python-asgi-workflow@16
workload:
  file: tests/fixtures/workloads/uploadfile_spooled_storage.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.uploadfile-io.spooled-storage-thresholds
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: exact-threshold-equality-stays-in-memory
    kind: http_request
    scope: &uploadfile_spooled_scope
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /uploadfile-spooled-storage
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"mode":"threshold-equality"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: crossing-threshold-rolls-to-disk
    kind: http_request
    scope: *uploadfile_spooled_scope
    receive_events:
    - type: http.request
      body: '{"mode":"threshold-crossing"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: already-rolled-file-uses-rolled-path
    kind: http_request
    scope: *uploadfile_spooled_scope
    receive_events:
    - type: http.request
      body: '{"mode":"already-rolled"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
