# Pinned FastAPI 0.141.1 source evidence (tag commit
# 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f):
# fastapi/dependencies/utils.py:198-230 obtains each callable's inspect
# signature and resolves annotations from that signature; :271-347 recursively
# constructs dependencies and query fields. solve_dependencies at :623-638
# checks whether dependency_overrides is nonempty, selects the mapped callable
# or the original, and rebuilds EVERY edge, including unrelated and self maps.
# :640-681 recursively resolves child inputs before executing the selected
# sync, coroutine, or yielded callable, and :684-701 gathers query errors.
# fastapi/routing.py:853-869 captures the route's dependency declaration.
# fastapi/openapi/utils.py:334-378 reads that registered route.dependant for
# OpenAPI parameter generation; runtime reanalysis does not replace it.
# tests/test_dependency_overrides.py:10-48 and :208-257 exercise replacement
# callables, recursive overrides, and restoration by clearing the override map.
# tests/test_dependency_models.py:22-35 distinguish sync, coroutine, and yield
# callables; tests/test_dependency_contextmanager.py:23-48 and :73-87 exercise
# async children and yielded cleanup. The independent public callable mutations
# below combine these source rules; no upstream test asserts this exact
# post-registration signature-mutation workflow. Recipes store stimuli and
# exact observation selectors only. The last case reuses the reviewed
# target-only cleanup fault contract and is never executed by the oracle.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_override_signature_reanalysis.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependency-overrides.signature-reanalysis.sync-empty-map
  verification: parity
  factory_input: {map_mode: empty}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: optional-registered-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /direct
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &response-value
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: registered-query-after-signature-mutation
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /direct
      query_string: registered-value=5&live-value=not-an-integer
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty-request
    observations: *response-value
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_request_params/test_query/test_optional_str.py, kind: upstream_test}
