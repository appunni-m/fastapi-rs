schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/source_wave_b_annotations.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.source-wave-b.serialization.driver-class
  actions:
  - action_id: encode-driver-object
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /encoded/driver
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 41234
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_inherited_custom_class.py
    kind: upstream_test
