schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/pydantic_request_body_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.pydantic-request-body-wave.body-model.test-post-with-tax
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /products/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"Cedar","price":"50.5","description":"sample","tax":0.3}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body/test_tutorial002.py
    kind: upstream_test
