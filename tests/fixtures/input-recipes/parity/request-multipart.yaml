- case_id: fastapi.request-multipart.form.required-present
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /forms/required
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-www-form-urlencoded
      - - content-length
        - '11'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: value=amber
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
