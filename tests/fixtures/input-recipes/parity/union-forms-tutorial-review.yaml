      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /form-union/
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [content-type, application/x-www-form-urlencoded]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: 'name=John&company_name=Tech+Corp', more_body: false}
