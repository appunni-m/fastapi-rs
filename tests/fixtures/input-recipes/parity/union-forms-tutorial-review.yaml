- case_id: fastapi.request-union-forms.tutorial.openapi
  actions:
  - action_id: union-forms-openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
