- case_id: fastapi.docs.sql-databases.single-model.create-hero
  factory_input: {revision: single-model}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: create-single-model-hero
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /heroes/
      query_string: ''
      root_path: ''
      headers: [[content-type, application/json], [host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '{"name":"Ada","age":37,"secret_name":"The Analyst"}', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence: &single_model_sources
  - {path: docs/en/docs/tutorial/sql-databases.md, kind: upstream_documentation}
  - {path: docs_src/sql_databases/tutorial001_an_py310.py, kind: upstream_documentation_example}
  - {path: tests/test_tutorial/test_sql_databases/test_tutorial001.py, kind: upstream_test}

