  factory_input: {}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: first-resolved-child-value
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /nested
      query_string: seed=7
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &response-value
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: invalid-child-query
