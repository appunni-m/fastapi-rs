# Historical component-test provenance: FastAPI 0.141.1's dependency and
# context-manager tests supplied the neighboring shapes. Pinned FastAPI 0.157.0,
# commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, builds nested edges at
# `fastapi/dependencies/utils.py:314-389`; solving recursively resolves child
# dependencies and selects generator/coroutine/thread-pool execution at
# :700-762. Query validation follows at :763-785. Function and request cleanup
# stacks are created in `fastapi/routing.py:143-155`, and selected by scope at
# `fastapi/dependencies/utils.py:747-750`.
# Current source tests cover a sync generator with an async child at
# `tests/test_dependency_contextmanager.py:23-48`, nested yielded cleanup at
# :73-87, and sync endpoint error cleanup at :181-190. Callable categories are
# covered at `tests/test_dependency_models.py:133-139`; async override shapes
# at `tests/test_dependency_overrides.py:39-48`; and cache/no-cache behavior at
# `tests/test_dependency_cache.py:30-35` and :64-81. The uncached-child and
# query-aggregation combinations below remain independent inputs.
# The aggregation route adds an endpoint query field so the root also validates
# its own input after recursive dependency errors have been collected.
# These independent arithmetic graphs combine those source-backed rules with
# ordinary sync parents, deeper alternation, a replaced nested sync child, and
# an async yielded child. Actual resolved numbers and ordered state are public
# response observations, so returning a coroutine cannot satisfy the workflow.
# The final case reuses the reviewed target-only cleanup fault contract; the
# fault is never sent to the oracle. No expected outputs are stored here.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_sync_parent_nested_async.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.sync-parent-nested-async-query
