# Pinned FastAPI 0.141.1 source evidence (tag commit
# 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f):
# fastapi/dependencies/utils.py:294-332 recursively builds dependency edges;
# :623-654 re-analyzes overrides and awaits recursive child resolution before
# :660-676 enters generators, awaits coroutine callables, or invokes sync
# parents through the thread pool. Query validation occurs at :684-686.
# tests/test_dependency_contextmanager.py:23-24 and :45-48 already place an
# async child beneath a sync generator; :73-87 and :124-133 exercise nested
# yielded cleanup after normal completion and endpoint errors.
# tests/test_dependency_models.py:22-35 distinguish the callable categories;
# tests/test_dependency_overrides.py:39-48 declare async replacements.
# tests/test_dependency_cache.py:30-35 and :75-82 combine repeated dependency
# edges with use_cache=False and sequential requests. utils.py:640-661 solves
# children before looking up a cached parent; :681-697 validates a parent's own
# query fields even when :652-654 has already collected child errors. The
# uncached-child and query-aggregation cases observe these rules independently.
# The aggregation route adds an endpoint query field so the root also validates
# its own input after recursive dependency errors have been collected.
# These independent arithmetic graphs combine those source-backed rules with
# ordinary sync parents, deeper alternation, a replaced nested sync child, and
# an async yielded child. Actual resolved numbers and ordered state are public
# response observations, so returning a coroutine cannot satisfy the workflow.
# The final case reuses the reviewed target-only cleanup fault contract; the
# fault is never sent to the oracle. No expected outputs are stored here.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_sync_parent_nested_async.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.sync-parent-nested-async-query
  verification: parity
  factory_input: {}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: first-resolved-child-value
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /nested
      query_string: seed=7
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &response-value
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: invalid-child-query
