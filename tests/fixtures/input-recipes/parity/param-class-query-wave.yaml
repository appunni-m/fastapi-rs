schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/param_class_query_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.param-class.query-default-absent
  actions:
  - action_id: default-value
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_param_class.py
    kind: upstream_test
- case_id: fastapi.param-class.query-value-present
  actions:
  - action_id: provided-query-value
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: q=violet
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_param_class.py
    kind: upstream_test
