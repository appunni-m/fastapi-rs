schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/router_openapi_cache_after_include.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.router.include-context.openapi-cache-after-live-route
  actions:
  - action_id: observe-openapi-before-child-route
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: openapi
      json_pointers: [/paths/~1api~1later]
      comparison: exact
  - action_id: add-child-route-after-openapi-cache
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /_register-later
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
  - action_id: observe-openapi-after-child-route
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: openapi
      json_pointers: [/paths/~1api~1later]
      comparison: exact
  source_evidence:
  - path: tests/test_router_include_context.py
    kind: upstream_test
