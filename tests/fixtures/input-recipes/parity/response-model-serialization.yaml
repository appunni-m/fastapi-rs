  instantiate_per_case: true
cases:
- case_id: fastapi.response-model.include.nested
  actions:
  - action_id: include-selected-fields
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /include
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/tutorial/response-model.md
    kind: upstream_documentation
  - path: tests/test_response_model_include_exclude.py
    kind: upstream_test
