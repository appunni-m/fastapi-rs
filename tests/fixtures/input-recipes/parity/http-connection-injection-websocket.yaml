schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/http_connection_injection_websocket.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.http-connection-injection.http-app-state
  actions:
  - action_id: return-app-state-over-http
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state-http
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_http_connection_injection.py
    kind: upstream_test
  - path: docs/en/docs/reference/httpconnection.md
    kind: upstream_documentation
- case_id: fastapi.http-connection-injection.websocket-app-state
  actions:
  - action_id: send-app-state-over-websocket
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /state-stream
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.disconnect
      code: 1000
      reason: complete
    observations:
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: tests/test_http_connection_injection.py
    kind: upstream_test
