schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_models.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs-example-wave-f.multiple-body.two-models
  actions:
  - action_id: put-item-and-user
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /items/241
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"item":{"name":"Ash notebook","price":12.4,"description":"Linen cover","tags":["blue","lined"]},"user":{"username":"river-owl","display_name":"River"}}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs_src/body_multiple_params/tutorial002_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.docs-example-wave-f.multiple-body.embedded-model
  actions:
  - action_id: put-embedded-product
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /embedded-items
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"item":{"name":"Pine ruler","price":4.25,"tags":["metric","wood"]}}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs_src/body_multiple_params/tutorial005_py310.py
    kind: upstream_documentation_example
  - path: docs_src/body_multiple_params/tutorial005_an_py310.py
    kind: upstream_documentation_example
