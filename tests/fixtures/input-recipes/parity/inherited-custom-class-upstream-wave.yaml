      http_version: '1.1'
      method: GET
      scheme: http
      path: /get_custom_class
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_inherited_custom_class.py
    kind: upstream_test
