schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_forms.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-forms.form-default.test-form-default-url-encoded
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /defaults/urlencoded
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-www-form-urlencoded
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_form_default.py
    kind: upstream_test
