schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/dependency_yield_error_tutorials_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.advanced-dependencies.suppressed-yield-exception
  factory_input: {}
  construction_observation:
    kind: construction
    selectors:
    - outcome
    - exception_class
    - exception_message
    comparison: exact
  actions:
  - action_id: suppressed-default
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /suppress/default/portal-gun
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
    - kind: application_error
      selector: exception
      comparison: exact
  - action_id: observed-original-exceptions
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /exception-messages
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/advanced-dependencies.md
    kind: upstream_documentation
  - path: tests/test_tutorial/test_dependencies/test_tutorial008c.py
    kind: upstream_test
