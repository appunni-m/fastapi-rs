    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /path/param-le-ge-int/1
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      - body_json
      comparison: exact
  source_evidence:
  - path: tests/test_path.py
    kind: upstream_test
  verification: parity
