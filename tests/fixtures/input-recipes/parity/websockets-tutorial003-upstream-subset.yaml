schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/websockets_tutorial003_single_session_subset.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.websockets.tutorial003.home
  actions:
  - action_id: home
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_websockets/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/websockets_/tutorial003_py310.py
    kind: upstream_documentation
- case_id: fastapi.websockets.tutorial003.single-client-session
  actions:
  - action_id: single-client-session
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws/1234
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.receive
      text: Hello from 1234
    - type: websocket.disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: tests/test_tutorial/test_websockets/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/websockets_/tutorial003_py310.py
    kind: upstream_documentation
