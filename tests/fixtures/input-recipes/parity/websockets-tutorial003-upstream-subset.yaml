schema: fastapi-rs/python-asgi-workflow@6
workload:
  file: tests/fixtures/workloads/websockets_tutorial003_multi_session_subset.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.websockets.tutorial003.home
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: home
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_websockets/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/websockets_/tutorial003_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.websockets.tutorial003.single-client-session
  factory_input:
    websocket: true
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: single-client-session
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws/1234
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.receive
      text: Hello from 1234
    - type: websocket.disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
  - action_id: two-client-broadcast-and-disconnect
    kind: websocket_conversation
    sessions:
    - session_id: client-1234
      scope:
        type: websocket
        asgi:
          version: '3.0'
          spec_version: '2.5'
        http_version: '1.1'
        scheme: ws
        path: /ws/1234
        query_string: ''
        root_path: ''
        headers:
        - - host
          - testserver
        client:
        - 127.0.0.1
        - 123
        server:
        - testserver
        - 80
        subprotocols: []
    - session_id: client-5678
      scope:
        type: websocket
        asgi:
          version: '3.0'
          spec_version: '2.5'
        http_version: '1.1'
        scheme: ws
        path: /ws/5678
        query_string: ''
        root_path: ''
        headers:
        - - host
          - testserver
        client:
        - 127.0.0.1
        - 124
        server:
        - testserver
        - 80
        subprotocols: []
    steps:
    - session_id: client-1234
      kind: connect
    - session_id: client-5678
      kind: connect
    - session_id: client-1234
      kind: send_text
      text: Hello from 1234
    - session_id: client-1234
      kind: receive_next
    - session_id: client-5678
      kind: receive_next
    - session_id: client-1234
      kind: receive_next
    - session_id: client-5678
      kind: disconnect
      code: 1000
      reason: client complete
    - session_id: client-1234
      kind: receive_next
    - session_id: client-1234
      kind: disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: tests/test_tutorial/test_websockets/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/websockets_/tutorial003_py310.py
    kind: upstream_documentation_example
