schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/json_base64_bytes.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.json-base64-bytes.input-output-and-schema
  actions:
  - action_id: decode-base64-input
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /data
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"description":"sample","data":"aGVsbG8="}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: encode-base64-output
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /data
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: roundtrip-base64
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /data-in-out
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"description":"sample","data":"aGVsbG8="}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: base64-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: openapi
      json_pointers:
      - /components/schemas/DataInput/properties/data
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/json-base64-bytes.md
    kind: upstream_documentation
  - path: docs_src/json_base64_bytes/tutorial001_py310.py
    kind: upstream_documentation
  - path: tests/test_tutorial/test_json_base64_bytes/test_tutorial001.py
    kind: upstream_test
