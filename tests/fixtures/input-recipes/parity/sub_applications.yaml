  # Generic route behavior is from Starlette 1.6.0 at
  # starlette/starlette/routing.py; FastAPI's 405 body is in
  # fastapi/exception_handlers.py at the FastAPI 0.141.1 source pin.
  # Starlette builds the Allow value from a method set; its order varies with
  # the source process hash seed, so this 405 case selects deterministic status/body.
