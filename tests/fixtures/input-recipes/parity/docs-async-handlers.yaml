schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/docs_async_handlers.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.async-handlers.mixed-callables
  actions:
  - action_id: sync-endpoint
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /sync
      query_string: ''
      headers:
      - - host
        - testserver
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: async-endpoint
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /async
      query_string: ''
      headers:
      - - host
        - testserver
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/async.md
    kind: upstream_documentation
