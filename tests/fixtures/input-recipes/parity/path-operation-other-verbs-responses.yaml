schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/path_operation_other_verbs_responses.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.path-operation.other-verbs-responses-description
    actions:
      - action_id: compare-additional-response-descriptions
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /openapi.json
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status]
            comparison: exact
          - kind: openapi
            json_pointers:
              - /paths/~1app-get/get/responses/418
              - /paths/~1app-get/get/responses/501
              - /paths/~1app-post/post/responses/418
              - /paths/~1app-post/post/responses/501
              - /paths/~1app-put/put/responses/418
              - /paths/~1app-put/put/responses/501
              - /paths/~1app-delete/delete/responses/418
              - /paths/~1app-delete/delete/responses/501
              - /paths/~1app-patch/patch/responses/418
              - /paths/~1app-patch/patch/responses/501
              - /paths/~1app-head/head/responses/418
              - /paths/~1app-head/head/responses/501
              - /paths/~1app-options/options/responses/418
              - /paths/~1app-options/options/responses/501
              - /paths/~1app-trace/trace/responses/418
              - /paths/~1app-trace/trace/responses/501
              - /paths/~1router-get/get/responses/418
              - /paths/~1router-get/get/responses/501
              - /paths/~1router-post/post/responses/418
              - /paths/~1router-post/post/responses/501
              - /paths/~1router-put/put/responses/418
              - /paths/~1router-put/put/responses/501
              - /paths/~1router-delete/delete/responses/418
              - /paths/~1router-delete/delete/responses/501
              - /paths/~1router-patch/patch/responses/418
              - /paths/~1router-patch/patch/responses/501
              - /paths/~1router-head/head/responses/418
              - /paths/~1router-head/head/responses/501
              - /paths/~1router-options/options/responses/418
              - /paths/~1router-options/options/responses/501
              - /paths/~1router-trace/trace/responses/418
              - /paths/~1router-trace/trace/responses/501
            comparison: exact
    source_evidence:
      - path: tests/test_additional_responses_router.py
        kind: upstream_test
      - path: tests/test_tutorial/test_additional_responses/test_tutorial004.py
        kind: upstream_test
      - path: docs/en/docs/advanced/additional-responses.md
        kind: upstream_documentation
