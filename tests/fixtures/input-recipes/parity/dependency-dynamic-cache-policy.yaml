# Independent public inputs for raw dependency cache policies and their timing.
# Pinned FastAPI 0.141.1, commit 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f:
# params.py:745-754 and param_functions.py:2369,2460 retain arbitrary use_cache
# objects. dependencies/utils.py:285,328 copies those objects into each analyzed
# edge; :132-145 omits the supplied policy for parameterless declarations.
# :625-654 reanalyzes override edges, recursively solves children, and skips
# cache decisions for validation failures. :656-680 computes the original edge
# key, evaluates its raw policy before membership, then keeps the first cache
# insertion even when the policy is false. :681 onward validates parent inputs.
# routing.py:140-146 closes yielded scopes when policy evaluation raises.
# The workloads observe user callback traces, JSON values, object relationships,
# ordinary validation errors, and registered public exception responses. They
# neither import private source implementations nor store oracle results.
# BeforeValidator is a public user validation callback, recording whether
# repeated async edges validate inputs before consulting an existing cache.
# All error policies construct successfully; later route actions arm failures.
# One target-only case reuses the existing dependency cleanup fault contract.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_dynamic_cache_policy.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.dynamic-cache-policy.raw-capture
  verification: parity
  factory_input: {}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: registered-raw-policies-before-solving
    kind: http_request
    scope: &state-scope
      type: http
      asgi: &asgi {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state
      query_string: ''
      root_path: ''
      headers: &headers [[host, testserver]]
      client: &client [127.0.0.1, 123]
      server: &server [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &response-value
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: build-public-openapi-document
    kind: http_request
    scope: {type: http, asgi: *asgi, http_version: '1.1', method: GET, scheme: http,
      path: /openapi.json, query_string: '', root_path: '', headers: *headers,
      client: *client, server: *server}
    receive_events: *empty-request
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
  - action_id: inspect-policy-traces-after-openapi
    kind: http_request
    scope: *state-scope
    receive_events: *empty-request
    observations: *response-value
  - action_id: replace-marker-field-and-mutate-captured-object
    kind: http_request
    scope: {type: http, asgi: *asgi, http_version: '1.1', method: POST, scheme: http,
      path: /capture/rebind, query_string: '', root_path: '', headers: *headers,
      client: *client, server: *server}
    receive_events: *empty-request
    observations: *response-value
  - action_id: default-annotated-inferred-and-security-policy-use
    kind: http_request
    scope: {type: http, asgi: *asgi, http_version: '1.1', method: GET, scheme: http,
      path: /capture, query_string: '', root_path: '', headers: *headers,
      client: *client, server: *server}
    receive_events: *empty-request
    observations: *response-value
  source_evidence: &cache-reference
  - {path: docs/en/docs/reference/dependencies.md, kind: upstream_documentation}
  - {path: docs/en/docs/tutorial/dependencies/sub-dependencies.md, kind: upstream_documentation}
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
