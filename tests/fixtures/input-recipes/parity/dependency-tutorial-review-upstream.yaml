- case_id: fastapi.dependencies.tutorial-review.openapi-projection
  actions:
  - action_id: inspect-dependency-parameter-schema
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1library~1/get/parameters
      - /paths/~1members~1/get/parameters
      - /paths/~1catalog~1class~1/get/parameters
      - /paths/~1catalog~1untyped~1/get/parameters
      - /paths/~1catalog~1inferred~1/get/parameters
      - /paths/~1vault~1/get/parameters
      - /paths/~1search~1/get/parameters
      - /paths/~1library~1/get/responses/422/content/application~1json/schema/$ref
      - /paths/~1catalog~1class~1/get/responses/422/content/application~1json/schema/$ref
      - /paths/~1catalog~1untyped~1/get/responses/422/content/application~1json/schema/$ref
      - /paths/~1catalog~1inferred~1/get/responses/422/content/application~1json/schema/$ref
      - /paths/~1vault~1/get/responses/422/content/application~1json/schema/$ref
      - /paths/~1search~1/get/responses/422/content/application~1json/schema/$ref
      comparison: exact
