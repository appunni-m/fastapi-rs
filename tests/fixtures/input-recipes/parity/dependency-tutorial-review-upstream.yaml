    kind: upstream_documentation_example
  - path: docs_src/dependencies/tutorial002_py310.py
    kind: upstream_documentation_example
  - path: docs_src/dependencies/tutorial004_py310.py
    kind: upstream_documentation_example
  - path: docs_src/dependencies/tutorial006_py310.py
    kind: upstream_documentation_example
  - {path: tests/test_tutorial/test_dependencies/test_tutorial001_tutorial001_02.py, kind: upstream_test}
  - {path: tests/test_tutorial/test_dependencies/test_tutorial002_tutorial003_tutorial004.py, kind: upstream_test}
  - {path: tests/test_tutorial/test_dependencies/test_tutorial006.py, kind: upstream_test}
  - {path: tests/test_tutorial/test_dependencies/test_tutorial011.py, kind: upstream_test}
  - {path: docs_src/dependencies/tutorial001_py310.py, kind: upstream_documentation}
  - {path: docs_src/dependencies/tutorial002_py310.py, kind: upstream_documentation}
  - {path: docs_src/dependencies/tutorial004_py310.py, kind: upstream_documentation}
  - {path: docs_src/dependencies/tutorial006_py310.py, kind: upstream_documentation}
