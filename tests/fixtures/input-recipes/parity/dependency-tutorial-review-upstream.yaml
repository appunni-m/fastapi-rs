schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_tutorial_review_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.tutorial-review.basic-defaults
  actions:
  - action_id: omit-query-values
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /library/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: docs_src/dependencies/tutorial001_py310.py
    kind: upstream_documentation_example
  - {path: tests/test_tutorial/test_dependencies/test_tutorial001_tutorial001_02.py, kind: upstream_test}
  - {path: docs_src/dependencies/tutorial001_py310.py, kind: upstream_documentation}
