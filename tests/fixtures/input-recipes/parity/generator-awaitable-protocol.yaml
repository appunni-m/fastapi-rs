# Independent inputs for CPython 3.12.13 iterable-coroutine generators.
# FastAPI 0.141.1 utils.py:673-674 awaits a coroutine-classified call exactly once.
# A nongenerator sync routine marked through public inspect.markcoroutinefunction
# returns a generator created by public types.coroutine. It has no __wrapped__
# link to that generator function, avoiding the source yield-dependency branch.
# CPython v3.12.13 Objects/genobject.c:940-996 accepts a direct flagged generator
# as the original await iterator and rejects one returned from __await__.
# No expected outputs, source imports, fixture-ID dispatch, private marker/code
# mutation, timing assumptions, process addresses or output normalization.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/generator_awaitable_protocol.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.awaitables.generator-protocol.marked-immediate-validation-cache
  verification: parity
  factory_input: {suspension: immediate}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: invalid-input-before-any-generator-is-allocated
    kind: http_request
    scope:
      type: http
      asgi: &asgi {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /pair
      query_string: 'seed=invalid'
      root_path: ''
      headers: &headers [[host, testserver]]
      client: &client [127.0.0.1, 123]
      server: &server [testserver, 80]
    receive_events: &request [{type: http.request, body: '', more_body: false}]
    observations: &response
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  - action_id: observe-validation-suppression-and-entered-guard-cleanup
    kind: http_request
    scope: &state-scope {type: http, asgi: *asgi, http_version: '1.1', method: GET,
      scheme: http, path: /state, query_string: '', root_path: '', headers: *headers,
      client: *client, server: *server}
    receive_events: *request
    observations: *response
  - action_id: immediate-generator-return-with-cache-hit-and-uncached-repeat
    kind: http_request
    scope: &pair-scope {type: http, asgi: *asgi, http_version: '1.1', method: GET,
      scheme: http, path: /pair, query_string: 'seed=31', root_path: '', headers: *headers,
      client: *client, server: *server}
    receive_events: *request
    observations: *response
  - action_id: observe-original-marked-invocations-stop-values-and-response-boundaries
    kind: http_request
    scope: *state-scope
    receive_events: *request
    observations: *response
  source_evidence: &await-reference
  - {kind: upstream_documentation, path: docs/en/docs/async.md}
  - {kind: upstream_documentation, path: docs/en/docs/tutorial/dependencies/sub-dependencies.md}
  - {kind: upstream_documentation, path: docs/en/docs/tutorial/dependencies/dependencies-with-yield.md}
