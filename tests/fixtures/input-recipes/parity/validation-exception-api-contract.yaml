# Direct API import identity and constructor signatures for the two documented
# FastAPI validation exception classes.
# v10 reads the class docstring without constructing the reviewed public class.
schema: fastapi-rs/python-api-workflow@10
workload:
  file: tests/fixtures/workloads/validation_exception_api_contract.py
  factory: create_argument_bundles
  instantiate_per_case: true
cases:
  - case_id: fastapi.validation-exceptions.direct-api-contract
    probes:
      - probe_id: validation-exception-class-identities
        public_module:
          module: fastapi.exceptions
          bindings:
            - RequestValidationError
            - WebSocketRequestValidationError
        observations:
          - kind: python_import_path
            selector: import_path
            comparison: exact
          - kind: python_object_identity
            selector: object_identity
            comparison: exact
      - probe_id: request-validation-error-constructor-signature
        public_callable:
          module: fastapi.exceptions
          attribute: RequestValidationError
        argument_bundle: unused
        observations:
          - kind: python_signature
            selector: signature
            comparison: exact
      # FastAPI declares no class docstring, so this probes the public class's __doc__ value.
      - probe_id: request-validation-error-class-docstring
        public_callable:
          module: fastapi.exceptions
          attribute: RequestValidationError
        argument_bundle: unused
        observations:
          - kind: python_class_docstring
            selector: value
            comparison: exact
      - probe_id: websocket-request-validation-error-constructor-signature
        public_callable:
          module: fastapi.exceptions
          attribute: WebSocketRequestValidationError
        argument_bundle: unused
        observations:
          - kind: python_signature
            selector: signature
            comparison: exact
      - probe_id: request-validation-error-populated-constructor-input
        public_callable:
          module: fastapi.exceptions
          attribute: RequestValidationError
        argument_bundle: request-populated
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
      - probe_id: request-validation-error-nonmapping-context-input
        public_callable:
          module: fastapi.exceptions
          attribute: RequestValidationError
        argument_bundle: request-nonmapping-context
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
      - probe_id: websocket-validation-error-populated-constructor-input
        public_callable:
          module: fastapi.exceptions
          attribute: WebSocketRequestValidationError
        argument_bundle: websocket-populated
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
      - probe_id: websocket-validation-error-nonmapping-context-input
        public_callable:
          module: fastapi.exceptions
          attribute: WebSocketRequestValidationError
        argument_bundle: websocket-nonmapping-context
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
    source_evidence:
      - path: fastapi/exceptions.py
        kind: upstream_api_definition
        symbol_id: fastapi.exceptions.RequestValidationError
        sha256: 7d434e051748b142d4d139cef1a3418371e825ec89c57a7d515e83f3062ef652
      - path: fastapi/exceptions.py
        kind: upstream_api_definition
        symbol_id: fastapi.exceptions.WebSocketRequestValidationError
        sha256: 7d434e051748b142d4d139cef1a3418371e825ec89c57a7d515e83f3062ef652
