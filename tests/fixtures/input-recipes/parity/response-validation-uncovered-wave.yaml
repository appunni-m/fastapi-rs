schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/response_validation_uncovered_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-validation.pydantic.invalid-field
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: response-validation
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/invalid
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: application_error
      selector: validation_error_class
      comparison: exact
    - kind: application_error
      selector: validation_error_details
      comparison: exact
  source_evidence:
  - path: tests/test_validate_response.py
    kind: upstream_test
