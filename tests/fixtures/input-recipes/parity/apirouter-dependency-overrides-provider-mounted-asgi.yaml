# FastAPI 0.157.0 (commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1) declares
# `dependency_overrides_provider` on APIRouter at fastapi/routing.py:2467-2477
# and stores it at :2635. `add_api_route` passes it to APIRoute at :3046-3070;
# APIRoute carries it into `get_request_handler` at :1241-1278 and :1280-1304,
# which forwards it to dependency solving at :512-519. `solve_dependencies`
# reads the provider's current override mapping per edge at :700-719. The router
# is mounted so the ASGI request context is supplied while its explicit provider
# remains responsible for overrides.
schema: fastapi-rs/python-asgi-workflow@14
workload:
  file: tests/fixtures/workloads/apirouter_dependency_overrides_provider_asgi.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.routing.apirouter.dependency-overrides-provider-mounted-asgi
    factory_input:
      override_value: provider-value
    construction_observation:
      kind: construction
      selectors: [outcome, exception_class, exception_message]
      comparison: exact
    actions:
      - action_id: direct-router-request-uses-provider-override
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /api/provider
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status, headers, body, body_json]
            comparison: exact
    source_evidence:
      - path: tests/test_dependency_overrides.py
        kind: upstream_test
    verification: parity
