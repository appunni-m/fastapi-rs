schema: fastapi-rs/python-asgi-workflow@2
# Generic FileResponse semantics use the pinned sibling Starlette 1.6.0 source:
# ../starlette/tests/test_responses.py:716-727 covers FileResponse dispatch,
# and ../starlette/starlette/responses.py:311-382 reads path/status/stat_result
# while dispatching. Recipe v2's structured source_evidence is rooted only at
# FastAPI, so the workflow's consumer-path evidence remains the tutorial test.
workload:
  file: tests/fixtures/workloads/starlette_response_runtime.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-tutorial-test-custom-response-test-tutorial005.test-get
  actions:
  - action_id: request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /plain
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_custom_response/test_tutorial005.py
    kind: upstream_test
  - path: docs_src/custom_response/tutorial005_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.test.test-tutorial-test-custom-response-test-tutorial005.test-openapi-schema
  actions:
  - action_id: request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1plain/get
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_custom_response/test_tutorial005.py
    kind: upstream_test
