schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/streaming_runtime.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.streaming-runtime.stream-data-async-typed
  actions:
  - action_id: read-raster-async-typed
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /raster/async-typed
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_stream_data/test_tutorial002.py
    kind: upstream_test
