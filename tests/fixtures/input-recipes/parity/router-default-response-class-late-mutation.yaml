schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/router_default_response_class_late_mutation.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.include-router.default-response-class.late-assignment-before-materialization
  factory_input: {materialize_before_mutation: "false"}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: first-dispatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: openapi-after-dispatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: openapi, json_pointers: ['/paths/~1items/get/responses/200/content'], comparison: exact}
  source_evidence:
  - {path: tests/test_default_response_class_router.py, kind: upstream_test}
  - {path: tests/test_default_response_class.py, kind: upstream_test}
- case_id: fastapi.include-router.default-response-class.assignment-after-openapi-materialization
  factory_input: {materialize_before_mutation: "true"}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dispatch-after-materialization
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: cached-openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: openapi, json_pointers: ['/paths/~1items/get/responses/200/content'], comparison: exact}
  source_evidence:
  - {path: tests/test_default_response_class_router.py, kind: upstream_test}
  - {path: tests/test_default_response_class.py, kind: upstream_test}
