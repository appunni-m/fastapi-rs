schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/metadata_summary_description.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.metadata.summary-description.openapi-info
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers:
      - /info/summary
      - /info/description
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_metadata/test_tutorial001.py
    kind: upstream_test
  - path: docs_src/metadata/tutorial001_py310.py
    kind: upstream_documentation
