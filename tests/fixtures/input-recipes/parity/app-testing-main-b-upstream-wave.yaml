      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '{"id":"missing-title"}', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: openapi-header-and-item-schemas
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1items~1{item_id}/get/parameters
      - /paths/~1items~1/post/parameters
      - /paths/~1items~1/post/requestBody
      - /components/schemas/Item
      comparison: exact
