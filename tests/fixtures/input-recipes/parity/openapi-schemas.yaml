- case_id: fastapi.openapi.duplicate-models-openapi.openapi-schema
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths
      - /components/schemas
      comparison: exact
  source_evidence:
  - path: tests/test_duplicate_models_openapi.py
    kind: upstream_test
