schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/router_late_route_order_parity.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.router-late-route-order.static-before-catch-all
  factory_input: {scenario: late-static-before-catch-all}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: request-catalog-feature
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /catalog/featured
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_router_include_context.py, kind: upstream_test}
