# The two requests exercise a replacement's nested required query dependency.
# This is an independent input workflow; expected outputs are not stored here.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/dependency_override_required_subdependency_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependency-overrides.required-nested-query-parameter
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: missing-k
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: provide-k
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: k=bar
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
