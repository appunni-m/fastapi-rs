schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/sse.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-sse.test-sse-events-with-fields
  actions:
  - action_id: get-event-fields
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/stream-sse-event
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_sse.py
    kind: upstream_test
  - path: docs/en/docs/reference/sse.md
    kind: upstream_documentation
- case_id: fastapi.test.test-sse.test-raw-data-sent-without-json-encoding
  actions:
  - action_id: get-raw-data
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/stream-raw
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_sse.py
    kind: upstream_test
  - path: docs/en/docs/reference/sse.md
    kind: upstream_documentation
