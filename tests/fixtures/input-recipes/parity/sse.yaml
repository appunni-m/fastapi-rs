    - {case_id: crlf, data_str: "Hello\r\nWorld"}
    - {case_id: cr, data_str: "Hello\rWorld"}
    - {case_id: unicode-line-separator, data_str: "A\u2028B"}
    - {case_id: vertical-tab, data_str: "A\u000bB"}
    - {case_id: empty, data_str: ''}
    comment_cases: []
  construction_observation: *construction_ok
  actions:
