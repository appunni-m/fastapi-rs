schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/computed_fields_upstream.py
  factory: create_app_shared_schemas
  instantiate_per_case: true
cases:
- case_id: fastapi.responses.computed-fields.shared-schemas.upstream
  actions:
  - kind: http_request
    action_id: computed-field-on-response-model
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    action_id: computed-field-on-additional-response-model
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /responses
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    action_id: computed-field-readonly-output-schema
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1/get/responses/200
      - /paths/~1responses/get/responses/200
      - /components/schemas/Rectangle
      comparison: exact
  source_evidence:
  - path: tests/test_computed_fields.py
    kind: upstream_test
