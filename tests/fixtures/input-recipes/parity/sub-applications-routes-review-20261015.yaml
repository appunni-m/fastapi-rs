schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/atlas_testing_websocket_sub_applications.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.sub-applications.route-declarations-review
  actions:
  - action_id: top-level-route
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /app
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: mounted-route
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /subapi/sub
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/sub-applications.md
    kind: upstream_documentation
  - path: tests/test_tutorial/test_sub_applications/test_tutorial001.py
    kind: upstream_test
