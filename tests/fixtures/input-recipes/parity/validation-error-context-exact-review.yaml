- case_id: fastapi.validation-error-context.exact.websocket-endpoint
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: invalid-websocket-path
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /ws/invalid
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: workflow complete}
    observations:
    - {kind: application_error, selector: validation_error_class, comparison: exact}
  source_evidence:
  - {path: tests/test_validation_error_context.py, kind: upstream_test}
- case_id: fastapi.validation-error-context.exact.websocket-error-fields
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: invalid-path-and-dependency-values
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /ws/context/invalid
      query_string: limit=0
      root_path: ''
      headers:
      - [host, testserver]
      - [x-count, '0']
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: workflow complete}
    observations:
    - {kind: application_error, selector: validation_error_class, comparison: exact}
    - {kind: application_error, selector: exception, comparison: exact}
    - {kind: application_error, selector: validation_error_details, comparison: exact}
    - kind: application_error
      selector: error_public_attributes
      attributes: [args, endpoint_ctx, endpoint_function, endpoint_path, endpoint_file, endpoint_line]
      comparison: exact
  source_evidence:
  - {path: tests/test_validation_error_context.py, kind: upstream_test}
  - {path: tests/test_ws_router.py, kind: upstream_test}
