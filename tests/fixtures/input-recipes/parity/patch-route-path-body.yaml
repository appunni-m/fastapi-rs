# Isolated PATCH route and model-body stimulus based on FastAPI 0.141.1's
# extra-route test and body-updates tutorial.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/patch_route_path_body.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.patch.path-model-body
  actions:
  - action_id: dispatch-patch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: PATCH
      scheme: http
      path: /items/archive-17
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"Revised"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_extra_routes.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/body-updates.md
    kind: upstream_documentation
  - path: docs_src/body_updates/tutorial002_py310.py
    kind: upstream_documentation
