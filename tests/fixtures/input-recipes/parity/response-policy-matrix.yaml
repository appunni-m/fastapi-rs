- case_id: fastapi.response.openapi-content-and-models
  actions:
  - action_id: inspect-response-schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1opaque/get/responses/200
      - /paths/~1opaque/get/responses/500/content/application~1json/schema
      - /paths/~1array-errors/get/responses/500/content/application~1json/schema
      comparison: exact
