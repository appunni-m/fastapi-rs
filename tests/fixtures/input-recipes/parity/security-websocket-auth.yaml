schema: fastapi-rs/python-asgi-workflow@19
workload:
  file: tests/fixtures/workloads/security_websocket_auth.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.security-websockets.http-base.valid-credentials
  verification: parity
  factory_input:
    security_factory: http-base
    auto_error: true
  construction_observation:
    kind: construction
    selectors:
    - outcome
    - exception_class
    - exception_message
    comparison: exact
  actions:
  - action_id: http-base-valid-credentials
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - authorization
        - Other secret
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
      extensions:
        websocket.http.response: {}
    receive_events:
    - type: websocket.connect
    - type: websocket.disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
    - kind: websocket
      selector: close_code
      comparison: exact
  source_evidence:
  - path: tests/test_security_websockets.py
    kind: upstream_test
