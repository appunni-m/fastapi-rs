      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      comparison: exact
    - kind: openapi
      json_pointers:
      - /components/securitySchemes/HTTPBasic/type
      - /components/securitySchemes/HTTPBasic/scheme
