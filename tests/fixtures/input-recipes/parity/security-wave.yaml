schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/security_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.security-wave.http-base-scheme.test-security-http-base
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /security/base
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - authorization
        - Other sample-token
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_security_http_base.py
    kind: upstream_test
