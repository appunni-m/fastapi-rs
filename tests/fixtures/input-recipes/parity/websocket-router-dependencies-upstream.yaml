# These two cases cover APIRouter WebSocket dependency resolution and app-level
# overrides from test_ws_router.py. Route, validation, middleware, and handler
# cases are in websocket-router-routes-errors-upstream.yaml. Generic handshake
# behavior belongs to the Starlette-RS contract.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/websocket_router_dependencies_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-ws-router.test-router-ws-depends
  factory_input:
    dependency_override: false
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dependency-websocket
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /router-ws-depends/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
  source_evidence:
  - {path: tests/test_ws_router.py, kind: upstream_test}
- case_id: fastapi.test.test-ws-router.test-router-ws-depends-with-override
  factory_input:
    dependency_override: true
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: overridden-dependency-websocket
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /router-ws-depends/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
  source_evidence:
  - {path: tests/test_ws_router.py, kind: upstream_test}
