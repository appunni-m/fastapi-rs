schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/openapi_raw_yaml_body_full_document_review.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.openapi-extra.full-document-raw-yaml-body
    actions:
      - action_id: submit-raw-yaml-body
        kind: http_request
        scope:
          type: http
          asgi:
            version: '3.0'
            spec_version: '2.4'
          http_version: '1.1'
          scheme: http
          query_string: ''
          root_path: ''
          client: [127.0.0.1, 123]
          server: [testserver, 80]
          method: POST
          path: /documents
          headers:
            - [host, testserver]
            - [content-type, application/x-yaml]
        receive_events:
          - type: http.request
            body: "name: draft\nlabels:\n  - internal\n"
            more_body: false
        observations:
          - kind: http_response
            selectors: [body, status]
            comparison: exact
      - action_id: inspect-full-openapi-document
        kind: http_request
        scope:
          type: http
          asgi:
            version: '3.0'
            spec_version: '2.4'
          http_version: '1.1'
          scheme: http
          query_string: ''
          root_path: ''
          client: [127.0.0.1, 123]
          server: [testserver, 80]
          method: GET
          path: /openapi.json
          headers:
            - [host, testserver]
        receive_events:
          - type: http.request
            body: ''
            more_body: false
        observations:
          - kind: openapi
            json_pointers: ['']
            comparison: exact
    source_evidence:
      - path: tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial007.py
        kind: upstream_test
      - path: docs/en/docs/advanced/path-operation-advanced-configuration.md
        kind: upstream_documentation
