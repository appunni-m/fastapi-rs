schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/query_default_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.query-default-wave.optional-missing
  actions:
  - action_id: missing-query
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_query.py
    kind: upstream_test
  - path: docs/en/docs/reference/parameters.md
    kind: upstream_documentation
- case_id: fastapi.query-default-wave.optional-provided
  actions:
  - action_id: supplied-query
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: q=violet
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_query.py
    kind: upstream_test
  - path: docs/en/docs/reference/parameters.md
    kind: upstream_documentation
