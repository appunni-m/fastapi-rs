        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /tutorial001/items/
      query_string: q=teal
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_query_params_str_validations/test_tutorial001.py
    kind: upstream_test
