# Excluded direct FastAPI HTTP decorators remain dispatchable and do not enter OpenAPI.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/include_in_schema_methods.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.path-operation.include-in-schema.all-http-methods
  actions:
  - action_id: visible-route-control
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /visible
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: &empty_request
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: hidden-get-dispatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /hidden-get
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty_request
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: hidden-post-dispatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /hidden-post
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty_request
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: hidden-put-dispatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /hidden-put
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
