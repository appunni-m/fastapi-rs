schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/settings_app01_fastapi_surface.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-tutorial-test-settings-test-app01.test-app
  actions:
  - action_id: get-info
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      method: GET
      path: /info
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_settings/test_app01.py
    kind: upstream_test
- case_id: fastapi.test.test-tutorial-test-settings-test-app01.test-openapi-schema
  actions:
  - action_id: inspect-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      method: GET
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - ''
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_settings/test_app01.py
    kind: upstream_test
