schema: fastapi-rs/python-asgi-workflow@14
workload:
  file: tests/fixtures/workloads/dataclasses_tutorial002_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dataclasses.tutorial002.test-get-item
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: get-next-item
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/next
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      - body_json
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_dataclasses/test_tutorial002.py
    kind: upstream_test
- case_id: fastapi.dataclasses.tutorial002.test-openapi-schema
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: read-full-openapi-document
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers: ['']
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_dataclasses/test_tutorial002.py
    kind: upstream_test
