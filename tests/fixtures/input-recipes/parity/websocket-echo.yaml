schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/websocket_echo.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.websocket.echo-text
  actions:
  - action_id: echo-text-session
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws/echo
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.receive
      text: fastapi-rs
    - type: websocket.disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: close_code
      comparison: exact
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: tests/test_ws_router.py
    kind: upstream_test
  - path: docs/en/docs/advanced/websockets.md
    kind: upstream_documentation
- case_id: fastapi.websocket.echo-binary
  actions:
  - action_id: echo-binary-session
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws/echo-binary
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.receive
      bytes_base64: ABD/
    - type: websocket.disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: close_code
      comparison: exact
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: tests/test_ws_router.py
    kind: upstream_test
  - path: docs/en/docs/advanced/websockets.md
    kind: upstream_documentation
