schema: fastapi-rs/python-process-workflow@2
profiles:
  oracle: fastapi-0.157.0-starlette-1.6.0-cpython-3.12.13-core
  target: fastapi-rs-python-consumer
cases:
  - case_id: fastapi.cli.process.missing-optional-cli
    argv: [fastapi, --help]
    cwd:
      kind: isolated-tree
      files: []
    environment:
      set:
        COLUMNS: "100"
        LINES: "32"
        NO_COLOR: "1"
        PYTHONIOENCODING: utf-8
        TERM: dumb
      unset: [FASTAPI_ENV, FASTAPI_PUBLIC_URL, PORT]
    timeout_seconds: 20
    observations: [process.exit_code, process.stdout, process.stderr]
    execution: {kind: command}
    source_evidence:
      - path: tests/test_fastapi_cli.py
        kind: upstream_test
        sha256: c5256b040fd47757ef89e15c9193348af8eb1f5f38e13193a521ab0033133b8c
      - path: docs/en/docs/fastapi-cli.md
        kind: upstream_documentation
        sha256: ad3860dd30364ab774324d61580dd2b7b175e28a0a3fbd3fc1b2c5ec779ffe3f
      - path: fastapi/cli.py
        kind: upstream_implementation_source
        sha256: 72c378b14c969a4771d67acb15e28fdbf22f752db192e0e2c3c076b9babd6f0d
      - path: pyproject.toml
        kind: upstream_project_metadata
        sha256: f856aaf7e3718cbd294f9ef0f063072f6c2a7651e27ed6c2c113a0a80a2ae29e
      - path: uv.lock
        kind: upstream_lockfile
        sha256: 62147be0657e1be6cbe592f335f52429e814f1236524c607e1e4cf4b01913678
