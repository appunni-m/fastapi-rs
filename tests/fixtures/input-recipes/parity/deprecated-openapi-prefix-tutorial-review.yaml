  # Covers request-local OpenAPI server insertion: different request root paths
  # must not accumulate in the cached schema, and must not mutate caller-owned
  # server configuration. See the focused tests in the source module.
- case_id: fastapi.applications.root-path.request-local-server-isolation
  verification: parity
  factory_input:
    servers:
    - {url: https://prod.example.com}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: openapi-with-first-request-root-path
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: /path-a
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - {kind: openapi, json_pointers: [/servers], comparison: exact}
