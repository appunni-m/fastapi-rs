schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/deprecated_openapi_prefix_tutorial_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.root-path.configured-over-incoming-scope
  verification: parity
  factory_input:
    root_path: /api/v2
    root_path_in_servers: true
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: read-configured-root-path-through-middleware
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /inspect
      query_string: ''
      root_path: /untrusted
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: read-configured-root-path-openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: /untrusted
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - kind: openapi
      json_pointers: [/servers, /paths/~1inspect/get]
      comparison: exact
  source_evidence:
  - {path: tests/test_tutorial/test_behind_a_proxy/test_tutorial002.py, kind: upstream_test}
  - {path: docs/en/docs/advanced/behind-a-proxy.md, kind: upstream_documentation}
