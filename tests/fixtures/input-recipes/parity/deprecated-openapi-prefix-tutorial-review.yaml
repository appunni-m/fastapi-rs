schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/deprecated_openapi_prefix_tutorial_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.openapi.deprecated-openapi-prefix.route-and-openapi-review
  actions:
  - action_id: request-prefix-aware-route
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /inventory
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: request-openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - {kind: openapi, json_pointers: [/servers, /paths], comparison: exact}
  source_evidence:
  - {path: tests/test_deprecated_openapi_prefix.py, kind: upstream_test}
