schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/security_atlas_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.security-atlas-wave.api-key-cookie-description.default-name-openapi
  actions:
  - action_id: inspect-cookie-security-scheme
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /components/securitySchemes/APIKeyCookie
      - /paths/~1atlas~1cookie-key/get/security
      comparison: exact
  source_evidence:
  - path: tests/test_security_api_key_cookie_description.py
    kind: upstream_test
