# Focused independent subset of tests/test_response_model_as_return_annotation.py.
# Exact source line ranges are recorded below each case because source_evidence
# stores the pinned module path while this schema has no line-span field.
# Partial: the rest of the module's annotation/no-annotation combinations,
# submodel and forward-reference matrix, JSONResponse case, extra-field variants,
# and invalid response-model field construction error are not represented here.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/response_model_return_annotation_focused_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-model-return-annotation.decorator-precedence
  # Source: ../fastapi/tests/test_response_model_as_return_annotation.py:138-180, 412-425.
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: decorator-model-over-annotation
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /decorator-precedence
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_response_model_as_return_annotation.py, kind: upstream_test}
