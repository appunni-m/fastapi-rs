    probes:
      - probe_id: event-source-response-signature
        public_callable:
          module: fastapi.sse
          attribute: EventSourceResponse
        argument_bundle: unused
        observations:
          - {kind: python_signature, selector: signature, comparison: exact}
      - probe_id: event-source-response-class-docstring
        public_callable:
          module: fastapi.sse
          attribute: EventSourceResponse
        argument_bundle: unused
        observations:
          - {kind: python_class_docstring, selector: value, comparison: exact}
    source_evidence:
      - path: fastapi/sse.py
        kind: upstream_api_definition
        sha256: dbb674abc00eec4c4a416290384a5383de22b04fcd55cb87037dfe60bf7e3ebd
        symbol_id: fastapi.sse.EventSourceResponse
