schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/schema_extensions.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.schema.map-values-valid
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /maps
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      - - content-length
        - '32'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"values":{"north":3,"south":8}}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: tests/test_additional_properties.py
    kind: upstream_test
