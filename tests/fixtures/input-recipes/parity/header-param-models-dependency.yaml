schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/header_model_dependency.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.header-models-dependency.repeated-values
  actions:
  - action_id: dependency-receives-header-model
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - save-data
        - 'true'
      - - if-modified-since
        - yesterday
      - - traceparent
        - 00-1234567890abcdef1234567890abcdef-1234567890abcdef-01
      - - x-tag
        - one
      - - x-tag
        - two
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_header_param_models/test_tutorial001.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/header-param-models.md
    kind: upstream_documentation
