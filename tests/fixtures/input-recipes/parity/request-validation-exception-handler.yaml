    receive_events:
    - {type: http.request, body: '{"count":', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
  source_evidence:
  - {path: tests/test_tutorial/test_body/test_tutorial001.py, kind: upstream_test}
  - {path: tests/test_exception_handlers.py, kind: upstream_test}
- case_id: fastapi.request-validation-handler.default-precedes-server-error
  factory_input: {custom_validation_handler: false}
