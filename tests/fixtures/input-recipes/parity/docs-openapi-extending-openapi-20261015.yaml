schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/docs_openapi_extending_openapi_20261015.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.extending-openapi.normal-schema-route
  factory_input:
    scenario: default
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - kind: openapi
      json_pointers: [/info, /paths]
      comparison: exact
  source_evidence:
  - {path: docs/en/docs/how-to/extending-openapi.md, kind: upstream_documentation}
- case_id: fastapi.docs.extending-openapi.custom-logo-schema
  factory_input:
    scenario: custom
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - kind: openapi
      json_pointers: [/info, /paths, /info/x-logo]
      comparison: exact
  source_evidence:
  - {path: docs/en/docs/how-to/extending-openapi.md, kind: upstream_documentation}
