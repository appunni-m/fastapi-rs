# Independent input-only cases for selected FastAPI 0.141.1 tests/test_path.py behavior.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/path_validation_test_path_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.path-validation.test-path.integer.valid
  actions:
  - action_id: parse-valid-integer
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /path/int/42
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_path.py
    kind: upstream_test
