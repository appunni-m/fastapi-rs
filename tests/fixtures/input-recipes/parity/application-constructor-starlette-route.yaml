# Scope is a Starlette Route supplied directly through FastAPI(routes=...).
# This case does not exercise APIRouter.include_router.
# Pinned FastAPI 0.157.0 (commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1)
# declares `routes` at fastapi/applications.py:96-115 and passes them to
# APIRouter at :981-996. APIRouter forwards the supplied list to Starlette's
# Router at fastapi/routing.py:2427-2448 and :2606-2611.
# FastAPI APIRouter dispatches full matches before the first partial match at
# fastapi/routing.py:2793-2827, then performs slash fallback at :2829-2860.
# Current neighboring tests cover included-route partial/full matching and
# slash fallback at tests/test_router_include_context.py:675-733; this direct
# constructor-route workload is an independent input-only case.
# - Starlette 1.6.0 starlette/routing.py:684-705 records the first partial
#   match, dispatches a full match first, and otherwise dispatches that partial;
#   Route.handle at :271-280 raises HTTP 405 with its Allow header on mismatch.
# A POST-only constructor Route is partial for GET; a later FastAPI GET route is
# full. PUT checks the constructor route's first partial and one-token Allow
# value without relying on iteration order for Starlette's GET/HEAD method set.
# Starlette 1.6.0 Router.app checks alternate slash paths only after no original
# full/partial match, and redirects if any route matches the alternate path
# (starlette/routing.py:682-718). The final action checks that a constructor
# route receives this fallback and the redirect preserves the query string.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/application_constructor_starlette_route.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.constructor.starlette-route-dispatch
  actions:
  - action_id: get-later-fastapi-route-full-match
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /constructor-route
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  - action_id: post-constructor-route-full-match
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /constructor-route
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  - action_id: put-constructor-route-method-mismatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /constructor-route
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  - action_id: get-constructor-route-slash-redirect-preserves-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /catalog
      query_string: probe=1
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  source_evidence:
  - path: tests/test_router_include_context.py
    kind: upstream_test
  - path: tests/test_router_redirect_slashes.py
    kind: upstream_test
