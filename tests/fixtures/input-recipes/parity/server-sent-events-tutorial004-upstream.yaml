schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/server_sent_events_tutorials_upstream.py
  instantiate_per_case: true
  factory: create_tutorial004_app
cases:
- case_id: fastapi.tutorial.server-sent-events.tutorial004.resume-stream
