schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/server_sent_events_tutorials_upstream.py
  instantiate_per_case: true
  factory: create_tutorial005_app
cases:
- case_id: fastapi.tutorial.server-sent-events.tutorial005.post-chat-stream
  actions:
  - action_id: post-chat-stream
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /chat/stream
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"text":"hello world"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_server_sent_events/test_tutorial005.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/server-sent-events.md
    kind: upstream_documentation
  - path: docs_src/server_sent_events/tutorial005_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.tutorial.server-sent-events.tutorial005.openapi
  actions:
  - action_id: openapi-post-stream
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1chat~1stream/post
      - /components/schemas
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_server_sent_events/test_tutorial005.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/server-sent-events.md
    kind: upstream_documentation
  - path: docs_src/server_sent_events/tutorial005_py310.py
    kind: upstream_documentation
