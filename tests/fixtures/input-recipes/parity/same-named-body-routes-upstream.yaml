schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/same_named_body_routes.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.same-named-body-routes.north-body
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /north/calculate
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"units":4,"label":"north-stock"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_modules_same_name_body/test_main.py
    kind: upstream_test
- case_id: fastapi.same-named-body-routes.south-body
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /south/calculate/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"units":9,"label":"south-stock"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_modules_same_name_body/test_main.py
    kind: upstream_test
- case_id: fastapi.same-named-body-routes.invalid-north-body
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /north/calculate
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"units":"many","label":"north-stock"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_modules_same_name_body/test_main.py
    kind: upstream_test
- case_id: fastapi.same-named-body-routes.openapi-namespaces
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1north~1calculate/post
      - /paths/~1south~1calculate~1/post
      - /components/schemas
      comparison: exact
  source_evidence:
  - path: tests/test_modules_same_name_body/test_main.py
    kind: upstream_test
