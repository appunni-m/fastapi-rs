# FastAPI 0.141.1 requires Python >=3.10; the pinned oracle profile uses CPython 3.12.13.
# The v4 workflow captures warnings emitted by legacy on_event registration.
schema: fastapi-rs/python-asgi-workflow@4
workload:
  file: tests/fixtures/workloads/router_events_lifespan_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.lifecycle.router-events-legacy
  factory_input:
    application:
      legacy_on_event:
      - stage: startup
        marker: app-startup
        async: false
      - stage: shutdown
        marker: app-shutdown
        async: false
      routers:
      - legacy_on_event:
        - stage: startup
          marker: router-startup
          async: false
        - stage: shutdown
          marker: router-shutdown
          async: false
        routers:
        - legacy_on_event:
          - stage: startup
            marker: sub-router-startup
            async: false
          - stage: shutdown
            marker: sub-router-shutdown
            async: false
      routes:
      - path: /
        message: Hello World
    request_path: /
  construction_observation:
    kind: construction
    selectors: &id001
    - outcome
    - exception_class
    - exception_message
    comparison: exact
    capture_warnings: true
  actions:
  - action_id: lifespan
    kind: lifespan
    capture_warnings: true
    events:
    - lifespan.startup
    - lifespan.shutdown
    observations:
    - kind: asgi_lifespan
      selector: event_order
      comparison: ordered
    - kind: asgi_lifespan
      selector: startup
      comparison: exact
    - kind: asgi_lifespan
      selector: shutdown
      comparison: exact
    - kind: asgi_lifespan
      selector: application_errors
      comparison: exact
    - kind: asgi_lifespan
      selector: workload_trace
      comparison: ordered
  - action_id: request
    kind: http_request
    capture_warnings: true
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.0'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 12345
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_router_events.py
    kind: upstream_test
  - path: docs/en/docs/advanced/events.md
    kind: upstream_documentation
  - path: docs/en/docs/advanced/testing-events.md
    kind: upstream_documentation
