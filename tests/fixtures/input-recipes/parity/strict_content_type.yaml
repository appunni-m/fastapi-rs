schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/strict_content_type.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.strict-content-type.missing-header
  actions:
  - action_id: strict-default
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"sample","price":2.5}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: opt-out-mounted-app
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /legacy/items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"sample","price":2.5}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/strict-content-type.md
    kind: upstream_documentation
  - path: docs_src/strict_content_type/tutorial001_py310.py
    kind: upstream_documentation
  - path: tests/test_tutorial/test_strict_content_type/test_tutorial001.py
    kind: upstream_test
