schema: fastapi-rs/python-api-workflow@8
workload:
  file: tests/fixtures/workloads/direct_api_reference_wave.py
  factory: create_argument_bundles
  instantiate_per_case: true
cases:
  - case_id: fastapi.templating.module-and-alias-identity
    probes:
      - probe_id: module-identity
        public_module:
          module: fastapi.templating
          bindings:
            - Jinja2Templates
        observations:
          - kind: python_import_path
            selector: import_path
            comparison: exact
          - kind: python_object_identity
            selector: object_identity
            comparison: exact
      - probe_id: alias-identity
        public_callable:
          module: fastapi.templating
          attribute: Jinja2Templates
        argument_bundle: unused
        binding_identity:
          module: starlette.templating
          attribute: Jinja2Templates
        observations:
          - kind: python_binding_identity
            selector: binding_identity
            comparison: exact
      - probe_id: alias-signature
        public_callable:
          module: fastapi.templating
          attribute: Jinja2Templates
        argument_bundle: unused
        observations:
          - kind: python_signature
            selector: signature
            comparison: exact
    source_evidence:
      - path: fastapi/templating.py
        kind: upstream_api_definition
        symbol_id: fastapi.templating.Jinja2Templates
