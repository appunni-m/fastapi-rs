schema: fastapi-rs/python-asgi-workflow@2
oracle_profile_extension: standard-multipart
workload:
  file: tests/fixtures/workloads/request_file_form_tutorials_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-files-tutorial001.post-file-bytes
  actions:
  - action_id: submit-file
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /files/bytes
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - multipart/form-data; boundary=TutorialFileBoundary
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: "--TutorialFileBoundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"test.txt\"\
        \r\nContent-Type: text/plain\r\n\r\n<file content>\r\n--TutorialFileBoundary--\r\n"
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_request_files/test_tutorial001.py
    kind: upstream_test
  - path: docs_src/request_files/tutorial001_py310.py
    kind: upstream_documentation_example
