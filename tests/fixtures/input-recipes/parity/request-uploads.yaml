schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_uploads.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-uploads.optional-file-list.test-optional-bytes-list
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /optional-bytes
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - multipart/form-data; boundary=UploadBoundary7MA4YWxkTrZu0gW
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: "--UploadBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition: form-data; name=\"files\"; filename=\"\
        north.txt\"\r\nContent-Type: text/plain\r\n\r\nnorth\r\n--UploadBoundary7MA4YWxkTrZu0gW\r\nContent-Disposition:\
        \ form-data; name=\"files\"; filename=\"south.txt\"\r\nContent-Type: text/plain\r\n\r\nsouth\r\
        \n--UploadBoundary7MA4YWxkTrZu0gW--\r\n"
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_optional_file_list.py
    kind: upstream_test
