schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/inherited_app_url_path_for.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.url-path-for.included-router-context
  actions:
  - action_id: reverse-included-route
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /_probe/app-path
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: tests/test_router_include_context.py, kind: upstream_test}
  - path: docs/en/docs/tutorial/first-steps.md
    kind: upstream_documentation
