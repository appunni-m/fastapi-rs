schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/deprecated_form_pattern_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.regex-deprecated-body.form-omitted
  actions:
  - action_id: form-omitted
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /reference/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_regex_deprecated_body.py
    kind: upstream_test
- case_id: fastapi.regex-deprecated-body.form-pattern-match
  actions:
  - action_id: form-matching-pattern
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /reference/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-www-form-urlencoded
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: reference=ref-42
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_regex_deprecated_body.py
    kind: upstream_test
- case_id: fastapi.regex-deprecated-body.form-pattern-mismatch
  actions:
  - action_id: form-nonmatching-pattern
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /reference/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-www-form-urlencoded
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: reference=bad
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_regex_deprecated_body.py
    kind: upstream_test
- case_id: fastapi.regex-deprecated-body.form-openapi-schema
  actions:
  - action_id: form-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1reference~1/post/requestBody
      - /components/schemas
      comparison: exact
  source_evidence:
  - path: tests/test_regex_deprecated_body.py
    kind: upstream_test
