schema: fastapi-rs/python-api-workflow@5
workload:
  file: tests/fixtures/workloads/fastapi_constructor_extra_api.py
  factory: create_argument_bundles
  instantiate_per_case: true
cases:
  - case_id: fastapi.applications.constructor-debug
    probes:
      - probe_id: debug-keyword-construction
        public_callable:
          module: fastapi
          attribute: FastAPI
        argument_bundle: debug-true
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
      - probe_id: constructor-signature
        public_callable:
          module: fastapi
          attribute: FastAPI
        argument_bundle: unused
        observations:
          - kind: python_signature
            selector: signature
            comparison: exact
    source_evidence:
      - path: fastapi/applications.py
        kind: upstream_api_definition
        symbol_id: fastapi.FastAPI
        sha256: a87379cc9eee7164b450471278060a9a9745ac52d08e54844069afe7f94d0cca
  - case_id: fastapi.applications.constructor-openapi-prefix-rejected
    probes:
      - probe_id: removed-openapi-prefix-keyword
        public_callable:
          module: fastapi
          attribute: FastAPI
        argument_bundle: openapi-prefix-removed
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
    source_evidence:
      - path: fastapi/applications.py
        kind: upstream_api_definition
        symbol_id: fastapi.FastAPI
        sha256: a87379cc9eee7164b450471278060a9a9745ac52d08e54844069afe7f94d0cca
  - case_id: fastapi.applications.constructor-arbitrary-extra-keyword-rejected
    probes:
      - probe_id: arbitrary-extra-constructor-keyword
        public_callable:
          module: fastapi
          attribute: FastAPI
        argument_bundle: arbitrary-extra-keyword
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
    source_evidence:
      - path: fastapi/applications.py
        kind: upstream_api_definition
        symbol_id: fastapi.FastAPI
        sha256: a87379cc9eee7164b450471278060a9a9745ac52d08e54844069afe7f94d0cca
  - case_id: fastapi.applications.constructor-empty-version-rejected
    probes:
      - probe_id: empty-version-with-openapi-enabled
        public_callable:
          module: fastapi
          attribute: FastAPI
        argument_bundle: empty-version-openapi-enabled
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
    source_evidence:
      - path: fastapi/applications.py
        kind: upstream_api_definition
        symbol_id: fastapi.FastAPI
        sha256: a87379cc9eee7164b450471278060a9a9745ac52d08e54844069afe7f94d0cca
