    probes:
      - probe_id: empty-version-with-openapi-disabled
        public_callable:
          module: fastapi
          attribute: FastAPI
        argument_bundle: empty-version-openapi-disabled
        observations:
          - kind: python_call_outcome
            selector: outcome
            comparison: exact
    source_evidence:
      - path: fastapi/applications.py
        kind: upstream_api_definition
        symbol_id: fastapi.FastAPI
        sha256: a87379cc9eee7164b450471278060a9a9745ac52d08e54844069afe7f94d0cca
