schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/cors_middleware_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-tutorial-test-cors-test-tutorial001.test-cors
  actions:
  - action_id: preflight
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: OPTIONS
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - origin
        - https://localhost.tiangolo.com
      - - access-control-request-method
        - GET
      - - access-control-request-headers
        - X-Example
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: allowed-origin
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
