# Historical input provenance: FastAPI 0.141.1's
# `tests/test_dependency_overrides.py::test_override_simple` used the optional
# query override. Pinned FastAPI 0.157.0, commit
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, retains the override at
# `tests/test_dependency_overrides.py:39-40` and the test at :208-213.
# Current `solve_dependencies` initializes a missing cache at
# `fastapi/dependencies/utils.py:687-688`, rebuilds the override at :700-719,
# performs lookup at :738-743, awaits coroutine dependencies at :755-758, and
# stores a first result at :759-762. `Depends.use_cache` defaults to true at
# `fastapi/params.py:790-795`; cache keys are built at
# `fastapi/dependencies/models.py:83-97`. The workload repeats a direct edge
# and serves omitted-q then q=foo requests on one app to expose request-local reset.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_query_cache_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-query-cache-request-local
  actions:
  - action_id: omitted-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-cache
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: supplied-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-cache
      query_string: q=foo
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
