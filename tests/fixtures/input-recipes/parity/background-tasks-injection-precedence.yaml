schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/background_tasks_injection_precedence.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-response-dependency.test-background-tasks-with-depends-annotated.normal-response
  factory_input: {}
  construction_observation: &background-task-construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: normal-response
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /normal
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: normal-task-effects
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /events
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_response_dependency.py
    kind: upstream_test
  - path: docs_src/background_tasks/tutorial002_py310.py
    kind: upstream_documentation_example
  - path: docs_src/background_tasks/tutorial002_an_py310.py
    kind: upstream_documentation_example
  - path: docs/en/docs/tutorial/background-tasks.md
    kind: upstream_documentation
