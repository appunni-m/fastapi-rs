- case_id: fastapi.background.task-list.live-append-during-execution
  factory_input: {}
  construction_observation: *background-task-construction
  actions:
  - action_id: append-task-while-running
    kind: http_request
    scope:
      type: http
      asgi: &background-task-asgi {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /live-list
      query_string: ''
      root_path: ''
      headers: &background-task-headers [[host, testserver]]
      client: &background-task-client [127.0.0.1, 123]
      server: &background-task-server [testserver, 80]
    receive_events: &background-task-empty-request
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  - action_id: observe-live-list-mutation-effects
    kind: http_request
    scope:
      type: http
      asgi: *background-task-asgi
      http_version: '1.1'
      method: GET
      scheme: http
      path: /events
      query_string: ''
      root_path: ''
      headers: *background-task-headers
      client: *background-task-client
      server: *background-task-server
    receive_events: *background-task-empty-request
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - path: docs/en/docs/reference/background.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/background-tasks.md
    kind: upstream_documentation
