# Historical input provenance: FastAPI 0.141.1's
# `tests/test_dependency_overrides.py::test_override_simple` exercised the
# optional-query override against `/main-depends/` and `?q=foo`. Pinned FastAPI
# 0.157.0, commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, retains the async
# dependency/endpoint at `tests/test_dependency_overrides.py:10-16`, the
# override at :39-40, and the case at :208-213. Current dependency solving
# rebuilds overridden callables at `fastapi/dependencies/utils.py:700-719` and
# awaits/caches successful values at :721-762. This input-only pair keeps the
# public API shape and records no expected outputs.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_endpoint_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-endpoint-omitted-query
  actions:
  - action_id: omitted-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
- case_id: fastapi.dependencies.override-async-endpoint-supplied-query
  actions:
  - action_id: supplied-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: q=foo
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
