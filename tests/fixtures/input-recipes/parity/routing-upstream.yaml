schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/routing_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-custom-route-class.test-get-path
  actions:
  - action_id: outer
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /a
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: middle
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /a/b
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: inner
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /a/b/c
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_custom_route_class.py
    kind: upstream_test
- case_id: fastapi.test.test-custom-route-class.test-openapi-schema
  actions:
  - action_id: schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1a
      - /paths/~1a~1b
      - /paths/~1a~1b~1c
      comparison: exact
  source_evidence:
  - path: tests/test_custom_route_class.py
    kind: upstream_test
