- case_id: fastapi.routing.apiroute.get-route-handler.custom-subclass-nested-wrapper
  actions:
  - action_id: outer-request-response-wrapper
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /identity
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
  - action_id: middle-request-response-wrapper
