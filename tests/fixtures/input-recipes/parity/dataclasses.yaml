schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dataclasses.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.dataclasses.response-model-and-openapi
  actions:
  - action_id: dataclass-response
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/current
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: dataclass-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: openapi
      json_pointers:
      - /components/schemas/Item
      comparison: exact
  source_evidence:
  - path: docs_src/dataclasses_/tutorial002_py310.py
    kind: upstream_documentation_example
  - path: docs/en/docs/advanced/dataclasses.md
    kind: upstream_documentation
  - path: docs_src/dataclasses_/tutorial002_py310.py
    kind: upstream_documentation
  - path: tests/test_tutorial/test_dataclasses/test_tutorial002.py
    kind: upstream_test
