# Input-only cases corresponding to FastAPI 0.141.1 tests/test_query.py.
# The collection routes in the supplementary workload accept the requested
# trailing-slash paths directly; TestClient redirect-following is not selected.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/query_required_optional_integer_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.query-required-optional-integer.required-missing
  actions:
  - action_id: required-missing
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_query.py
    kind: upstream_test
