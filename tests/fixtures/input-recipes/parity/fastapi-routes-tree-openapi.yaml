schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/fastapi_routes_tree_openapi.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.routes.route-tree-openapi
  actions:
  - action_id: inspect-public-route-tree-and-openapi-input
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /inspect
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
  source_evidence:
  - path: docs/en/docs/how-to/extending-openapi.md
    kind: upstream_documentation
  - path: docs/en/docs/advanced/sub-applications.md
    kind: upstream_documentation
  - path: tests/test_router_include_context.py
    kind: upstream_test
