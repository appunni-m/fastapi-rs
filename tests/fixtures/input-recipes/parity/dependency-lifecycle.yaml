schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_lifecycle.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.cache-reuse
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /cache/reuse
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: next-request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /cache/reuse
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_dependency_cache.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/dependencies/sub-dependencies.md
    kind: upstream_documentation
