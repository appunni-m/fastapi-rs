# Historical component-test provenance: FastAPI 0.141.1's override, callable,
# and cache tests supplied the neighboring dimensions. Pinned FastAPI 0.157.0,
# commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, builds dependency edges in
# signature order at `fastapi/dependencies/utils.py:337-373`; request solving
# visits them in order, selects overrides, dispatches coroutine versus sync
# callables, and inserts values at :700-762. Current source tests cover async
# overrides at `tests/test_dependency_overrides.py:39-40` and :208-213,
# callable classification at `tests/test_dependency_models.py:133-139`, and
# sequential cache counters at `tests/test_dependency_cache.py:54-61`. This
# input combines those dimensions: a first direct sync dependency remains
# unoverridden, then a distinct direct dependency uses a flat async override,
# with both requests on the same app.
schema: fastapi-rs/python-asgi-workflow@15
workload:
  file: tests/fixtures/workloads/dependency_override_mixed_sync_async_direct_order_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-mixed-sync-async-direct-order-request-local
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  verification: parity
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /mixed-sync-async-direct-order
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
    - {kind: workload_trace, selector: dependency.call_order, comparison: ordered}
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /mixed-sync-async-direct-order
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
    - {kind: workload_trace, selector: dependency.call_order, comparison: ordered}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
  - {path: tests/test_dependency_models.py, kind: upstream_test}
