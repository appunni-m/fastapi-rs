schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_scope_websocket.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.websocket-function-scope-isolated
  actions:
  - action_id: function-scope-session
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws/function-scope
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.disconnect
      code: 1000
    observations:
    - kind: websocket
      selector: messages
      comparison: ordered
    - kind: websocket
      selector: close_code
      comparison: exact
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /events
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: function-scope-cleanup
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_dependency_yield_scope_websockets.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/dependencies/dependencies-with-yield.md
    kind: upstream_documentation
- case_id: fastapi.dependencies.websocket-request-scope-isolated
