schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/additional_response_status_keys_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.additional-responses.status-key-normalization.lowercase-range
  actions:
  - action_id: inspect-normalized-response-status-keys
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      method: GET
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1response-ranges/get/responses
      comparison: exact
  source_evidence:
  - path: tests/test_additional_responses_router.py
    kind: upstream_test
