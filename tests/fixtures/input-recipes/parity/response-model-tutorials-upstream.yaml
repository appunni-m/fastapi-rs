- case_id: fastapi.response-model.tutorial001-defaults-and-list-output
  actions:
  - kind: http_request
    action_id: list-items-with-model-defaults
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /tutorial001/items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    action_id: create-item-with-omitted-optional-fields
    scope:
      type: http
