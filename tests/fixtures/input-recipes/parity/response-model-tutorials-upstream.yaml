      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1tutorial001~1items~1/get/responses/200
      - /paths/~1tutorial001~1items~1/post/responses/200
      - /components/schemas/Tutorial001Item
