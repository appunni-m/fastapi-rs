schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/generate_unique_id_multi_methods.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.generate-unique-id-multi-method-route-view
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: route-state
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /observe
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1multi/get/operationId
      - /paths/~1multi/post/operationId
      - /paths/~1api~1included/get/operationId
      - /paths/~1api~1included/post/operationId
      comparison: exact
  source_evidence:
  - path: tests/test_generate_unique_id_function.py
    kind: upstream_test
  - path: docs/en/docs/advanced/generate-clients.md
    kind: upstream_documentation
