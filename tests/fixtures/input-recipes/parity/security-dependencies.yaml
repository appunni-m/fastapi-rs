- case_id: fastapi.docs.security.openapi
  actions:
  - action_id: inspect-security-schemes-and-operations
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      comparison: exact
    - kind: openapi
      json_pointers:
      - /components/securitySchemes/ArchiveKey/type
      - /components/securitySchemes/ArchiveKey/name
      - /components/securitySchemes/ArchiveKey/in
      - /components/securitySchemes/ContextKey/type
      - /components/securitySchemes/ContextKey/name
      - /components/securitySchemes/ContextKey/in
      - /components/securitySchemes/RecordOAuth2/type
      - /components/securitySchemes/RecordOAuth2/flows/password/tokenUrl
      - /components/securitySchemes/RecordOAuth2/flows/password/scopes/records:read
      - /components/securitySchemes/OptionalRecordOAuth2/type
      - /components/securitySchemes/OptionalRecordOAuth2/flows/password/tokenUrl
      - /paths/~1archive~1private/get/security
      - /paths/~1archive~1context/get/security
      - /paths/~1records~1{record_id}/get/security
      - /paths/~1preview/get/security
      comparison: exact
  source_evidence:
  - path: docs/en/docs/reference/security/index.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/security/first-steps.md
    kind: upstream_documentation
  - path: docs/en/docs/advanced/security/oauth2-scopes.md
    kind: upstream_documentation
  - path: docs_src/security/tutorial001_py310.py
    kind: upstream_documentation
  - path: docs_src/security/tutorial005_py310.py
    kind: upstream_documentation
