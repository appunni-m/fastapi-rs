schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/atlas_openapi_webhook_interface_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.atlas-openapi-tutorial.webhook-documentation
  actions:
  - action_id: webhook-openapi-document
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - ''
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_openapi_webhooks/test_tutorial001.py
    kind: upstream_test
  - path: docs/en/docs/advanced/openapi-webhooks.md
    kind: upstream_documentation
- case_id: fastapi.atlas-openapi-tutorial.webhook-adjacent-route
  actions:
  - action_id: read-independent-accounts
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /accounts/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_openapi_webhooks/test_tutorial001.py
    kind: upstream_test
  - path: docs/en/docs/advanced/openapi-webhooks.md
    kind: upstream_documentation
