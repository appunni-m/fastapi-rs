# Focused FastAPI and Starlette HTTP exceptions plus a pre-accept WebSocket rejection.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/public_errors_http_websocket_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.public-errors.http.fastapi-json-detail-and-header
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: fastapi-json-detail
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /errors/fastapi
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: docs/en/docs/tutorial/handling-errors.md, kind: upstream_documentation}
  - {path: tests/test_starlette_exception.py, kind: upstream_test}
- case_id: fastapi.public-errors.http.starlette-base-detail-and-header
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: starlette-base-detail
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /errors/starlette
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: docs/en/docs/tutorial/handling-errors.md, kind: upstream_documentation}
  - {path: tests/test_starlette_exception.py, kind: upstream_test}
- case_id: fastapi.public-errors.http.bodyless-status-with-detail
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: bodyless-status
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /errors/bodyless
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: docs/en/docs/tutorial/handling-errors.md, kind: upstream_documentation}
  - {path: tests/test_starlette_exception.py, kind: upstream_test}
- case_id: fastapi.public-errors.websocket.pre-accept-code-and-reason
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: reject-before-accept
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /errors/websocket
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: close_reason, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
  source_evidence:
  - {path: docs/en/docs/advanced/websockets.md, kind: upstream_documentation}
  - {path: docs/en/docs/reference/exceptions.md, kind: upstream_documentation}
  - {path: docs_src/websockets_/tutorial002_an_py310.py, kind: upstream_documentation}
  - {path: tests/test_tutorial/test_websockets/test_tutorial002.py, kind: upstream_test}
  - {path: tests/test_ws_router.py, kind: upstream_test}
