- case_id: fastapi.public-errors.websocket-disconnect.constructor-contract
  factory_input:
    websocket_disconnect_calls:
    - {label: omitted-arguments, args: [], kwargs: {}}
    - {label: positional-code, args: [1001], kwargs: {}}
    - {label: explicit-none-reason, args: [], kwargs: {code: 1002, reason: null}}
    - {label: empty-positional-reason, args: [1003, ''], kwargs: {}}
    - {label: truthy-keyword-reason, args: [], kwargs: {code: 1004, reason: client-left}}
    - {label: falsey-str-subclass, args: [1005], kwargs: {}, reason_behavior: falsey-str, reason_position: positional}
    - {label: reason-truthiness-error, args: [], kwargs: {code: 1006}, reason_behavior: raising-str}
    - {label: mutable-public-fields, args: [1007, initial], kwargs: {}, mutations: {code: 1010, reason: updated, marker: visible}}
    - {label: too-many-positional, args: [1008, supplied, extra], kwargs: {}}
    - {label: unexpected-keyword, args: [], kwargs: {unrecognized: true}}
    - {label: duplicate-code, args: [1009], kwargs: {code: 1011}}
