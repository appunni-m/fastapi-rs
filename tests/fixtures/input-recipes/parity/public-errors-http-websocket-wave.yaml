# Focused FastAPI and Starlette HTTP exceptions plus a pre-accept WebSocket rejection.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/public_errors_http_websocket_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.public-errors.http.fastapi-json-detail-and-header
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: fastapi-json-detail
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /errors/fastapi
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: docs/en/docs/tutorial/handling-errors.md, kind: upstream_documentation}
  - {path: tests/test_starlette_exception.py, kind: upstream_test}
