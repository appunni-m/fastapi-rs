schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/security_scopes_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.security.scopes.test-security-scopes-dependency-called-once
  actions:
  - action_id: request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /scopes/cache-once
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_security_scopes.py
    kind: upstream_test
- case_id: fastapi.security.scopes-dont-propagate.test-security-scopes-dont-propagate
