schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/app_constructor_route_defaults.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.constructor.route-defaults
  factory_input:
    deprecated: true
    include_in_schema: false
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-application-route-defaults
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /_observe/route-defaults
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: observe-schema-default-exclusion
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers: [/paths]
      comparison: exact
  source_evidence:
  - path: tests/test_include_router_defaults_overrides.py
    kind: upstream_test
