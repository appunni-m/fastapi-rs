- case_id: fastapi.docs.openapi-interface.advanced-openapi-callbacks.callback-operation
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /subscriptions
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      - - content-length
        - '75'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"callback_url":"https://hooks.example.invalid/record","event_id":"evt-28"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1subscriptions/post/callbacks
      - /paths/~1subscriptions/post/requestBody
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/openapi-callbacks.md
    kind: upstream_documentation
  - path: docs_src/openapi_callbacks/tutorial001_py310.py
    kind: upstream_documentation
