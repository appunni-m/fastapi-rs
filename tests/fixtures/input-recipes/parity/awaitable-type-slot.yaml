# CPython 3.12 data model section 3.3.12 specifies that implicit special-method
# lookup uses the object's type and bypasses its instance dictionary.
# https://docs.python.org/3.12/reference/datamodel.html#special-method-lookup
# The same request exercises marked dependency and endpoint return awaitables.
# Inputs and selectors only; expected outputs are never stored here.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/awaitable_type_slot.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.awaitables.type-slot.instance-shadowed-await-method
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dependency-and-endpoint-await-ignore-instance-shadow
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /probe
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  source_evidence:
  - {kind: upstream_documentation, path: docs/en/docs/async.md}
