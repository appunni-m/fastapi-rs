schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/path_params_tutorial004_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.path-params.tutorial004-path-converter
  actions:
  - action_id: nested-file-path
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /files/home/johndoe/myfile.txt
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: rooted-file-path
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /files//home/johndoe/myfile.txt
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params/test_tutorial004.py
    kind: upstream_test
- case_id: fastapi.path-params.tutorial004-openapi
  actions:
  - action_id: file-path-route-schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1files~1{file_path}/get
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params/test_tutorial004.py
    kind: upstream_test
