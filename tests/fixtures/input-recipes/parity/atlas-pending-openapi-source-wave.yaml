schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/atlas_pending_openapi_source_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.pending.openapi-source-wave.nested-model-request
  actions:
  - action_id: create-message
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /messages
      query_string: prompt=Morning%20light
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_no_schema_split.py
    kind: upstream_test
- case_id: fastapi.pending.openapi-source-wave.nested-model-openapi
  actions:
  - action_id: inspect-message-and-nested-schemas
