      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1messages/post
      - /components/schemas/MessageRecord
      - /components/schemas/MessageResult
      - /components/schemas/NestedEvent
      comparison: exact
  source_evidence:
  - path: tests/test_no_schema_split.py
    kind: upstream_test
