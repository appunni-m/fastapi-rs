schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/route_class_override.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.apirouter.add-api-route.route-class-override
  actions:
  - action_id: use-configured-route-class
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /default
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: use-per-route-override
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - path: tests/test_custom_route_class.py
    kind: upstream_test
  - path: tests/test_route_handler_wrapping.py
    kind: upstream_test
