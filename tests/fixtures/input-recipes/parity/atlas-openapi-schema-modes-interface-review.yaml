cases:
- case_id: fastapi.atlas-openapi-tutorial.split-schema-create
  actions:
  - action_id: create-split-record
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /split/records/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"label":"Comet"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_separate_openapi_schemas/test_tutorial001.py
    kind: upstream_test
  - path: docs/en/docs/how-to/separate-openapi-schemas.md
    kind: upstream_documentation
