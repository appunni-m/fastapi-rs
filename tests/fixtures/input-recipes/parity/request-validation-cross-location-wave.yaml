schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/request_validation_cross_location_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-validation.cross-location.path-query-body-aggregation
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dispatch-invalid-path-query-and-body
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /items/not-an-integer
      query_string: quantity=also-not-an-integer
      root_path: ''
      headers:
      - [host, testserver]
      - [content-type, application/json]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: '{"quantity":"still-not-an-integer"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
  source_evidence:
  - {path: tests/test_validation_error_context.py, kind: upstream_test}
  - {path: tests/test_multi_query_errors.py, kind: upstream_test}
  - {path: tests/test_multi_body_errors.py, kind: upstream_test}
