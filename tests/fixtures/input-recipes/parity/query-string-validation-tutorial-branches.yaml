          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /openapi.json
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: ['127.0.0.1', 123]
          server: [testserver, 80]
        receive_events: [{type: http.request, body: '', more_body: false}]
        observations:
          - {kind: http_response, selectors: [status, body], comparison: exact}
          - kind: openapi
            json_pointers: [/paths/~1tutorial001~1items~1/get/parameters/0]
            comparison: exact
    source_evidence:
      - {path: tests/test_tutorial/test_query_params_str_validations/test_tutorial001.py, kind: upstream_test}
