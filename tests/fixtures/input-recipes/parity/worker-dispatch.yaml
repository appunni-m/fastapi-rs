- case_id: fastapi.worker-dispatch.sync-endpoint-error-cleanup-and-recovery
  verification: parity
  factory_input: {endpoint_kind: sync, dependency_kind: async, response_mode: model,
    function_resource_kind: async, request_resource_kind: sync, failure_phase: endpoint}
  construction_observation: *construction
  actions: &error-recovery-actions
  - *probe-action
  - *state-action
  - &clear-action
    action_id: clear-user-callback-error
    kind: http_request
    scope: {type: http, asgi: *asgi, http_version: '1.1', method: POST,
      scheme: http, path: /configure/clear, query_string: '', root_path: '',
      headers: *headers, client: *client, server: *server}
    receive_events: *empty-request
    observations: *http-observations
  - action_id: invoke-user-endpoint-after-clearing-error
    kind: http_request
    scope: *probe-scope
    receive_events: *empty-request
    observations: *http-observations
  - action_id: read-completed-recovery-and-raw-send-traces
    kind: http_request
    scope: *state-scope
    receive_events: *empty-request
    observations: *http-observations
  source_evidence: *yield-source
