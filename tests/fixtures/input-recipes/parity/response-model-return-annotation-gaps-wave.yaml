# Supplemental input-only coverage for pending cases from the pinned FastAPI
# response-model return-annotation test module. The source function and endpoint
# line spans are recorded in comments and the mapping sidecar.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/response_model_return_annotation_gaps_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-model-return-annotation-gaps.forward-reference-list
  # Source endpoint: ../fastapi/tests/test_response_model_as_return_annotation.py:207-212.
  # Source test_no_response_model_annotation_forward_ref_list_of_model: 454-460.
  actions:
  - action_id: serve-forward-reference-list
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /forward-reference-list
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_response_model_as_return_annotation.py, kind: upstream_test}
