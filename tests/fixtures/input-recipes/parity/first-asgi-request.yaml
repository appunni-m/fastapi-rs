schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/first_slice.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.first-slice.create-item-valid
  actions:
  - action_id: post-item
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /items/41
      query_string: color=blue
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      - - content-length
        - '29'
      - - x-actor
        - reader
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"cable","quantity":2}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: tests/test_application.py
    kind: upstream_test
  - path: tests/test_param_in_path_and_dependency.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/first-steps.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/response-model.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/dependencies/index.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/header-params.md
    kind: upstream_documentation
