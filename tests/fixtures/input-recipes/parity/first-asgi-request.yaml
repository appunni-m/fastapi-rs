- case_id: fastapi.first-slice.openapi
  actions:
  - action_id: get-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1items~1{item_id}/post
      - /paths/~1items~1{item_id}/post/operationId
      - /paths/~1items~1{item_id}/post/parameters
      - /paths/~1items~1{item_id}/post/requestBody/content/application~1json/schema
      - /paths/~1items~1{item_id}/post/responses/201/content/application~1json/schema
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
