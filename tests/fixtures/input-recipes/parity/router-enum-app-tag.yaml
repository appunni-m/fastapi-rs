schema: fastapi-rs/python-asgi-workflow@13
workload:
  file: tests/fixtures/workloads/router_enum_app_tag.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.applications.include-router.enum-tag-openapi
    factory_input: {}
    construction_observation:
      kind: construction
      selectors: [outcome, exception_class, exception_message]
      comparison: exact
    actions:
      - action_id: included-route-dispatches
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /items
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status, body, body_json]
            comparison: exact
      - action_id: enum-tag-is-emitted
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /openapi.json
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status]
            comparison: exact
          - kind: openapi
            json_pointers: [/paths/~1items/get/tags]
            comparison: exact
    source_evidence:
      - path: tests/test_tutorial/test_path_operation_configurations/test_tutorial002b.py
        kind: upstream_test
      - path: docs_src/path_operation_configuration/tutorial002b_py310.py
        kind: upstream_documentation
    verification: parity
