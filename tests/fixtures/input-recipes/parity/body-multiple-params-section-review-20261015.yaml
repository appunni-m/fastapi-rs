schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_body_tutorial_source_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.body-multiple-params-section-review.two-models
  actions:
  - action_id: submit-two-model-body
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /source-review/multi/tutorial002/items/241
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: '{"item":{"name":"Ash notebook","price":12.4,"description":"Linen cover","tags":["blue","lined"]},"user":{"username":"river-owl","display_name":"River"}}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: inspect-two-model-request-schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1source-review~1multi~1tutorial002~1items~1{item_id}/put/requestBody/content/application~1json/schema
      - /components/schemas/Item
      - /components/schemas/User
      comparison: exact
  source_evidence:
  - path: docs/en/docs/tutorial/body-multiple-params.md
    kind: upstream_documentation
