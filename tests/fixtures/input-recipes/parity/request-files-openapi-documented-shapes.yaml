schema: fastapi-rs/python-asgi-workflow@2
oracle_profile_extension: standard-multipart
workload:
  file: tests/fixtures/workloads/request_files_openapi_documented_shapes.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-files.openapi-documented-shapes
  actions:
  - action_id: inspect-documented-request-schemas
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1files~1/post/requestBody
      - /components/schemas/Body_create_file_files__post
      - /paths/~1uploadfile~1/post/requestBody
      - /components/schemas/Body_create_upload_file_uploadfile__post
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_request_files/test_tutorial001.py
    kind: upstream_test
  - path: docs_src/request_files/tutorial001_an_py310.py
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/request-files.md
    kind: upstream_documentation
