schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/docs_types_frontend.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.reference-wave.types.typed-path-and-query-inputs
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /measure/5
      query_string: ratio=1.25&enabled=false
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1measure~1{count}/get/parameters
      comparison: exact
  source_evidence:
  - path: docs/en/docs/python-types.md
    kind: upstream_documentation
  - path: docs_src/python_types/tutorial005_py310.py
    kind: upstream_documentation
