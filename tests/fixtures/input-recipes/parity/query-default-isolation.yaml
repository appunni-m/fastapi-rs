schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/query_default_isolation.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.query-default-isolation.pydantic-undefined-is-required
  actions:
  - action_id: explicit-undefined-missing
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /undefined
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_query.py
    kind: upstream_test
- case_id: fastapi.query-default-isolation.invalid-default-is-validated
