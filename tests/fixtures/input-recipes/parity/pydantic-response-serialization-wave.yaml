- case_id: fastapi.pydantic-response-serialization-wave.no-inheritance.test-filter-top-level-model
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /users/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"email":"person@example.test","password":"local-secret"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_response_model_data_filter_no_inheritance.py
    kind: upstream_test
