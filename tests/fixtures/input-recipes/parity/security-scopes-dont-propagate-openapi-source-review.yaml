schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/security_scopes_dont_propagate_openapi_source_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.security.scopes-dont-propagate.nested-openapi-sibling-scopes
  actions:
  - action_id: inspect-nested-oauth-scope-projection
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /components/securitySchemes/OAuth2PasswordBearer/flows/password/scopes
      - /paths/~1catalog~1items/get/security
      comparison: exact
  source_evidence:
  - path: tests/test_security_scopes_dont_propagate.py
    kind: upstream_test
  - path: docs/en/docs/advanced/security/oauth2-scopes.md
    kind: upstream_documentation
