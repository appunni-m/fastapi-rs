schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/application_attributes.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.application.attributes.defaults
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-default-application-attributes
    kind: http_request
    scope: &attributes-observer-scope
      type: http
      asgi: &attributes-asgi
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /_observe/application-attributes
      query_string: ''
      root_path: ''
      headers: &attributes-headers
      - - host
        - testserver
      client: &attributes-client [127.0.0.1, 123]
      server: &attributes-server [testserver, 80]
    receive_events: &attributes-empty-request
    - type: http.request
      body: ''
      more_body: false
    observations: &attributes-json-response
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence: &attributes-source-evidence
  - path: docs/en/docs/tutorial/metadata.md
    kind: upstream_documentation

- case_id: fastapi.application.attributes.configured
  verification: parity
  factory_input:
    summary: Catalog service
    description: Catalog API description
    version: 2.4.1
    terms_of_service: https://example.com/terms
    contact:
      name: API Support
      email: support@example.com
    license_info:
      name: MIT
      identifier: MIT
    docs_url: /custom-docs
    redoc_url: /reference
    swagger_ui_parameters:
      displayRequestDuration: true
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-configured-application-attributes
    kind: http_request
    scope: *attributes-observer-scope
    receive_events: *attributes-empty-request
    observations: *attributes-json-response
  source_evidence: *attributes-source-evidence

- case_id: fastapi.application.attributes.summary-mutation-before-openapi
  verification: parity
  factory_input:
    summary: Initial summary
    _summary_after_init: Updated summary
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-mutated-summary-before-openapi
    kind: http_request
    scope: *attributes-observer-scope
    receive_events: *attributes-empty-request
    observations: *attributes-json-response
  source_evidence: *attributes-source-evidence

- case_id: fastapi.application.attributes.empty-summary
  verification: parity
  factory_input:
    summary: ''
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-empty-summary
    kind: http_request
    scope: *attributes-observer-scope
    receive_events: *attributes-empty-request
    observations: *attributes-json-response
  source_evidence: *attributes-source-evidence

- case_id: fastapi.application.attributes.summary-mutation-after-openapi-cache
  verification: parity
  factory_input:
    summary: Cached summary
    _summary_after_openapi: Updated summary
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-cached-openapi-summary-after-mutation
    kind: http_request
    scope: *attributes-observer-scope
    receive_events: *attributes-empty-request
    observations: *attributes-json-response
  source_evidence:
  - path: docs/en/docs/tutorial/metadata.md
    kind: upstream_documentation
  - path: docs/en/docs/how-to/extending-openapi.md
    kind: upstream_documentation

- case_id: fastapi.application.attributes.empty-docs-url
  verification: parity
  factory_input:
    docs_url: ''
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-empty-docs-url
    kind: http_request
    scope: *attributes-observer-scope
    receive_events: *attributes-empty-request
    observations: *attributes-json-response
  - action_id: swagger-ui-not-registered
    kind: http_request
    scope: &attributes-docs-probe-scope
      type: http
      asgi: *attributes-asgi
      http_version: '1.1'
      method: GET
      scheme: http
      path: /docs
      query_string: ''
      root_path: ''
      headers: *attributes-headers
      client: *attributes-client
      server: *attributes-server
    receive_events: *attributes-empty-request
    observations: &attributes-status-response
    - kind: http_response
      selectors: [status]
      comparison: exact
  - action_id: oauth2-redirect-not-registered-without-swagger-ui
    kind: http_request
    scope: &attributes-oauth2-probe-scope
      type: http
      asgi: *attributes-asgi
      http_version: '1.1'
      method: GET
      scheme: http
      path: /docs/oauth2-redirect
      query_string: ''
      root_path: ''
      headers: *attributes-headers
      client: *attributes-client
      server: *attributes-server
    receive_events: *attributes-empty-request
    observations: *attributes-status-response
  - action_id: redoc-remains-registered
    kind: http_request
    scope: &attributes-redoc-probe-scope
      type: http
      asgi: *attributes-asgi
      http_version: '1.1'
      method: GET
      scheme: http
      path: /redoc
      query_string: ''
      root_path: ''
      headers: *attributes-headers
      client: *attributes-client
      server: *attributes-server
    receive_events: *attributes-empty-request
    observations: *attributes-status-response
  source_evidence: *attributes-source-evidence

- case_id: fastapi.application.attributes.empty-redoc-url
  verification: parity
  factory_input:
    redoc_url: ''
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-empty-redoc-url
    kind: http_request
    scope: *attributes-observer-scope
    receive_events: *attributes-empty-request
    observations: *attributes-json-response
  - action_id: swagger-ui-remains-registered
    kind: http_request
    scope: *attributes-docs-probe-scope
    receive_events: *attributes-empty-request
    observations: *attributes-status-response
  - action_id: oauth2-redirect-remains-registered-with-swagger-ui
    kind: http_request
    scope: *attributes-oauth2-probe-scope
    receive_events: *attributes-empty-request
    observations: *attributes-status-response
  - action_id: redoc-not-registered
    kind: http_request
    scope: *attributes-redoc-probe-scope
    receive_events: *attributes-empty-request
    observations: *attributes-status-response
  source_evidence: *attributes-source-evidence
