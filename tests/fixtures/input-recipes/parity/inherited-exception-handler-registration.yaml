schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/inherited_exception_handler_registration.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.add-exception-handler.custom-exception
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /widget
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: docs/en/docs/tutorial/handling-errors.md, kind: upstream_documentation}
- case_id: fastapi.applications.add-exception-handler.status-code
  factory_input: {registration: status}
