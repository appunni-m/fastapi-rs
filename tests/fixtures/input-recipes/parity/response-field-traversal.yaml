# Inactive independent public inputs. No stored or prescribed outcomes.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/response_field_traversal.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-field-traversal.branch-second-construction-error-retry
  verification: parity
  factory_input:
    reject_once: second
    routes:
    - kind: include
      prefix: /branch
      routes:
      - {kind: route, path: /one, label: first, value: 17}
      - {kind: route, path: /two, label: second, value: 19}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - &state-before
    action_id: read-state-before
    kind: http_request
    scope: &state-scope
      type: http
      asgi: &asgi {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state
      query_string: ''
      root_path: ''
      headers: &headers [[host, testserver]]
      client: &client [127.0.0.1, 123]
      server: &server [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &http-observations
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
    - {kind: application_error, selector: exception, comparison: exact}
  - action_id: first-branch-request
    kind: http_request
    scope: &one-scope
      type: http
      asgi: *asgi
      http_version: '1.1'
      method: GET
      scheme: http
      path: /branch/one
      query_string: 'value=23'
      root_path: ''
      headers: *headers
      client: *client
      server: *server
    receive_events: *empty-request
    observations: *http-observations
  - action_id: read-state-after-first-branch-request
    kind: http_request
    scope: *state-scope
    receive_events: *empty-request
    observations: *http-observations
  - action_id: repeat-branch-request
    kind: http_request
    scope: *one-scope
    receive_events: *empty-request
    observations: *http-observations
  - action_id: read-state-after-repeat
    kind: http_request
    scope: *state-scope
    receive_events: *empty-request
    observations: *http-observations
  - action_id: request-second-own-route
    kind: http_request
    scope: &second-scope
      type: http
      asgi: *asgi
      http_version: '1.1'
      method: GET
      scheme: http
      path: /branch/two
      query_string: 'value=29'
      root_path: ''
      headers: *headers
      client: *client
      server: *server
    receive_events: *empty-request
    observations: *http-observations
  - &state-after
    action_id: read-state-after
    kind: http_request
    scope: *state-scope
    receive_events: *empty-request
    observations: *http-observations
  source_evidence: &include-evidence
  - {path: tests/test_router_include_context.py, kind: upstream_test}
  - {path: docs/en/docs/tutorial/bigger-applications.md, kind: upstream_documentation}
  - {path: docs/en/docs/tutorial/response-model.md, kind: upstream_documentation}

