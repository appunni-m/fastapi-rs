schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/response_class_no_mediatype.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-class-no-mediatype.openapi
  actions:
  - action_id: inspect-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /openapi.json
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers: [""]
      comparison: exact
  source_evidence:
  - path: tests/test_response_class_no_mediatype.py
    kind: upstream_test
