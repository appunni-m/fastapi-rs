schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/atlas_pending_callbacks_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.pending.callbacks-source-wave.invoice-request
  actions:
  - action_id: submit-invoice
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /invoices/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"id":"invoice-7","customer":"Rae","total":19.5}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_sub_callbacks.py
    kind: upstream_test
- case_id: fastapi.pending.callbacks-source-wave.callback-openapi
  actions:
  - action_id: inspect-route-and-inherited-callbacks
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1invoices~1/post/callbacks
      comparison: exact
  source_evidence:
  - path: tests/test_sub_callbacks.py
    kind: upstream_test
