schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/instance_openapi_method.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.instance-openapi-method.instance-replacement
  verification: parity
  factory_input:
    document:
      openapi: '3.1.0'
      info:
        title: OpenAPI Method Replacement Probe
        version: '1.0'
        x-method-observation: instance-replaced-openapi
      paths: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: read-openapi-from-instance-replacement
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers: [/info/x-method-observation]
      comparison: exact
  source_evidence:
  - path: docs/en/docs/how-to/extending-openapi.md
    kind: upstream_documentation
- case_id: fastapi.instance-openapi-method.generated-route-head
  verification: parity
  factory_input:
    document:
      openapi: '3.1.0'
      info:
        title: OpenAPI Method Replacement Probe
        version: '1.0'
        x-method-observation: instance-replaced-openapi
      paths: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: read-openapi-from-instance-replacement-with-head
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: HEAD
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
  source_evidence:
  - path: docs/en/docs/how-to/extending-openapi.md
    kind: upstream_documentation
