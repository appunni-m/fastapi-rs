schema: fastapi-rs/python-asgi-workflow@13
workload:
  file: tests/fixtures/workloads/apirouter_tags_post_construction_state.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.routing.apirouter.tags.post-construction-state
    factory_input: {}
    construction_observation:
      kind: construction
      selectors: [outcome, exception_class, exception_message]
      comparison: exact
    actions:
      - action_id: observe-constructor-tags
        kind: lifespan
        events: [lifespan.startup, lifespan.shutdown]
        observations:
          - kind: asgi_lifespan
            selector: event_order
            comparison: ordered
          - kind: asgi_lifespan
            selector: startup
            comparison: exact
          - kind: asgi_lifespan
            selector: shutdown
            comparison: exact
          - kind: asgi_lifespan
            selector: application_errors
            comparison: exact
          - kind: asgi_lifespan
            selector: workload_trace
            comparison: ordered
      - action_id: request-before-mutation
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /before
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status, body, body_json]
            comparison: exact
      - action_id: request-after-list-mutation
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /after-mutation
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status, body, body_json]
            comparison: exact
      - action_id: request-after-field-reassignment
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /after-assignment
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status, body, body_json]
            comparison: exact
      - action_id: inspect-openapi-tags
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /openapi.json
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status]
            comparison: exact
          - kind: openapi
            json_pointers:
              - /paths/~1before/get/tags
              - /paths/~1after-mutation/get/tags
              - /paths/~1after-assignment/get/tags
            comparison: exact
    source_evidence:
      - path: tests/test_router_include_context.py
        kind: upstream_test
    verification: parity
