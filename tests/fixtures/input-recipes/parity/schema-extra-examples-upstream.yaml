    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /examples/model-config/8
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"Compass","description":"A field notebook","price":28.5,"tax":1.4}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
