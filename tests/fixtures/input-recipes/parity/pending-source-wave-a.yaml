- case_id: fastapi.source-wave-a.uploads.file-request
  factory_input:
    scenario: upload-close
  construction_observation:
    kind: construction
    selectors:
    - outcome
    - exception_class
    - exception_message
    comparison: exact
  actions:
  - action_id: accept-upload
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /attachments
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - multipart/form-data; boundary=wave-a-boundary
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: "--wave-a-boundary\r\nContent-Disposition: form-data; name=\"file\"; filename=\"\
        field-notes.txt\"\r\nContent-Type: text/plain\r\n\r\nindependently authored\
        \ upload body\r\n--wave-a-boundary--\r\n"
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_datastructures.py
    kind: upstream_test
