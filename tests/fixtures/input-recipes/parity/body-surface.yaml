cases:
- case_id: fastapi.body.embedded-scalar-valid
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /labels
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      - - content-length
        - '18'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"label":"copper"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: tests/test_request_params/test_body/test_required_str.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/body.md
    kind: upstream_documentation
