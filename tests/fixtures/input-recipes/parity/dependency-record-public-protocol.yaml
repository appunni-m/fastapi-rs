# Independent public inputs for records returned by Depends and Security.
# Pinned FastAPI 0.141.1, commit 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f:
# params.py:745-754 declares frozen dataclasses, with Security inheriting
# Depends. param_functions.py:2283-2460 exposes keyword-only public factories
# that return those classes. Protocol observations below start from the types
# returned by those public factories; params aliases remain discovery evidence.
# CPython 3.12.13 dataclasses.py:629-681 derives repr, runtime-class equality,
# frozen assignment/deletion, and tuple hash from declared fields. :1278-1360
# supplies fields/is_dataclass/asdict and :1540-1582 implements replace.
# Generated initializers use CPython's Python-function keyword binding. The
# binding workload supplies str subclasses whose rich equality matches a
# parameter name or raises a user comparison error, and records the live
# comparison order, including the initializer's self parameter. Literal
# keyword spellings, accepted fields, and errors are never stored as results.
# dependencies/utils.py:120-142 builds parameterless dependencies with default
# caching, :391-475 selects the final Annotated FastAPI marker and infers a
# missing callable through dataclasses.replace, and :623-681 resolves/cache
# dependencies and enters yielded scopes. encoders.py's dataclass branch
# encodes through dataclasses.asdict. These independent workloads combine the
# source rules; reference docs and neighboring upstream tests do not contain
# these exact protocol scenarios. No expected outputs or oracle snapshots are
# stored here. Hash values use integer/bool-only tuples; other hash projections
# expose relationships or error classes, avoiding randomized None/callable
# hashes. All repr inputs are scalar records or deliberate self references.
# The last case reuses one target-only cleanup contract; the oracle never
# receives the injected fault.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_record_public_protocol.py
  factory: create_app
  instantiate_per_case: true
