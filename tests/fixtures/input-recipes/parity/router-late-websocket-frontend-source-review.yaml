- case_id: fastapi.router.include-context.late-frontend
  verification: parity
  factory_input:
    scenario: late-frontend
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: late-frontend-fallback
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /panel/v2/site/dashboard
      query_string: ''
      root_path: ''
      headers:
      - [host, testserver]
      - [accept, text/html]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
  source_evidence:
  - {path: tests/test_frontend.py, kind: upstream_test}
  - {path: docs/en/docs/tutorial/frontend.md, kind: upstream_documentation}
- case_id: fastapi.router.include-context.nested-late-api-websocket
