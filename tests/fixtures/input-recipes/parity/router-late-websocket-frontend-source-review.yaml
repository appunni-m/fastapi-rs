# Route additions are made after the public router inclusion calls. Inputs carry
# only request/session data; observed response and close values are not embedded.
schema: fastapi-rs/python-asgi-workflow@11
workload:
  file: tests/fixtures/workloads/router_late_websocket_frontend_source_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.router.include-context.late-api-websocket
  verification: parity
  factory_input:
    scenario: late-api-websocket
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: late-api-websocket
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /mount/v1/ws-api
      query_string: channel=green
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.receive, text: payload}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: close_reason, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
  source_evidence:
  - {path: tests/test_router_include_context.py, kind: upstream_test}
  - {path: tests/test_ws_router.py, kind: upstream_test}
