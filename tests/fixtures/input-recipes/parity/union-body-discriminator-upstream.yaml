schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/union_body_discriminator_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request.explicit-tagged-union-body-discriminator-upstream
  actions:
  - kind: http_request
    action_id: first-tagged-union-branch
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /items/
      query_string: q=first
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"value":"first","price":100}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    action_id: other-tagged-union-branch
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /items/
      query_string: q=other
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"value":"other","price":100.5}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    action_id: tagged-discriminator-request-schema
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1items~1/post/requestBody
      - /paths/~1items~1/post/parameters
      - /components/schemas/FirstItem
      - /components/schemas/OtherItem
      comparison: exact
  source_evidence:
  - path: tests/test_union_body_discriminator.py
    kind: upstream_test
