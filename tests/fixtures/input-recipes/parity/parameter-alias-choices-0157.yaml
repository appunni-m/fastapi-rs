schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/parameter_alias_choices_0157.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.parameter-alias-choices-0157.query-choice
  actions:
  - action_id: query-choice
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query
      query_string: second=7
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_query_alias_choices.py, kind: upstream_test}
- case_id: fastapi.parameter-alias-choices-0157.body-choice
  actions:
  - action_id: body-choice
    kind: http_request
