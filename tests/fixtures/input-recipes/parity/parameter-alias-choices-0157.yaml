- case_id: fastapi.parameter-alias-choices-0157.openapi
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - kind: openapi
      json_pointers:
      - /paths/~1query/get/parameters
      - /paths/~1body/post/requestBody
      - /paths/~1header/get/parameters
      - /paths/~1cookie/get/parameters
      - /paths/~1path~1{item_id}/get/parameters
      comparison: exact
  source_evidence:
  - {path: tests/test_body_alias_choices.py, kind: upstream_test}
  - {path: tests/test_header_cookie_alias_choices.py, kind: upstream_test}
  - {path: tests/test_path_alias_choices.py, kind: upstream_test}
  - {path: tests/test_query_alias_choices.py, kind: upstream_test}
