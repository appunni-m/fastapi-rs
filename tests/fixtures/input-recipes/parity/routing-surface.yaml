schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/routing_surface.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.include-router-prefix
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /v1/records/41
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: tests/test_include_route.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/bigger-applications.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/path-params.md
    kind: upstream_documentation
  - path: tests/test_route_scope.py
    kind: upstream_test
