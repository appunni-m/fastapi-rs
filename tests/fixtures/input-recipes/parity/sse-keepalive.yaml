schema: fastapi-rs/python-asgi-workflow@16
workload:
  file: tests/fixtures/workloads/sse_keepalive.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-sse.test-keepalive-ping-async
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: get-slow-async-sse
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /stream/async-idle
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_sse.py, kind: upstream_test}
  verification: parity
- case_id: fastapi.test.test-sse.test-keepalive-ping-sync
  factory_input: {}
