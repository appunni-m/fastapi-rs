# FastAPI rebuilds an overridden dependency from the replacement callable's
# signature. The required Header field is introduced after route registration.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_override_scalar_header.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependency-overrides.scalar-header.valid
  verification: parity
  factory_input: {}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: replacement-reads-converted-header-name
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /value
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [x-replacement-count, '7']]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &response
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_request_params/test_header/test_required_str.py, kind: upstream_test}
- case_id: fastapi.dependency-overrides.scalar-header.invalid
  verification: parity
  factory_input: {}
  construction_observation: *construction
  actions:
  - action_id: invalid-replacement-header
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /value
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [x-replacement-count, not-an-integer]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty-request
    observations: *response
  - action_id: invalid-header-does-not-invoke-replacement
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty-request
    observations: *response
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_request_params/test_header/test_required_str.py, kind: upstream_test}
- case_id: fastapi.dependency-overrides.scalar-header.missing
  verification: parity
  factory_input: {}
  construction_observation: *construction
  actions:
  - action_id: missing-replacement-header
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /value
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty-request
    observations: *response
  - action_id: missing-header-does-not-invoke-replacement
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events: *empty-request
    observations: *response
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_request_params/test_header/test_required_str.py, kind: upstream_test}
