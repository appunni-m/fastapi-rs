# The upstream no-body test covers 204. The 205/304 inputs separately exercise
# FastAPI's pinned is_body_allowed_for_status_code policy; no outputs are stored.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/response_bodyless_status_policy.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response.bodyless-status.205
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: response-model-205
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /bodyless/205
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  source_evidence:
  - {path: tests/test_response_code_no_body.py, kind: upstream_test}
- case_id: fastapi.response.bodyless-status.304
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: response-model-304
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /bodyless/304
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  source_evidence:
  - {path: tests/test_response_code_no_body.py, kind: upstream_test}
- case_id: fastapi.response.bodyless-status.304-validates-response-model
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: invalid-response-model-304
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /bodyless/304-invalid
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
    - {kind: application_error, selector: validation_error_class, comparison: exact}
    - {kind: application_error, selector: validation_error_details, comparison: exact}
  source_evidence:
  - {path: tests/test_response_model_as_return_annotation.py, kind: upstream_test}
