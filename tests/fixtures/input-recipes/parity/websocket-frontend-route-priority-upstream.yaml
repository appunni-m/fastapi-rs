# FastAPI route selection: an explicit WebSocket endpoint takes precedence over
# a colliding frontend asset. WebSocket handshake/message protocol behavior is
# covered by the Starlette-RS contract.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/websocket_frontend_route_priority_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-frontend.test-websocket-route-wins-over-frontend
  actions:
  - action_id: colliding-websocket-path
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /ws
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
    - {kind: websocket, selector: close_code, comparison: exact}
  source_evidence:
  - {path: tests/test_frontend.py, kind: upstream_test}
