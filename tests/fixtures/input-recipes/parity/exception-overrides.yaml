- case_id: fastapi.docs.handling-errors.overrides-openapi
  actions:
  - action_id: inspect-overridden-handler-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1orders~1{order_id}/get/parameters/0/schema/type
      - /paths/~1orders~1{order_id}/get/responses/422/content/application~1json/schema/$ref
      comparison: exact
  source_evidence:
