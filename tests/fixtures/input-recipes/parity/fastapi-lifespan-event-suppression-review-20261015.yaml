# FastAPI 0.141.1 input-only case for the documented lifespan/on_event boundary.
# The case shares the independent lifecycle workload and contains no expected output.
schema: fastapi-rs/python-asgi-workflow@4
workload:
  file: tests/fixtures/workloads/router_events_lifespan_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.lifecycle.lifespan-suppresses-legacy-events
  factory_input:
    application:
      lifespan:
        kind: async-context-manager
        startup_marker: lifespan-startup
        shutdown_marker: lifespan-shutdown
        state: null
      legacy_on_event:
      - stage: startup
        marker: legacy-startup
        async: false
      - stage: shutdown
        marker: legacy-shutdown
        async: false
      routes:
      - path: /
        message: Hello World
    request_path: /
  construction_observation:
    kind: construction
    selectors:
    - outcome
    - exception_class
    - exception_message
    comparison: exact
    capture_warnings: true
  actions:
  - action_id: lifespan
    kind: lifespan
    events:
    - lifespan.startup
    - lifespan.shutdown
    observations:
    - kind: asgi_lifespan
      selector: event_order
      comparison: ordered
    - kind: asgi_lifespan
      selector: startup
      comparison: exact
    - kind: asgi_lifespan
      selector: shutdown
      comparison: exact
    - kind: asgi_lifespan
      selector: application_errors
      comparison: exact
    - kind: asgi_lifespan
      selector: workload_trace
      comparison: ordered
  - action_id: request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.0'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 12345
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/events.md
    kind: upstream_documentation
