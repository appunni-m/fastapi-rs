schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_coercion.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-coercion.json-type.test-query-json-list
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /json/query
      query_string: values=%5B%22amber%22%2C%22teal%22%5D
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_json_type.py
    kind: upstream_test
- case_id: fastapi.request-coercion.get-request-body.test-get-with-body
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /product
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"name":"field-notes","price":12.5}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_get_request_body.py
    kind: upstream_test
- case_id: fastapi.request-coercion.strict-content-type.test-default-strict-rejects-no-content-type
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /strict/items
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"key":"value"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_strict_content_type_app_level.py
    kind: upstream_test
- case_id: fastapi.request-coercion.parameter-alias.test-query-model-with-alias
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /alias/query
      query_string: external_value=blue
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_request_param_model_by_alias.py
    kind: upstream_test
