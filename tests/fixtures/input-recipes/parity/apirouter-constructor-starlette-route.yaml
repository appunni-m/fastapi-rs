# Scope is plain Starlette HTTP and WebSocket routes supplied through
# APIRouter(routes=...) and included by FastAPI with a path prefix. This does
# not establish mixed declaration ordering or other BaseRoute families.
# Pinned source references:
# - FastAPI 0.141.1 fastapi/routing.py:2353-2374 declares deprecated routes;
#   :2532-2537 passes them to Starlette Router.
# - FastAPI fastapi/routing.py:1653-1677 rebuilds a generic Route using the
#   include prefix, endpoint, methods, name, and include_in_schema.
# - FastAPI fastapi/routing.py:1692-1700 rebuilds a generic WebSocketRoute using
#   the include prefix, endpoint, and name.
# - tests/test_router_include_context.py::test_no_prefix_include_validation_sees_effective_starlette_route_path
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/apirouter_constructor_starlette_route.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.apirouter.constructor-starlette-route-prefixed-dispatch
  actions:
  - action_id: get-prefixed-constructor-route
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /api/items
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  source_evidence:
  - {path: tests/test_router_include_context.py, kind: upstream_test}
- case_id: fastapi.routing.apirouter.constructor-starlette-websocket-prefixed-dispatch
  actions:
  - action_id: websocket-prefixed-constructor-route
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /api/socket
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: close_reason, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
  source_evidence:
  - {path: tests/test_ws_router.py, kind: upstream_test}
