# Historical input provenance: FastAPI 0.141.1's
# `tests/test_dependency_overrides.py::test_override_simple` supplied the async
# optional-query override. Pinned FastAPI 0.157.0, commit
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, retains it at
# `tests/test_dependency_overrides.py:39-40` and :208-213; optional query alias
# coverage remains in `tests/test_request_params/test_query/test_optional_str.py:95-146`.
# Current `analyze_param` selects/copies the declared annotation at
# `fastapi/dependencies/utils.py:423-514`; `request_params_to_args` applies its
# alias at :952-989. `solve_dependencies` rebuilds overrides and performs cache
# lookup/insertion at :700-762; Depends defaults to caching at
# `fastapi/params.py:790-795`. The fixture uses q/search and two requests on one
# app to expose alias handling through an override and request-local cache reset.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_query_alias_cache_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-query-alias-cache-request-local
  actions:
  - action_id: omitted-search
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-alias-cache
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: supplied-search
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-alias-cache
      query_string: search=foo
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
  - {path: tests/test_request_params/test_query/test_optional_str.py, kind: upstream_test}
