# Historical component-test provenance: FastAPI 0.141.1's
# `tests/test_dependency_overrides.py::test_override_with_sub_main_depends_k_bar`
# covers a nested required query override. Pinned FastAPI 0.157.0, commit
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, retains that test at
# `tests/test_dependency_overrides.py:252-257`; required query-alias behavior
# is covered separately in `tests/test_request_params/test_query/test_required_str.py`.
# Current `solve_dependencies` rebuilds and resolves overrides at
# `fastapi/dependencies/utils.py:700-733` and validates query fields at :763-785.
# This independent workflow composes two required scalar fields and distinct
# Query aliases; no upstream test asserts that exact combination. Inputs only,
# no expected outputs.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/dependency_override_async_nested_two_required_query_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependency-overrides.async-nested-two-required-query
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: both-query-values-missing
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: revision-missing
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: k=bar
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: revision-invalid
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: k=bar&revision=not-an-integer
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: both-query-values-valid
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /main-depends/
      query_string: k=bar&revision=7
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
