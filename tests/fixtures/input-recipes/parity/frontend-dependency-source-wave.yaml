schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/frontend_dependency_source_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.frontend.dependencies-nested-inclusion-order
  factory_input:
    scenario: nested-inclusion-order
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: nested-frontend-dependency-order
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /parent/child/ui/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_frontend.py
    kind: upstream_test
- case_id: fastapi.frontend.dependencies-override
  factory_input:
    scenario: dependency-override
  construction_observation:
    kind: construction
