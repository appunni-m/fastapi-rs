  - action_id: observe-background-and-cleanup-completion
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /yield/background-events
      query_string: ''
      root_path: ''
      headers:
      - - host
