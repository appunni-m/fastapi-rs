# Input-only coverage for the 68 tests/test_path.py request paths not linked by the existing path-validation recipe.
# Selector gate: these actions observe supported status and raw body bytes. Most corresponding source functions
# assert response.json() values; http.body.json is currently planned, so raw-byte equality is stricter and does
# not claim equivalent parsed-JSON parity. The recipe stores no expected outputs or measurements.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/path_test_input_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.path-matching.source-input-001
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /text
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_path.py
    kind: upstream_test
