      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /status
      query_string: ''
      root_path: ''
      headers:
      - - host
        - example.com
      client:
      - 127.0.0.1
      - 123
      server:
      - example.com
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/middleware.md
    kind: upstream_documentation
  - path: docs_src/advanced_middleware/tutorial001_py310.py
    kind: upstream_documentation_example
  - path: tests/test_tutorial/test_advanced_middleware/test_tutorial001.py
    kind: upstream_test
