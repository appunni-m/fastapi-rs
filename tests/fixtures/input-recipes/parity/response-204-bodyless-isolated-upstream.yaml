# Pinned FastAPI 0.141.1 source evidence: tests/test_response_code_no_body.py
# test_get_response asserts 204, no Content-Length, and an empty body. This
# independent workload records only the ASGI request and response selectors.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/response_204_bodyless_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response.bodyless-204-isolated
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: empty-response
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /empty
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: tests/test_response_code_no_body.py, kind: upstream_test}
  - {path: docs/en/docs/advanced/custom-response.md, kind: upstream_documentation}
