      http_version: '1.1'
      method: GET
      scheme: http
      path: /decode/request-type
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 41234
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_custom_request_and_route/test_tutorial001.py
    kind: upstream_test
  - path: docs_src/custom_request_and_route/tutorial001_py310.py
    kind: upstream_documentation
- case_id: fastapi.source-wave-b.custom-route.validation-context
