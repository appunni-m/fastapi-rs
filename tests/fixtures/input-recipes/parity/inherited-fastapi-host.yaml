schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/inherited_fastapi_host.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.host.named-subdomain-dispatch
  actions:
  - action_id: match-host-route
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /records/rec-281
      query_string: ''
      root_path: ''
      headers: [[host, blue.records.example]]
      client: [127.0.0.1, 123]
      server: [blue.records.example, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - path: docs/en/docs/tutorial/first-steps.md
    kind: upstream_documentation
