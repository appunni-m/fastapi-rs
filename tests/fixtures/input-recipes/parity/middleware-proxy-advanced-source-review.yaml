schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/middleware_proxy_source_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.middleware-proxy.https-redirect
  factory_input:
    scenario: https-redirect
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: secure-pass-through
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: https
      path: /
      query_string: ''
      root_path: ''
      headers: [[host, secure.example.net]]
      client: [127.0.0.1, 123]
      server: [secure.example.net, 443]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
  - action_id: insecure-redirect
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers: [[host, secure.example.net]]
      client: [127.0.0.1, 123]
      server: [secure.example.net, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers], comparison: exact}
  source_evidence:
  - path: tests/test_tutorial/test_advanced_middleware/test_tutorial001.py
    kind: upstream_test
  - path: docs_src/advanced_middleware/tutorial001_py310.py
    kind: upstream_documentation
  - path: docs/en/docs/advanced/middleware.md
    kind: upstream_documentation
- case_id: fastapi.middleware-proxy.trusted-host
  factory_input:
    scenario: trusted-host
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: accept-exact-host
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /status
      query_string: ''
      root_path: ''
      headers: [[host, example.net]]
      client: [127.0.0.1, 123]
      server: [example.net, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
  - action_id: accept-subdomain-host
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /status
      query_string: ''
      root_path: ''
      headers: [[host, api.example.net]]
      client: [127.0.0.1, 123]
      server: [api.example.net, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
  - action_id: reject-unlisted-host
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /status
      query_string: ''
      root_path: ''
      headers: [[host, unlisted.invalid]]
      client: [127.0.0.1, 123]
      server: [unlisted.invalid, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
  source_evidence:
  - path: tests/test_tutorial/test_advanced_middleware/test_tutorial002.py
    kind: upstream_test
  - path: docs_src/advanced_middleware/tutorial002_py310.py
    kind: upstream_documentation
  - path: docs/en/docs/advanced/middleware.md
    kind: upstream_documentation
- case_id: fastapi.middleware-proxy.gzip-response
  factory_input:
    scenario: gzip
    fill: r
    repeat: 4096
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: request-compressed-payload
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /compressed
      query_string: ''
      root_path: ''
      headers:
      - [host, testserver]
      - [accept-encoding, gzip]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers], comparison: exact}
  - action_id: request-uncompressed-status
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /status
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
  source_evidence:
  - path: docs_src/advanced_middleware/tutorial003_py310.py
    kind: upstream_documentation_example
  - path: tests/test_tutorial/test_advanced_middleware/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/advanced_middleware/tutorial003_py310.py
    kind: upstream_documentation
  - path: docs/en/docs/advanced/middleware.md
    kind: upstream_documentation
