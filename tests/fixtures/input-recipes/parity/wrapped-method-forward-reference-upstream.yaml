schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/wrapped_method_forward_reference_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.typing.wrapped-method-forward-reference
  actions:
  - action_id: post-wrapped-method
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /endpoint
      query_string: ''
      root_path: ''
      headers:
      - - content-type
        - application/json
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"input":{"x":0}}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: post-double-wrapped-method
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /endpoint2
      query_string: ''
      root_path: ''
      headers:
      - - content-type
        - application/json
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"input":{"x":0}}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_wrapped_method_forward_reference.py
    kind: upstream_test
