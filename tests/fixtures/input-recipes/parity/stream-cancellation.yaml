schema: fastapi-rs/python-asgi-workflow@5
workload:
  file: tests/fixtures/workloads/stream_cancellation.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.stream-cancellation.raw-async-generator
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: cancel-raw-stream
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.0'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /stream-raw
      query_string: ''
      root_path: ''
      headers: []
      client: null
      server: [test, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    receive_mode: wait_until_cancelled
    cancel_after_seconds: 0.05
    observations:
    - {kind: http_response, selectors: [status, headers], comparison: exact}
    - {kind: asgi_cancellation, selector: cancelled_caught, comparison: exact}
  source_evidence:
  - path: tests/test_stream_cancellation.py
    kind: upstream_test
  - path: docs/en/docs/advanced/custom-response.md
    kind: upstream_documentation
- case_id: fastapi.stream-cancellation.jsonl-async-generator
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: cancel-jsonl-stream
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.0'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /stream-jsonl
      query_string: ''
      root_path: ''
      headers: []
      client: null
      server: [test, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    receive_mode: wait_until_cancelled
    cancel_after_seconds: 0.05
    observations:
    - {kind: http_response, selectors: [status, headers], comparison: exact}
    - {kind: asgi_cancellation, selector: cancelled_caught, comparison: exact}
  source_evidence:
  - path: tests/test_stream_cancellation.py
    kind: upstream_test
  - path: docs/en/docs/advanced/custom-response.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/stream-json-lines.md
    kind: upstream_documentation
