schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/exception_handlers_test_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.exception-handlers.server-error-handler-response
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: server-error
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /service-fault
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: application_error, selector: validation_error_class, comparison: exact}
  source_evidence:
  - {path: tests/test_exception_handlers.py, kind: upstream_test}
- case_id: fastapi.test.exception-handlers.yield-dependency-error
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: dependency-error
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /dependency-fault
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: application_error, selector: validation_error_class, comparison: exact}
  source_evidence:
  - {path: tests/test_exception_handlers.py, kind: upstream_test}
