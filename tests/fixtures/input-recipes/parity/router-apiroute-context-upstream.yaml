schema: fastapi-rs/python-asgi-workflow@6
workload:
  file: tests/fixtures/workloads/router_apiroute_context_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.apiroute-state.direct
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: direct-route-state-and-context
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /direct/7
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
    - kind: application_error
      selector: exception
      comparison: exact
  source_evidence:
  - path: tests/test_custom_route_class.py
    kind: upstream_test
  - path: tests/test_router_include_context.py
    kind: upstream_test
- case_id: fastapi.routing.iter-route-contexts.nested-included
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: nested-effective-route-context
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /api/v1/items/7
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
    - kind: application_error
      selector: exception
      comparison: exact
  source_evidence:
  - path: tests/test_router_include_context.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/bigger-applications.md
    kind: upstream_documentation
