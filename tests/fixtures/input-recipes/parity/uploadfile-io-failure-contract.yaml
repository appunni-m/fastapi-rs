schema: fastapi-rs/python-asgi-workflow@16
workload:
  file: tests/fixtures/workloads/uploadfile_io_failure_contract.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.uploadfile-io.propagates-file-operation-errors
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: read-propagates-file-error
    kind: http_request
    scope: &uploadfile_io_error_scope
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /uploadfile-io/error
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"operation":"read"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: write-propagates-file-error-and-size-update
    kind: http_request
    scope: *uploadfile_io_error_scope
    receive_events:
    - type: http.request
      body: '{"operation":"write"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: seek-propagates-file-error
    kind: http_request
    scope: *uploadfile_io_error_scope
    receive_events:
    - type: http.request
      body: '{"operation":"seek"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: close-propagates-file-error
    kind: http_request
    scope: *uploadfile_io_error_scope
    receive_events:
    - type: http.request
      body: '{"operation":"close"}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
