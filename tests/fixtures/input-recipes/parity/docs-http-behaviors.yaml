schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/docs_http_behaviors.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.documentation-wave.http-behaviors.cors-preflight
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: OPTIONS
      scheme: http
      path: /resource
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - origin
        - https://console.example
      - - access-control-request-method
        - GET
      - - access-control-request-headers
        - x-client-tag
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/tutorial/cors.md
    kind: upstream_documentation
  - path: docs_src/cors/tutorial001_py310.py
    kind: upstream_documentation
