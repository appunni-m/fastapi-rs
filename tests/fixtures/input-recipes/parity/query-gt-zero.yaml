# Input-only Annotated query constraint cases based on FastAPI 0.141.1.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/query_gt_zero.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.query.gt-zero.positive-value
  actions:
  - action_id: submit-positive
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items
      query_string: size=0.1
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params_numeric_validations/test_tutorial006.py
    kind: upstream_test
  - path: docs_src/path_params_numeric_validations/tutorial006_an_py310.py
    kind: upstream_documentation
- case_id: fastapi.query.gt-zero.zero-rejected
  actions:
  - action_id: submit-zero
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items
      query_string: size=0.0
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params_numeric_validations/test_tutorial006.py
    kind: upstream_test
  - path: docs_src/path_params_numeric_validations/tutorial006_an_py310.py
    kind: upstream_documentation
- case_id: fastapi.query.gt-zero.lt-upper-bound-and-openapi
  actions:
  - action_id: submit-below-upper-bound
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items
      query_string: size=10.4
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: reject-upper-bound
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items
      query_string: size=10.5
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: query-schema-has-exclusive-maximum
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1items/get/parameters/0/schema
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params_numeric_validations/test_tutorial006.py
    kind: upstream_test
  - path: docs_src/path_params_numeric_validations/tutorial006_an_py310.py
    kind: upstream_documentation
