schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/ambiguous_query_annotations_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.ambiguous-params.query-annotations-inside-bounds
  actions:
  - action_id: inside-bounds
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /multi-query
      query_string: foo=7
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_ambiguous_params.py
    kind: upstream_test
