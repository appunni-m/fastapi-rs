# Input-only FastAPI validation-handler cases. Generic ASGI WebSocket session
# and exception dispatch mechanics remain Starlette-RS-owned.
schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/websocket_validation_handler_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.websocket-validation.default-handler-close
  factory_input: {custom_validation_handler: false}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: missing-header-default-close
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /depends-validate/
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: close_reason, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
  source_evidence:
  - {path: tests/test_ws_router.py, kind: upstream_test}
- case_id: fastapi.websocket-validation.custom-handler-close
  factory_input: {custom_validation_handler: true}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: invalid-path-custom-close
    kind: websocket_session
    scope:
      type: websocket
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      scheme: ws
      path: /ws/invalid
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
      subprotocols: []
    receive_events:
    - {type: websocket.connect}
    - {type: websocket.disconnect, code: 1000, reason: client complete}
    observations:
    - {kind: websocket, selector: close_code, comparison: exact}
    - {kind: websocket, selector: close_reason, comparison: exact}
    - {kind: websocket, selector: event_order, comparison: ordered}
    - {kind: websocket, selector: messages, comparison: ordered}
  source_evidence:
  - {path: tests/test_validation_error_context.py, kind: upstream_test}
  - {path: tests/test_ws_router.py, kind: upstream_test}
  - {path: docs/en/docs/tutorial/handling-errors.md, kind: upstream_documentation}
