schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/application_swagger_ui_oauth2_redirect_url.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.application.swagger-ui-oauth2-redirect-url.default-value
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: observe-default-redirect-field
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /_observe/swagger-ui-oauth2-redirect-url
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: default-redirect-route-is-registered
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /docs/oauth2-redirect
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
  source_evidence:
  - path: docs/en/docs/how-to/custom-docs-ui-assets.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/metadata.md
    kind: upstream_documentation

