schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/body_updates_tutorial001_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.body-updates.tutorial001.get-baz
  actions:
  - action_id: read-seeded-baz-item
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/baz
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body_updates/test_tutorial001.py
    kind: upstream_test
- case_id: fastapi.body-updates.tutorial001.put-bar
  actions:
  - action_id: replace-seeded-bar-item
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /items/bar
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: '{"name":"Barz","price":3,"description":null}'
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body_updates/test_tutorial001.py
    kind: upstream_test
- case_id: fastapi.body-updates.tutorial001.openapi-schema
  actions:
  - action_id: read-openapi-document
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body_updates/test_tutorial001.py
    kind: upstream_test
