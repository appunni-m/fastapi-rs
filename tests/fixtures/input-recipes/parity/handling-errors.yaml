schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/handling_errors.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.handling-errors.success
  actions:
  - action_id: read-existing-product
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /products/kettle
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/tutorial/handling-errors.md
    kind: upstream_documentation
