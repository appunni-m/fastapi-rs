      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1products~1{product_id}/get/parameters/0/in
      - /paths/~1products~1{product_id}/get/parameters/0/schema/type
      - /paths/~1products~1{product_id}/get/responses/422/content/application~1json/schema/$ref
      - /paths/~1quantities~1{quantity}/get/parameters/0/schema/type
      - /paths/~1quantities~1{quantity}/get/responses/422/content/application~1json/schema/$ref
      comparison: exact
