schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/core_multi_body_errors_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request.multi-body-errors.core-upstream
  actions:
  - action_id: single-valid-list-row
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /inventory/rows
      query_string: ''
      root_path: ''
      headers:
      - &id001
        - host
        - testserver
      - - content-type
        - application/json
      - - content-length
        - '32'
      client: &id002
      - 127.0.0.1
      - 123
      server: &id003
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '[{"label":"linen","quantity":5}]'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: constrained-decimal-error
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /inventory/rows
      query_string: ''
      root_path: ''
      headers:
      - *id001
      - - content-type
        - application/json
      - - content-length
        - '35'
      client: *id002
      server: *id003
    receive_events:
    - type: http.request
      body: '[{"label":"linen","quantity":-1.0}]'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: multiple-row-errors
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /inventory/rows
      query_string: ''
      root_path: ''
      headers:
      - *id001
      - - content-type
        - application/json
      - - content-length
        - '44'
      client: *id002
      server: *id003
    receive_events:
    - type: http.request
      body: '[{"quantity":"first"},{"quantity":"second"}]'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: openapi-list-row-schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - *id001
      client: *id002
      server: *id003
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - ''
      comparison: exact
  source_evidence:
  - path: tests/test_multi_body_errors.py
    kind: upstream_test
