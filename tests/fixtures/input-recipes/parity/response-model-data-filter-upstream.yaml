schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/response_model_data_filter_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-model-data-filter.subclass-input
  actions:
  - action_id: register-account
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /accounts/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"email":"johndoe@example.com","password":"secret"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_response_model_data_filter.py
    kind: upstream_test
- case_id: fastapi.response-model-data-filter.nested-subclass
