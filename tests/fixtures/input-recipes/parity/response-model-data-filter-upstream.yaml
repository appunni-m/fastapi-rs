      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_response_model_data_filter.py
    kind: upstream_test
- case_id: fastapi.response-model-data-filter.list-of-nested-subclasses
