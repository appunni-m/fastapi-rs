        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '0'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body_multiple_params/test_tutorial004.py
    kind: upstream_test
  - path: docs_src/body_multiple_params/tutorial004_an_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.body.gt-zero.zero-rejected
  actions:
