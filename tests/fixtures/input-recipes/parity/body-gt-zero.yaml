# Historical provenance: these scalar-body cases were adapted from FastAPI 0.141.1's
# body-multiple-params tutorial 004. Current FastAPI 0.157.0 keeps Body(gt=0) in
# docs_src/body_multiple_params/tutorial004_py310.py:25-26 and
# docs_src/body_multiple_params/tutorial004_an_py310.py:27-28;
# tests/test_tutorial/test_body_multiple_params/test_tutorial004.py:135-155
# still checks zero in the upstream multi-field body. This recipe retains its
# independent scalar-body inputs.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/body_gt_zero.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.body.gt-zero.positive-integer
  actions:
  - action_id: submit-positive
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /importance
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '3'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body_multiple_params/test_tutorial004.py
    kind: upstream_test
  - path: docs_src/body_multiple_params/tutorial004_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.body.gt-zero.annotated-positive-integer
  actions:
  - action_id: submit-annotated-positive
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /annotated-importance
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '3'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_body_multiple_params/test_tutorial004.py
    kind: upstream_test
  - path: docs_src/body_multiple_params/tutorial004_an_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.body.gt-zero.annotated-zero-rejected
  actions:
  - action_id: submit-annotated-zero
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
