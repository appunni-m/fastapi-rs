# Historical component-test provenance: FastAPI 0.141.1's
# `tests/test_dependency_overrides.py::test_override_simple` covered an async
# app-level override. Pinned FastAPI 0.157.0, commit
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, retains it at
# `tests/test_dependency_overrides.py:39-40` and :208-213. Current
# `solve_dependencies` visits edges in order at
# `fastapi/dependencies/utils.py:700-733`, collects recursive errors and skips
# the cache/call at :735-737, then validates the current dependant's query fields
# at :763-785. The successful coroutine and cache path is :738-762;
# `Depends.use_cache` defaults to true at `fastapi/params.py:790-795`. The
# combined repeated-edge error aggregation remains an independent input-only
# case. Four requests expose repeated errors, valid cache reuse, and that invalid
# input does not invoke the replacement.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_query_validation_aggregation.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-query-validation-aggregation
  actions:
  - action_id: omitted-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-validation
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: valid-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-validation
      query_string: q=42
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: invalid-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-validation
      query_string: q=oops
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: request-after-invalid-query
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-query-validation
      query_string: q=43
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
