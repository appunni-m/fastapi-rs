  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-default-response-class.test-app
  actions:
  - action_id: application-default
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: tests/test_default_response_class.py, kind: upstream_test}
  - {path: docs_src/custom_response/tutorial010_py310.py, kind: upstream_documentation_example}
