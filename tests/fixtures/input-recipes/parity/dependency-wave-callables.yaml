schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_wave_callables.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.callable-instances-and-methods
  actions:
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /class/callables
      query_string: value=maple
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: instance-shapes
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /class/methods
      query_string: value=maple
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: bound-method-shapes
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /functions
      query_string: value=maple
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: function-shapes
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_dependency_class.py
    kind: upstream_test
  - path: tests/test_dependency_models.py
    kind: upstream_test
