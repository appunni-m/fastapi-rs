# Originally mapped in FastAPI 0.141.1; rechecked against FastAPI 0.157.0 at
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1. The upstream test module's
# hyphenated header alias error location changed; this recipe covers that input.
# Repeated query extras: tests/test_query_cookie_header_model_extra_params.py:38-51;
# repeated header extras: :70-84; underscore-header rejection: :118-126; duplicate
# cookie last-value behavior: :129-140. These are independent inputs, not copied tests.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/model_extra_request_parameters.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-parameters.extra-model.query-repeated-values
  actions:
  - action_id: query-repeated-extras
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query
      query_string: param=123&param2=456&param2=789
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_query_cookie_header_model_extra_params.py
    kind: upstream_test
- case_id: fastapi.request-parameters.extra-model.header-underscore-invalid-alias
  actions:
  - action_id: underscore-header-only
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /header-requires-hyphen
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - x_user_id
        - underscore-value
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_query_cookie_header_model_extra_params.py
    kind: upstream_test
- case_id: fastapi.request-parameters.extra-model.header-repeated-values
  actions:
  - action_id: header-repeated-extras
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /header
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - param
        - '123'
      - - param2
        - '456'
      - - param2
        - '789'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_query_cookie_header_model_extra_params.py
    kind: upstream_test
- case_id: fastapi.request-parameters.extra-model.cookie-duplicate-last-value
  actions:
  - action_id: cookie-duplicate-values
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /cookie
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - cookie
        - param=123; param2=456; param2=789
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_query_cookie_header_model_extra_params.py
    kind: upstream_test
