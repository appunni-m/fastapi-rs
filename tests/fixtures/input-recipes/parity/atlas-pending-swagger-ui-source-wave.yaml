schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/atlas_pending_docs_ui_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.pending.swagger-ui-source-wave.oauth-html-escaping
  actions:
  - action_id: oauth-html
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /ui/init-oauth
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_swagger_ui_escape.py
    kind: upstream_test
