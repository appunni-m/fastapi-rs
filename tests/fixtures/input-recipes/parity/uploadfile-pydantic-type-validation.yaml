schema: fastapi-rs/python-asgi-workflow@2
oracle_profile_extension: standard-multipart
workload:
  file: tests/fixtures/workloads/uploadfile_pydantic_type_validation.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.uploadfile.pydantic-validation.reject-text-form-value
  actions:
  - action_id: submit-text-value-for-upload
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /uploadfile-pydantic-validation
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - multipart/form-data; boundary=UploadTextBoundary
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: "--UploadTextBoundary\r\nContent-Disposition: form-data; name=\"upload\"\r\nContent-Type: text/plain\r\n\r\nplain text instead of a file\r\n--UploadTextBoundary--\r\n"
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/tutorial/request-files.md
    kind: upstream_documentation
  - path: docs/en/docs/reference/uploadfile.md
    kind: upstream_documentation
