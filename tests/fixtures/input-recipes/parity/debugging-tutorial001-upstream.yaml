schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/debugging_tutorial001_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-tutorial-test-debugging-test-tutorial001.root-route-and-openapi
  actions:
  - action_id: get-root
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: openapi-schema
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - kind: openapi
      json_pointers:
      - /paths/~1/get
      comparison: exact
  source_evidence:
  - {path: tests/test_tutorial/test_debugging/test_tutorial001.py, kind: upstream_test}
  - {path: docs_src/debugging/tutorial001_py310.py, kind: upstream_documentation}
