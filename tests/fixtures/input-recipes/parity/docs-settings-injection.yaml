schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/docs_settings_injection.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.settings.dependency-override
  actions:
  - action_id: read-settings
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /info
      query_string: ''
      headers:
      - - host
        - testserver
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/settings.md
    kind: upstream_documentation
  - path: docs_src/settings/app02_an_py310/main.py
    kind: upstream_documentation_example
  - path: docs_src/settings/app02_an_py310/test_main.py
    kind: upstream_documentation_example
  - path: tests/test_tutorial/test_settings/test_app02.py
    kind: upstream_test
