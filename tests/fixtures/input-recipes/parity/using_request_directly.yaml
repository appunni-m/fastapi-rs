schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/using_request_directly.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.using-request-directly.client-host
  actions:
  - action_id: read-client-host
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/chair
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: request-openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths
      comparison: exact
  source_evidence:
  - path: docs/en/docs/advanced/using-request-directly.md
    kind: upstream_documentation
  - path: docs_src/using_request_directly/tutorial001_py310.py
    kind: upstream_documentation
  - path: tests/test_tutorial/test_using_request_directly/test_tutorial001.py
    kind: upstream_test
