# Input-only cases compare public Query, Body, Form, and File default behavior.
# Factory call order follows the pinned FastAPI parameter-extraction branches
# cited in metadata.yaml; Pydantic's FieldInfo.get_default supplies the value.
# String fallbacks for int/bytes parameters intentionally show that a missing
# default is returned without request-value validation; provided values validate.
schema: fastapi-rs/python-asgi-workflow@2
oracle_profile_extension: standard-multipart
workload:
  file: tests/fixtures/workloads/parameter_runtime_defaults.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.parameter-runtime-defaults.default-factory-none
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query/default-factory
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /query/default-factory
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_query.py
    kind: upstream_test
  - path: docs/en/docs/reference/parameters.md
    kind: upstream_documentation
