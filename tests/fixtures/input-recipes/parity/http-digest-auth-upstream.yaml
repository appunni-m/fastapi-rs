schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/http_digest_auth_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-security-http-digest-description.test-security-http-digest-no-credentials
  actions:
  - action_id: missing-digest-credentials
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /profile
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_security_http_digest_description.py
    kind: upstream_test
- case_id: fastapi.test.test-security-http-digest-description.test-security-http-digest-incorrect-scheme-credentials
  actions:
  - action_id: wrong-scheme-credentials
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /profile
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - authorization
        - Other invalid-token
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_security_http_digest_description.py
    kind: upstream_test
