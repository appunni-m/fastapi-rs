# FastAPI 0.141.1 response-model filter stimuli from tests/test_skip_defaults.py.
# These are independent request inputs; outputs are obtained from each live process.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/response_model_skip_defaults_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-model.skip-defaults.subclass-projection
  actions:
  - action_id: project-subclass-through-base-model
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /subclass-projection
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_skip_defaults.py
    kind: upstream_test
