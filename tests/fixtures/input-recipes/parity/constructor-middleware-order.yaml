schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/constructor_middleware.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.constructor-middleware-order
  factory_input:
    middleware:
    - {label: outer}
    - {label: inner}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: request-through-constructor-middleware
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /probe
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: observe-constructor-middleware-order
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /observe
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: tests/test_ws_router.py, kind: upstream_test}
  - {path: docs/en/docs/advanced/middleware.md, kind: upstream_documentation}
