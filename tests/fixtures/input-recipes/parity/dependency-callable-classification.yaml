# Independent inputs for callable classification, reviewed on Python 3.12.13.
# Earlier review used FastAPI 0.141.1; current behavior was rechecked against
# pinned FastAPI 0.157.0, commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1.
# dependencies/models.py:18-28 removes partials before inspect.unwrap;
# :138-228 checks callable and __call__ chains, class guards, and coroutine
# routines. :230-234 computes generator dependency scope. dependencies/utils.py
# :314-389 builds dependency edges and rejects an incompatible child scope;
# :637-645 selects async-generator or sync-generator context management;
# :700-762 resolves edges using the original cache key and selected callable.
# :755-758 awaits coroutine-classified dependencies even when the call returns
# a scalar. routing.py:143-155 creates function/request cleanup stacks.
# FastAPI 0.157.0's partial and wrapped tests are public-reachability evidence
# only (`tests/test_dependency_partial.py:248-251` and
# `tests/test_dependency_wrapped.py:446-449`); they do not assert this input
# cross-product.
# this workload uses independent values, signatures, traces, and projections.
# No input changes classification metadata after registration, and no results
# establish classification-cache history, eviction, or descriptor side effects.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_callable_classification.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.callable-classification.sync-wrap-coroutine-function
  verification: parity
  factory_input: {kind: coroutine, form: wrapped-function}
  construction_observation: &construction
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: invalid-query-before-any-forwarding-or-awaiting
    kind: http_request
    scope:
      type: http
      asgi: &asgi {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /pair
      query_string: 'seed=bad&scale=5'
      root_path: ''
      headers: &headers [[host, testserver]]
      client: &client [127.0.0.1, 123]
      server: &server [testserver, 80]
    receive_events: &request [{type: http.request, body: '', more_body: false}]
    observations: &response
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: inspect-validation-suppression-trace
    kind: http_request
    scope: &state-scope {type: http, asgi: *asgi, http_version: '1.1', method: GET,
      scheme: http, path: /state, query_string: '', root_path: '', headers: *headers,
      client: *client, server: *server}
    receive_events: *request
    observations: *response
  - action_id: original-forwarder-runs-with-cache-hit-and-uncached-repeat
    kind: http_request
    scope: &pair-scope {type: http, asgi: *asgi, http_version: '1.1', method: GET,
      scheme: http, path: /pair, query_string: 'seed=7&scale=5', root_path: '',
      headers: *headers, client: *client, server: *server}
    receive_events: *request
    observations: *response
  - action_id: observe-completed-forwarding-and-coroutine-traces
    kind: http_request
    scope: *state-scope
    receive_events: *request
    observations: *response
  source_evidence: &classification-reference
  - {kind: upstream_test, path: tests/test_dependency_wrapped.py}
  - {kind: upstream_test, path: tests/test_dependency_partial.py}
  - {kind: upstream_documentation, path: docs/en/docs/tutorial/dependencies/sub-dependencies.md}
