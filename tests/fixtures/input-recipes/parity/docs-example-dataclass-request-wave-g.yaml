schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dataclass_request_documentation_wave_g.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs-wave-g.dataclasses.stdlib-request-and-return
  actions:
  - action_id: parse-and-return-independent-dataclass
    kind: http_request
    scope: {type: http, asgi: {version: '3.0', spec_version: '2.4'}, http_version: '1.1', method: POST, scheme: http, path: /entries/, query_string: '', root_path: '', headers: [[host, testserver], [content-type, application/json]], client: [127.0.0.1, 123], server: [testserver, 80]}
    receive_events: [{type: http.request, body: '{"name":"Field Journal","price":17.25,"description":"ruled pages"}', more_body: false}]
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: inspect-independent-dataclass-openapi
    kind: http_request
    scope: {type: http, asgi: {version: '3.0', spec_version: '2.4'}, http_version: '1.1', method: GET, scheme: http, path: /openapi.json, query_string: '', root_path: '', headers: [[host, testserver]], client: [127.0.0.1, 123], server: [testserver, 80]}
    receive_events: [{type: http.request, body: '', more_body: false}]
    observations:
    - {kind: openapi, json_pointers: [/paths/~1entries~1/post], comparison: exact}
  source_evidence:
  - {path: docs_src/dataclasses_/tutorial001_py310.py, kind: upstream_documentation_example}
