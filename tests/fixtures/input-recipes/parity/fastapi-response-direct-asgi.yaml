schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/fastapi_response_direct_asgi.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.responses.response-direct-asgi
  actions:
  - action_id: invoke-public-response
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /direct-response
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: docs/en/docs/advanced/response-directly.md
    kind: upstream_documentation
  - path: docs/en/docs/reference/responses.md
    kind: upstream_documentation
