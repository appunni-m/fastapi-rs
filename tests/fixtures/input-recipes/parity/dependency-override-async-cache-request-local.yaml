# Historical input provenance: FastAPI 0.141.1's
# `tests/test_dependency_overrides.py::test_override_simple` and
# `tests/test_dependency_cache.py::test_sub_counter` supplied the neighboring
# override and request-cache shapes. Pinned FastAPI 0.157.0, commit
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, retains them at
# `tests/test_dependency_overrides.py:208-213` and
# `tests/test_dependency_cache.py:64-71`. Current runtime source initializes a
# missing request cache at `fastapi/dependencies/utils.py:687-688`, rebuilds an
# override dependant at :700-719, recursively resolves it at :721-733, awaits
# it and stores its result at :755-762. The cache key at
# `fastapi/dependencies/models.py:83-97` includes the dependency callable plus
# scope information. The flat override suspends at asyncio.sleep(0); repeated
# default-use_cache edges are followed by a second request to expose the
# request-local cache lifetime.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_cache_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-cache-request-local
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-cache
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-cache
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
