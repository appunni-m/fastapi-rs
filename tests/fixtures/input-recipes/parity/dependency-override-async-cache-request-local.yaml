# This input-only slice is grounded in FastAPI 0.141.1 (tag 0.141.1,
# commit 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f). In
# fastapi/dependencies/utils.py, solve_dependencies resolves the app-level
# override and rebuilds its dependant at lines 623-638, awaits coroutine
# overrides at lines 673-674, checks the original dependency's cache key at
# lines 656-661, and stores the solved value at lines 679-680. It initializes
# a missing dependency cache at lines 615-616. The key includes the dependency
# callable in fastapi/dependencies/models.py:82-96. The flat override suspends
# at asyncio.sleep(0); repeated default-use_cache edges are followed by a
# second request to exercise per-request cache lifetime.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_cache_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-cache-request-local
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-cache
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-cache
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
