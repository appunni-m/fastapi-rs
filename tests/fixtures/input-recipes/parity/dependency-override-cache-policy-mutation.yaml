# Independent public inputs for same-request override changes.
# FastAPI 0.141.1, source commit 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f:
# applications.py:967-987 stores a public dependency_overrides dictionary and
# supplies the application as provider. dependencies/utils.py:625-639 rereads
# that provider before selecting each edge; replacing the dictionary and
# clearing it therefore affect subsequent edges during the same request.
# get_dependant at :271-331 captures a selected parent's child callable, raw
# policy, and signature metadata before any child policy runs. :640-654 solves
# those children and validates inputs before :660 evaluates the outer policy.
# Updating an already-selected edge's override leaves that call/kwargs selected;
# a later edge observes the new mapping. :679-680 keeps the first cache result,
# but :640-654 still validates new replacement inputs before a cache hit.
# Signature mutation with a nonempty unrelated map reanalyzes a later edge;
# clearing the map instead uses its registration snapshot. An invalid override
# removed/repaired before its edge is reached is never analyzed by source.
# routing.py:140-146 unwinds entered yield scopes after a user policy error or
# after reaching a malformed replacement installed by an earlier policy.
# All observations are live user traces, values, identities, public errors, and
# ASGI outcomes. There are no expected results or private FastAPI imports.
schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/dependency_override_cache_policy_mutation.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-policy-mutation.sync-own-selected-call-and-cache
