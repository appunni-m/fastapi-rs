    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: current-call-retained-later-call-replaced-first-result-cached
    kind: http_request
    scope:
      type: http
      asgi: &asgi {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /selected-call
      query_string: 'trigger_value=43&replacement_trigger_value=47'
      root_path: ''
      headers: &headers [[host, testserver]]
      client: &client [127.0.0.1, 123]
      server: &server [testserver, 80]
    receive_events: &empty-request
    - {type: http.request, body: '', more_body: false}
    observations: &response-value
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence: &override-reference
  - {path: docs/en/docs/advanced/testing-dependencies.md, kind: upstream_documentation}
  - {path: docs/en/docs/tutorial/dependencies/sub-dependencies.md, kind: upstream_documentation}
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
