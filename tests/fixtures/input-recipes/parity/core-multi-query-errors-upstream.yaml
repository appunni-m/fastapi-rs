schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/core_multi_query_errors_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request.multi-query-errors.core-upstream
  actions:
  - action_id: repeated-valid-integers
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /readings
      query_string: q=5&q=9
      root_path: ''
      headers:
      - &id001
        - host
        - testserver
      client: &id002
      - 127.0.0.1
      - 123
      server: &id003
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: repeated-invalid-integers
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /readings
      query_string: q=five&q=six
      root_path: ''
      headers:
      - *id001
      client: *id002
      server: *id003
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: openapi-query-list-schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - *id001
      client: *id002
      server: *id003
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - ''
      comparison: exact
  source_evidence:
  - path: tests/test_multi_query_errors.py
    kind: upstream_test
