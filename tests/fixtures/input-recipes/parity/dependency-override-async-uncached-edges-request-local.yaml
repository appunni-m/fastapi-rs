# Pinned FastAPI 0.141.1 source evidence: fastapi/dependencies/utils.py:619-680
# resolves edges in order; lines 656-661 check cache only when use_cache is
# true, and lines 679-680 populate only a missing cache key. fastapi/params.py
# defaults Depends.use_cache to true at lines 745-749. The workload marks the
# first two repeated override edges uncached and leaves the third cached, then
# repeats the sequence on the same app to expose lookup bypass, first-value
# retention, and request-local reset. The second case checks cached -> uncached
# -> cached ordering against an already populated slot. Related upstream
# behavior is covered by tests/test_dependency_cache.py:30-35 and :64-81.
