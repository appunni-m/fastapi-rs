# Historical component-test provenance: FastAPI 0.141.1's dependency-cache
# cases covered `use_cache=False` and repeated requests. Pinned FastAPI 0.157.0,
# commit 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1, resolves edges in order at
# `fastapi/dependencies/utils.py:700-762`; `use_cache` guards lookup at :738-743,
# and results are inserted only for a missing key at :759-762. The public
# Depends factory defaults `use_cache=True` at `fastapi/param_functions.py:2391-2423`.
# The workload marks repeated override edges uncached and leaves one cached,
# then repeats the sequence on the same app to expose lookup bypass, first-value
# retention, and request-local reset. The second case checks cached -> uncached
# -> cached ordering against a populated slot. Current related source tests are
# `tests/test_dependency_cache.py:30-35` declares the uncached route; its
# `test_sub_counter_no_cache` test checks repeated dependency evaluation at :74-81.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_override_async_uncached_edges_request_local.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.override-async-uncached-edges-request-local
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-uncached
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-uncached
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
- case_id: fastapi.dependencies.override-async-cache-uncached-edges-request-local
  actions:
  - action_id: first-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-cache-uncached
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: second-request
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /override-async-cache-uncached
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_dependency_cache.py, kind: upstream_test}
  - {path: tests/test_dependency_overrides.py, kind: upstream_test}
