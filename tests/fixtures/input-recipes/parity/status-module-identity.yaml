schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/status_module_identity.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.status-alias.namespace
  actions:
  - action_id: read-status-namespace
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /status
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/reference/status.md
    kind: upstream_documentation
