schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/openapi_schemas.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.openapi.schema-compat-pydantic-v2.response
  actions:
  - action_id: get-user-response
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /users
      query_string: ''
      root_path: ''
      headers: &id001
      - - host
        - testserver
      client: &id002
      - 127.0.0.1
      - 123
      server: &id003
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_schema_compat_pydantic_v2.py
    kind: upstream_test
- case_id: fastapi.openapi.schema-ref-pydantic-v2.response
  actions:
  - action_id: get-ref-response
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /refs
      query_string: ''
      root_path: ''
      headers: *id001
      client: *id002
      server: *id003
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_schema_ref_pydantic_v2.py
    kind: upstream_test
