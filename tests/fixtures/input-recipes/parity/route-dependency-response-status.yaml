schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/route_dependency_status.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.route-dependency.response-status
  actions:
  - action_id: queue-request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /queue
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_response_change_status_code.py
    kind: upstream_test
  - path: docs/en/docs/advanced/response-change-status-code.md
    kind: upstream_documentation
  - path: docs/en/docs/tutorial/dependencies/dependencies-in-path-operation-decorators.md
    kind: upstream_documentation
