schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/compatibility_public_workflows.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.compatibility.flexible-text
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /flexible-value
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '"quartz"'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_compat.py
    kind: upstream_test
