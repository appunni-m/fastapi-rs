schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/repeated_deep_router_inclusions_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.test.test-router-include-context.test-repeated-deep-inclusions-openapi-path-set
    actions:
      - action_id: repeated-inclusion-openapi-path-set
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /openapi.json
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: openapi
            json_pointers: [/paths]
            comparison: exact
    source_evidence:
      - path: tests/test_router_include_context.py
        kind: upstream_test
