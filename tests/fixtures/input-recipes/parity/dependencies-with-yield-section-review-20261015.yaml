schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/dependencies_with_yield_section_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.dependencies-with-yield.database-session-lifecycle
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: session-response
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /database-session
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: session-cleanup-observation
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /session-events
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: docs/en/docs/tutorial/dependencies/dependencies-with-yield.md, kind: upstream_documentation}
  - {path: docs_src/dependencies/tutorial007_py310.py, kind: upstream_documentation_example}
  - {path: tests/test_tutorial/test_dependencies/test_tutorial007.py, kind: upstream_test}
- case_id: fastapi.docs.dependencies-with-yield.try-finally-error
