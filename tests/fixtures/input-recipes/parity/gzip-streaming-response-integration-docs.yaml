schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/gzip_streaming_response_docs.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.middleware.gzip.streaming-response-docs-contract
  actions:
  - action_id: request-streaming-response-with-gzip
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /streamed-report
      query_string: ''
      root_path: ''
      headers:
      - [host, testserver]
      - [accept-encoding, gzip]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: docs/en/docs/advanced/middleware.md
    kind: upstream_documentation
