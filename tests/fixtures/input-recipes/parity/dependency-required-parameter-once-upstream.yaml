schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/dependency_required_parameter_once_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.dependencies.required-parameter-once.missing
  actions:
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /foo
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: missing-shared-required-query
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
  source_evidence:
  - path: tests/test_enforce_once_required_parameter.py
    kind: upstream_test
- case_id: fastapi.dependencies.required-parameter-once.valid
  actions:
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /foo
      query_string: client_id=bar
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: one-value-feeds-required-and-optional-dependencies
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_enforce_once_required_parameter.py
    kind: upstream_test
- case_id: fastapi.dependencies.required-parameter-once.openapi
  actions:
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: single-openapi-query-parameter
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1foo/get/parameters
      comparison: exact
  source_evidence:
  - path: tests/test_enforce_once_required_parameter.py
    kind: upstream_test
