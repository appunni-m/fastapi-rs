# Input-only direct route-method cases based on FastAPI 0.141.1.
schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/head_dispatch.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.head.explicit-after-get
  actions:
  - action_id: dispatch-head
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: HEAD
      scheme: http
      path: /items/item-7
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_extra_routes.py
    kind: upstream_test
- case_id: fastapi.routing.head.get-remains-get
  actions:
  - action_id: dispatch-get
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/item-7
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_extra_routes.py
    kind: upstream_test
- case_id: fastapi.routing.head.get-only-is-not-head
  actions:
  - action_id: dispatch-head
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: HEAD
      scheme: http
      path: /headless/item-7
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
  source_evidence:
  - path: tests/test_extra_routes.py
    kind: upstream_test
