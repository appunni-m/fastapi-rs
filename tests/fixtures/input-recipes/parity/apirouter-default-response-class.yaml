schema: fastapi-rs/python-asgi-workflow@4
workload:
  file: tests/fixtures/workloads/apirouter_default_response_class.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.routing.apirouter.default-response-class.direct-read-write
  factory_input:
    placeholder_response_class: placeholder
    assigned_response_class: assigned
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: read-and-mutate-placeholder
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /placeholder
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: read-assigned-response-class
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /assigned
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: compare-openapi-response-media-types
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status], comparison: exact}
    - kind: openapi
      json_pointers:
      - /paths/~1placeholder/get/responses/200
      - /paths/~1assigned/get/responses/200
      comparison: exact
  source_evidence:
  - path: tests/test_include_router_defaults_overrides.py
    kind: upstream_test
  - path: docs/en/docs/advanced/custom-response.md
    kind: upstream_documentation
  - path: docs/en/docs/release-notes.md
    kind: upstream_documentation
