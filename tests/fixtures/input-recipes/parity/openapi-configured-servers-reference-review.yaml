schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/openapi_configured_servers_reference_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.openapi.openapi-cache-root-path.caller-servers-remain-unchanged-review
  actions:
  - action_id: openapi-with-root-path
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: /untrusted-prefix
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: openapi, json_pointers: [/servers], comparison: exact}
  - action_id: inspect-original-server-list
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /configured-servers
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [body], comparison: exact}
  source_evidence:
  - {path: tests/test_openapi_cache_root_path.py, kind: upstream_test}
