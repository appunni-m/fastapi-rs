schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/response_204_openapi.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response.openapi-204-omits-content
  actions:
  - action_id: inspect-204-response-metadata
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1empty/get/responses/204
      comparison: exact
  source_evidence:
  - path: tests/test_response_code_no_body.py
    kind: upstream_test
