schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/path_params_tutorial003_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.path-params.tutorial003-static-route-precedence
  actions:
  - action_id: static-me-route
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /users/me
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: dynamic-user-route
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /users/alice
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/path_params/tutorial003_py310.py
    kind: upstream_documentation_example
- case_id: fastapi.path-params.tutorial003-openapi
  actions:
  - action_id: static-and-dynamic-user-routes
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1users~1me/get
      - /paths/~1users~1{user_id}/get
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_params/test_tutorial003.py
    kind: upstream_test
  - path: docs_src/path_params/tutorial003_py310.py
    kind: upstream_documentation_example
