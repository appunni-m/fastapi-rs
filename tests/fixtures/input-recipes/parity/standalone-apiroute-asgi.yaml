        observations:
          - kind: http_response
            selectors: [status, headers, body]
            comparison: exact
          - kind: asgi_send
            selector: message_types
            comparison: ordered
          - kind: application_error
            selector: exception
            comparison: exact
    source_evidence:
      - path: tests/test_route_scope.py
        kind: upstream_test
