schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/path_operation_advanced_configurations_tutorial007_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.path-operation-advanced-configurations.tutorial007
  actions:
  - action_id: valid-yaml
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: POST
      path: /items/
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-yaml
    receive_events:
    - type: http.request
      body: 'name: Deadpoolio

        tags:

        - x-force

        - x-men

        - x-avengers

        '
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: malformed-yaml
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: POST
      path: /items/
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-yaml
    receive_events:
    - type: http.request
      body: 'name: Deadpoolio

        tags:

        x - x-force

        x - x-men

        x - x-avengers

        '
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: yaml-with-invalid-item
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: POST
      path: /items/
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-yaml
    receive_events:
    - type: http.request
      body: 'name: Deadpoolio

        tags:

        - x-force

        - x-men

        - x-avengers

        - sneaky: object

        '
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  - action_id: yaml-request-schema
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: http
      query_string: ''
      root_path: ''
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      method: GET
      path: /openapi.json
      headers:
      - - host
        - testserver
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1items~1/post/requestBody
      - /components/schemas/Item
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial007.py
    kind: upstream_test
  - path: docs_src/path_operation_advanced_configuration/tutorial007_py310.py
    kind: upstream_documentation_example
