schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/openapi_parameter_examples_source_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.openapi.examples-parameter-locations.openapi
  actions:
  - action_id: inspect-parameter-examples
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1probe~1body/post/requestBody
      - /paths/~1probe~1path~1{sample_id}/get/parameters
      - /paths/~1probe~1query/get/parameters
      - /paths/~1probe~1header/get/parameters
      - /paths/~1probe~1cookie/get/parameters
      - /components/schemas/ParameterExampleRecord
      comparison: exact
  source_evidence:
  - path: tests/test_openapi_examples.py
    kind: upstream_test
