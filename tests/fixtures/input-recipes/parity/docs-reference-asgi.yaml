- case_id: fastapi.docs.reference-wave.asgi.uploadfile-multipart
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /uploads
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - multipart/form-data; boundary=doc-boundary
      - - content-length
        - '149'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: "--doc-boundary\r\nContent-Disposition: form-data; name=\"upload\"; filename=\"field-notes.txt\"\
        \r\nContent-Type: text/plain\r\n\r\namber pine\r\n--doc-boundary--\r\n"
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1uploads/post/requestBody/content/multipart~1form-data/schema
      comparison: exact
  source_evidence:
  - path: docs/en/docs/reference/uploadfile.md
    kind: upstream_documentation
oracle_profile_extension: standard-multipart
