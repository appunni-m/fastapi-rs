schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/docs_reference_asgi.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-http-connection-injection.test-value-extracting-by-http
  actions:
  - action_id: http-dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /http
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: docs/en/docs/reference/httpconnection.md
    kind: upstream_documentation
  - path: tests/test_http_connection_injection.py
    kind: upstream_test
- case_id: fastapi.test.test-http-connection-injection.test-value-extracting-by-ws
  actions:
  - action_id: websocket-session
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.disconnect
      code: 1000
      reason: complete
    observations:
    - kind: websocket
      selector: close_code
      comparison: exact
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: docs/en/docs/reference/httpconnection.md
    kind: upstream_documentation
  - path: tests/test_http_connection_injection.py
    kind: upstream_test
