schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/cookie_parameter_surface.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-parameters.cookie.review-slice.alias-valid
  actions:
  - action_id: get-cookie-by-alias
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /cookies/required
      query_string: ''
      root_path: ''
      headers:
      - [host, testserver]
      - [cookie, 'session-id=alpha; theme=dark']
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - {path: tests/test_request_params/test_cookie/test_required_str.py, kind: upstream_test}
  - {path: docs/en/docs/tutorial/cookie-params.md, kind: upstream_documentation}
- case_id: fastapi.request-parameters.cookie.review-slice.alias-name-missing
  actions:
  - action_id: get-cookie-by-python-name
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /cookies/required
      query_string: ''
      root_path: ''
      headers:
      - [host, testserver]
      - [cookie, session=alpha]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - {path: tests/test_request_params/test_cookie/test_required_str.py, kind: upstream_test}
  - {path: docs/en/docs/tutorial/cookie-params.md, kind: upstream_documentation}
