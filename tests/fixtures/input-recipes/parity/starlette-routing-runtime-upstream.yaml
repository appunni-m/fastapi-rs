schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/starlette_routing_runtime.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-router-include-context.test-later-full-match-wins-over-earlier-included-partial-match
  actions:
  - action_id: request
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /all-match/items
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_router_include_context.py
    kind: upstream_test
