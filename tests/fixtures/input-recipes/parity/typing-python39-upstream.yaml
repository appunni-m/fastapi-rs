schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/typing_python39_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-typing-python39.builtin-generic-request-response-types
  actions:
  - action_id: list-type
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /list/
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [content-type, application/json]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '[1,2,3]', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: mapping-of-lists-type
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /mapping/
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [content-type, application/json]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '{"a":[1,2,3],"b":[4,5,6]}', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: set-type
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /set/
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [content-type, application/json]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '[1,2,3]', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: variadic-tuple-type
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: POST
      scheme: http
      path: /tuple/
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [content-type, application/json]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '[1,2,3]', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_typing_python39.py, kind: upstream_test}
