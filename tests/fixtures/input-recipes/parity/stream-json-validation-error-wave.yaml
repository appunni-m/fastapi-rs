schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/stream_json_validation_error_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-stream.validation-error.async
  actions:
  - action_id: stream-invalid-items
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/async
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
    - kind: application_error
      selector: validation_error_class
      comparison: exact
  source_evidence:
  - path: tests/test_stream_json_validation_error.py
    kind: upstream_test
- case_id: fastapi.response-stream.validation-error.sync
  actions:
  - action_id: stream-invalid-items
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/sync
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
    - kind: application_error
      selector: validation_error_class
      comparison: exact
  source_evidence:
  - path: tests/test_stream_json_validation_error.py
    kind: upstream_test
