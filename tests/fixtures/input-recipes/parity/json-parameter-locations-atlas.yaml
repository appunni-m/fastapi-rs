schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/request_coercion.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.json-parameter-locations.test-form-json-list
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /json/form
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/x-www-form-urlencoded
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: values=%5B%22amber%22%2C%22teal%22%5D
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_json_type.py
    kind: upstream_test
- case_id: fastapi.json-parameter-locations.test-header-json-list
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /json/header
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - x-items
        - '["amber","teal"]'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_json_type.py
    kind: upstream_test
- case_id: fastapi.json-parameter-locations.test-cookie-json-list
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /json/cookie
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - cookie
        - 'items="[\"amber\"\054\"teal\"]"'
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_json_type.py
    kind: upstream_test
