schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/sql_databases_no_signal_headings_20261018.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.sql-databases.single-model.read-heroes
  factory_input: {revision: single-model}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: list-heroes-with-offset-and-limit
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /heroes/
      query_string: offset=1&limit=1
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  - action_id: reject-limit-over-maximum
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /heroes/
      query_string: offset=0&limit=101
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: application_error, selector: validation_error_class, comparison: exact}
    - {kind: application_error, selector: validation_error_details, comparison: exact}
  source_evidence: &single_model_source
  - {path: docs/en/docs/tutorial/sql-databases.md, kind: upstream_documentation}

