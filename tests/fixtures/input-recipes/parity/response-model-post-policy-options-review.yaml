  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-model.post-policy.nested-include
  actions:
  - action_id: include-selected-nested-fields
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /nested/include
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '{"label":"dispatch-card","owner":{"name":"Mira","email":"mira@example.com","access_token":"token-include-17"},"audit_note":"staff-only"}'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_response_model_include_exclude.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/response-model.md
    kind: upstream_documentation
