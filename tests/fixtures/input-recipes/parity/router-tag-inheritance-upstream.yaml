schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/router_tag_inheritance_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.test.test-router-include-context.test-router-tag-inheritance-openapi-subset
    actions:
      - action_id: tagged-item
        kind: http_request
        scope:
          type: http
          asgi: {version: '3.0', spec_version: '2.4'}
          http_version: '1.1'
          method: GET
          scheme: http
          path: /api/v1/items/42
          query_string: ''
          root_path: ''
          headers: [[host, testserver]]
          client: [127.0.0.1, 123]
          server: [testserver, 80]
        receive_events:
          - {type: http.request, body: '', more_body: false}
        observations:
          - kind: http_response
            selectors: [status, headers, body]
            comparison: exact
          - kind: openapi
            json_pointers:
              - /paths/~1api~1v1~1items~1{item_id}/get/tags
            comparison: exact
    source_evidence:
      - path: tests/test_router_include_context.py
        kind: upstream_test
      - path: docs/en/docs/tutorial/bigger-applications.md
        kind: upstream_documentation
