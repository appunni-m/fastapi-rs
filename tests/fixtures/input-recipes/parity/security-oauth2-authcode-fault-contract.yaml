schema: fastapi-rs/python-asgi-workflow@9
workload:
  file: tests/fixtures/workloads/security_oauth_fault_contract.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.security.oauth2-authorization-code-bearer.yield-dependency-cleanup
  verification: parity
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: authorized-request-resolves-dependencies
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /protected
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [authorization, Bearer test-token]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
  - action_id: dependency-cleanup-and-follow-up-state
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, headers, body], comparison: exact}
  source_evidence:
  - {path: tests/test_security_oauth2_authorization_code_bearer.py, kind: upstream_test}
  - {path: tests/test_dependency_contextmanager.py, kind: upstream_test}
- case_id: fastapi.fault-contract.security.oauth2-authorization-code-dependency-cleanup
  verification: fault-contract
  fault:
    point: http.route.invoke.after_dependencies.before
    contract: http-route-invocation-error-cleans-dependencies
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: authorized-request-fails-after-dependency-resolution
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /protected
      query_string: ''
      root_path: ''
      headers: [[host, testserver], [authorization, Bearer test-token]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: application_error, selector: exception, comparison: exact}
    - {kind: asgi_send, selector: message_types, comparison: ordered}
    - {kind: http_response, selectors: [status], comparison: exact}
  - action_id: dependency-cleanup-and-follow-up-state
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /state
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_security_oauth2_authorization_code_bearer.py, kind: upstream_test}
  - {path: tests/test_dependency_contextmanager.py, kind: upstream_test}
