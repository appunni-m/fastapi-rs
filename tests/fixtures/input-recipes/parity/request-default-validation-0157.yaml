# Independent requests for default validation behavior in FastAPI 0.157.0.
schema: fastapi-rs/python-asgi-workflow@17
oracle_profile_extension: standard-multipart
workload:
  file: tests/fixtures/workloads/request_default_validation_0157.py
  factory: create_app
  instantiate_per_case: true
cases:
  - case_id: fastapi.request-default-validation.query-missing-default
    verification: parity
    factory_input: {}
    construction_observation: &construction
      kind: construction
      selectors: [outcome, exception_class, exception_message]
      comparison: exact
    actions:
      - action_id: missing-query-default
        kind: http_request
        scope:
          type: http
          asgi: &asgi
            version: '3.0'
            spec_version: '2.4'
          http_version: '1.1'
          method: GET
          scheme: http
          path: /query/default
          query_string: ''
          root_path: ''
          headers: &host-header [[host, testserver]]
          client: &client [127.0.0.1, 123]
          server: &server [testserver, 80]
        receive_events: &empty-request
          - {type: http.request, body: '', more_body: false}
        observations: &response
          - kind: http_response
            selectors: [status, body]
            comparison: exact
    source_evidence: &evidence
      - path: tests/test_request_params/test_default_validation.py
        kind: upstream_test
      - path: docs/en/docs/release-notes.md
        kind: upstream_documentation

  - case_id: fastapi.request-default-validation.query-explicit-equal-default
