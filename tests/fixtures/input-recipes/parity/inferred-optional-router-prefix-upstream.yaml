# Historical input provenance: FastAPI 0.141.1's
# `tests/test_infer_param_optionality.py::test_get_item_1` and `::test_get_item_2`
# established the two public input shapes. Pinned FastAPI 0.157.0 (commit
# 386a28af2f87af1a32ac26d88f07b7f58ab2dfb1) retains those tests at
# `tests/test_infer_param_optionality.py:78-89`. At runtime, `get_dependant`
# derives path names at `fastapi/dependencies/utils.py:314-344`; `analyze_param`
# selects path versus query fields at :423-430 and :533-549. Router prefixes
# are composed in `fastapi/routing.py:1336-1421` and applied to included API
# routes at :1485-1515.
schema: fastapi-rs/python-asgi-workflow@5
workload:
  file: tests/fixtures/workloads/inferred_optional_router_prefix_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.infer-param-optionality.router-prefix-path-parameter
  factory_input: {}
  construction_observation:
    kind: construction
    selectors: [outcome, exception_class, exception_message]
    comparison: exact
  actions:
  - action_id: ordinary-query-parameter
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: user_id=query-value
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  - action_id: inherited-path-parameter
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /users/path-value/items/
      query_string: user_id=query-shadow
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, headers, body]
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  - action_id: openapi-parameter-locations
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status]
      comparison: exact
    - kind: openapi
      json_pointers:
      - /paths/~1items~1/get/parameters
      - /paths/~1users~1{user_id}~1items~1/get/parameters
      comparison: exact
  source_evidence:
  - path: tests/test_infer_param_optionality.py
    kind: upstream_test
  - path: docs/en/docs/tutorial/bigger-applications.md
    kind: upstream_documentation
