schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/behind_proxy_tutorials_upstream.py
  factory: create_servers_with_root_path_app
  instantiate_per_case: true
cases:
- case_id: fastapi.behind-proxy.tutorial003.app-root-path
  actions:
  - action_id: tutorial003-read-root-path
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /app
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_behind_a_proxy/test_tutorial003.py
    kind: upstream_test
  - path: docs/en/docs/advanced/behind-a-proxy.md
    kind: upstream_documentation
  - path: docs_src/behind_a_proxy/tutorial003_py310.py
    kind: upstream_documentation
- case_id: fastapi.behind-proxy.tutorial003.openapi-servers
  actions:
  - action_id: tutorial003-read-openapi-servers
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      comparison: exact
    - kind: openapi
      json_pointers:
      - /servers
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_behind_a_proxy/test_tutorial003.py
    kind: upstream_test
  - path: docs/en/docs/advanced/behind-a-proxy.md
    kind: upstream_documentation
  - path: docs_src/behind_a_proxy/tutorial003_py310.py
    kind: upstream_documentation
