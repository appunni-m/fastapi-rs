  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-model.inferred-iterable.exclude-unset
  actions:
  - action_id: exclude-unset-from-inferred-iterable
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /iterable/exclude-unset
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_skip_defaults.py
    kind: upstream_test
