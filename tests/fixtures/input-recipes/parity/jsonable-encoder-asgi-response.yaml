schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/jsonable_encoder_asgi_response.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response-serialization.no-response-model-date
  actions:
  - action_id: post-today
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /today
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
    - kind: asgi_send
      selector: message_types
      comparison: ordered
  source_evidence:
  - path: tests/test_serialize_response_dataclass.py
    kind: upstream_test
  - path: tests/test_jsonable_encoder.py
    kind: upstream_test
