schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/router_composition_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-tutorial-test-bigger-applications-test-main.test-users-token-jessica
  actions:
  - action_id: users-authenticated
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /users/
      query_string: token=jessica
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_bigger_applications/test_main.py
    kind: upstream_test
