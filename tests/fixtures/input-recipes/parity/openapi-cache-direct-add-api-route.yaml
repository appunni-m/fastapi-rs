schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/openapi_cache_direct_add_api_route.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.applications.openapi.cache-direct-add-api-route
  actions:
  - action_id: prime-openapi-cache
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: openapi
      json_pointers: [/paths]
      comparison: exact
  - action_id: add-route-and-check-cache-identity
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /activate-late-route
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  - action_id: observe-regenerated-openapi
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: openapi
      json_pointers: [/paths]
      comparison: exact
  - action_id: add-request-root-path-server
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: /tenant-one
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: openapi
      json_pointers: [/servers]
      comparison: exact
  - action_id: confirm-root-path-did-not-persist
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - kind: openapi
      json_pointers: [/servers]
      comparison: exact
  source_evidence:
  - path: tests/test_router_include_context.py
    kind: upstream_test
  - path: tests/test_extra_routes.py
    kind: upstream_test
  - path: docs/en/docs/how-to/extending-openapi.md
    kind: upstream_documentation
