schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/metadata_tutorial001_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.test.test-tutorial-test-metadata-test-tutorial001.test-items
  actions:
  - action_id: items
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors: [status, body]
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_metadata/test_tutorial001.py
    kind: upstream_test
  - path: docs_src/metadata/tutorial001_py310.py
    kind: upstream_documentation
- case_id: fastapi.docs.metadata.tutorial001.openapi-info-fields
  actions:
  - action_id: selected-openapi-info-fields
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /info/summary
      - /info/description
      - /info/termsOfService
      - /info/contact
      - /info/license
      comparison: exact
  source_evidence:
  - path: docs/en/docs/tutorial/metadata.md
    kind: upstream_documentation
  - path: docs_src/metadata/tutorial001_py310.py
    kind: upstream_documentation_example
