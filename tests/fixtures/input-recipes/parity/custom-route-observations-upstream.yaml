schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/custom_route_observations.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.custom-request-route.tutorial001-request-subclass-body
  actions:
  - action_id: summarize-numbers
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: POST
      scheme: http
      path: /summarize
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      - - content-type
        - application/json
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: '[6,2,9]'
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_tutorial/test_custom_request_and_route/test_tutorial001.py
    kind: upstream_test
- case_id: fastapi.custom-request-route.tutorial001-request-subclass-identity
