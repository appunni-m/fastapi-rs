schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/testing_websockets.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.docs.testing-websockets.testclient-example
  actions:
  - action_id: websocket-testclient-example
    kind: websocket_session
    scope:
      type: websocket
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      scheme: ws
      path: /ws
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
      subprotocols: []
    receive_events:
    - type: websocket.connect
    - type: websocket.disconnect
      code: 1000
      reason: client complete
    observations:
    - kind: websocket
      selector: close_code
      comparison: exact
    - kind: websocket
      selector: event_order
      comparison: ordered
    - kind: websocket
      selector: messages
      comparison: ordered
  source_evidence:
  - path: docs/en/docs/advanced/testing-websockets.md
    kind: upstream_documentation
  - path: docs_src/app_testing/tutorial002_py310.py
    kind: upstream_documentation_example
  - path: tests/test_tutorial/test_testing/test_tutorial002.py
    kind: upstream_test
