schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/stream_bare_type_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.responses.bare-stream.async-jsonl
  actions:
  - kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /items/stream-bare-async
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    action_id: bare-async-iterable
    observations:
    - kind: http_response
      selectors:
      - status
      - headers
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_stream_bare_type.py
    kind: upstream_test
