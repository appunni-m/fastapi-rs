schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/arbitrary_types_public_api.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.arbitrary-types.vector-response
  actions:
  - action_id: dispatch
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /vectors/latest
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: http_response
      selectors:
      - status
      - body
      comparison: exact
  source_evidence:
  - path: tests/test_arbitrary_types.py
    kind: upstream_test
- case_id: fastapi.arbitrary-types.vector-openapi-schema
  actions:
  - action_id: openapi
    kind: http_request
    scope:
      type: http
      asgi:
        version: '3.0'
        spec_version: '2.4'
      http_version: '1.1'
      method: GET
      scheme: http
      path: /openapi.json
      query_string: ''
      root_path: ''
      headers:
      - - host
        - testserver
      client:
      - 127.0.0.1
      - 123
      server:
      - testserver
      - 80
    receive_events:
    - type: http.request
      body: ''
      more_body: false
    observations:
    - kind: openapi
      json_pointers:
      - /paths/~1vectors~1latest/get/responses/200/content/application~1json/schema
      - /components/schemas/VectorEnvelope
      comparison: exact
  source_evidence:
  - path: tests/test_arbitrary_types.py
    kind: upstream_test
