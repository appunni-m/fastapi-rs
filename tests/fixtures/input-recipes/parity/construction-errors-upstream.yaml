schema: fastapi-rs/python-asgi-workflow@3
workload:
  file: tests/fixtures/workloads/construction_errors_upstream.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.construction.invalid-path-model-sequence
  factory_input:
    route:
      method: get
      path: /items/{id}
      endpoint_name: read_items
      parameters:
      - name: id
        annotation:
          kind: generic
          origin: list
          arguments:
          - kind: model
            name: Item
            base: pydantic-v2
            fields:
              title: str
        default:
          kind: required
  construction_observation:
    kind: construction
    selectors:
    - outcome
    - exception_class
    - exception_message
    comparison: exact
  actions: []
  source_evidence:
  - path: tests/test_invalid_path_param.py
    kind: upstream_test
