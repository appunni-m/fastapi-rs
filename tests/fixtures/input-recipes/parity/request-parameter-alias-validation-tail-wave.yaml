schema: fastapi-rs/python-asgi-workflow@2
oracle_profile_extension: standard-multipart
workload:
  file: tests/fixtures/workloads/request_parameter_alias_validation_tail_wave.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.request-parameter-alias-validation-tail-wave.body-form-file
  actions:
