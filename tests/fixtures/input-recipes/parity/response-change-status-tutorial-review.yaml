schema: fastapi-rs/python-asgi-workflow@2
workload:
  file: tests/fixtures/workloads/response_change_status_tutorial_review.py
  factory: create_app
  instantiate_per_case: true
cases:
- case_id: fastapi.response.change-status-code.tutorial-existing-and-created
  actions:
  - action_id: update-existing-record
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /catalog/kept
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  - action_id: create-new-record
    kind: http_request
    scope:
      type: http
      asgi: {version: '3.0', spec_version: '2.4'}
      http_version: '1.1'
      method: PUT
      scheme: http
      path: /catalog/fresh
      query_string: ''
      root_path: ''
      headers: [[host, testserver]]
      client: [127.0.0.1, 123]
      server: [testserver, 80]
    receive_events:
    - {type: http.request, body: '', more_body: false}
    observations:
    - {kind: http_response, selectors: [status, body], comparison: exact}
  source_evidence:
  - {path: tests/test_tutorial/test_response_change_status_code/test_tutorial001.py, kind: upstream_test}
  - {path: docs_src/response_change_status_code/tutorial001_py310.py, kind: upstream_documentation}
