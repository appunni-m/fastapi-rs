[workspace]
members = ["fastapi-rs", "fastapi-rs-py"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/appunni-m/fastapi-rs"

[workspace.dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pyo3-build-config = "0.29.2"
starlette-rs = { version = "0.1.0", path = "../starlette-rs/starlette-rs" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
