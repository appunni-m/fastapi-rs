      observation_selectors: [http.status, http.headers.ordered, http.body.bytes, openapi.document, asgi.send.message_types, asgi.application_error.exception, construction.outcome, construction.exception_class, construction.exception_message, validation.error_details, error.public_attributes]
      supported_slice: >-
        The callable-classification and worker-dispatch inputs declare original
        endpoint classification, worker/context placement, validation and serialization
        callbacks, cleanup/recovery, and lossless raw ASGI sends. Fresh live receipts
        are required; mutable classification history and generic cancellation remain gaps.
        Partial native slice: GET routes can be registered with
        include_in_schema=False, remain callable over HTTP, and be omitted from
        OpenAPI paths. The same behavior is source-backed for the other direct
        HTTP decorators and has an independent dispatch/schema workflow. A
        documented route with status 204 is represented in OpenAPI with its
        success description and no response content member. Inferred list and
        union response annotations use inline response schemas and shared model
        definitions. Other response status codes and customization remain
        governed by their own slices. A FastAPI-managed GET route using the
        default JSON response and status_code=204 sends an empty body and omits
        Content-Length, as shown by
        response-204-bodyless-isolated-upstream::fastapi.response.bodyless-204-isolated.
        Independent 205 and 304 default-response inputs observe empty wire
        bodies and the status-specific header policy; a malformed 304 response
        confirms response-model validation precedes body suppression. The
        upstream no-body test directly asserts 204 only. Custom response
        classes and informational statuses remain outside this sample.
        The GET decorator also accepts an
        explicit non-empty `operation_id`, which is emitted at
        `/paths/~1items~1/get/operationId` by the reviewed
        `path-operation-advanced-configurations-tutorial001-upstream` workflow.
        The same GET slice accepts an explicit non-empty `summary`, emitted at
        `/paths/~1items~1/get/summary` by that workflow. Empty IDs, duplicate-ID
        warnings, and these options on other verb decorators remain outside
        this GET-only sample. The decorator also accepts `deprecated=True` and
        emits `/paths/~1elements~1/get/deprecated` as `true`, proven by the
        `path-operation-configurations-tutorial006-upstream` workflow. False
        and omitted values, and other verb decorators, remain outside this
        sample. It accepts non-empty lists of string `tags` and emits the three
        observed operation tag arrays in the same workflow. Empty or omitted
        tags and enum-valued tags remain outside this GET slice. Non-empty
        string tags on PUT, PATCH, DELETE, OPTIONS, HEAD, and TRACE are sampled
        by the six-method operation metadata workflow.
        Non-empty `response_description` values on the direct and APIRouter
        methods, plus omitted and empty-string controls, are sampled by
        path-operation-other-verbs-response-descriptions.
        Route-level `responses` maps with one or more non-colliding Python
        integer (not bool) status keys and one non-empty string `description`
        per key emit description-only OpenAPI response objects, sampled by
        `path-operation-other-verbs-responses`. Multiple fields per response,
        response models, content, headers, links, extensions, string status
        keys, empty descriptions, and router/include-level response maps remain
        outside this slice.
        Explicit `status_code=None` matches omission for the default
        JSONResponse class: HTTP status and OpenAPI use 200 in
        path-operation-status-code-none-isolated. Custom response-class
        defaults remain unresolved and outside this slice.
        The response-field-lifecycle inputs declare sixteen immutable response-field and
        response-class cases: direct registration and repeated inclusion,
        Annotated/Field metadata with schema hooks and exact warnings/errors, retained
        validation/serialization callbacks, aliases and output flags, omitted versus
        concrete/inherited/None response classes, NaN, and returned-Response bypass.
        Registration and each included effective context have distinct source
        field-construction/reuse boundaries. The public state body preserves ordered
        unfiltered warning entries and all prior probe send fields. These are input
        mappings requiring fresh live receipts, not target-complete support;
        DefaultPlaceholder and ModelField remain internal source evidence.
        Seven response-field-traversal normal inputs map fixed public route trees, a
        one-use user schema-hook refusal and retry, parent own-field preparation
        before child traversal, earlier full versus partial matches, misses, slash
        search and returned-Response field setup. They retain actual construction,
        callbacks, warnings/errors, exact status/ordered headers/body and full prior
        non-state send fields through an early public state route. Source-derived
        branch publication and traversal contracts require fresh identity-checked
        source/target receipts; these mappings do not establish complete target
        support, mutable router-version history or generic sibling behavior.

        A direct GET route uses the application callback when no route-level callback is supplied, sampled by `generate-unique-id-function-precedence`. Callback integer and empty-string returns are retained as operation IDs; unhashable returns fail during OpenAPI generation, callback exceptions surface during registration, and duplicate integer IDs emit warnings, sampled by `generate-unique-id-callback-values`.

        Its effective route view exposes `name`, `path_format`, `tags`, `summary`, `response_description`, `responses`, `deprecated`, and `include_in_schema`. The fixture reads these fields from direct and included routes while producing their operation IDs. It samples true `include_in_schema`, explicit false normalized to `None` for direct `deprecated`, inherited true `deprecated`, an APIRouter route created with `deprecated=False` and `include_in_schema=False`, and a direct callback mutating `summary` and `tags`; mutation of other fields and later-initialized APIRoute state remain unproven.
        `openapi_extra` is applied after generated operation metadata with recursive mapping merge, list concatenation, and scalar replacement. The direct and included-router cases in `openapi-extra-deep-merge` observe summary override, tag append, nested response merge, and operation extensions.
      target_binding:
        implementation_owner: fastapi-rs
        status: partial-contract
        known_gaps:
