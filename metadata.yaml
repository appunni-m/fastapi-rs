    file: uv.lock
    purpose: FastAPI source-inventory provenance only; it does not select the oracle profile.
    sha256: 96ae079a121e11b4cc0d260df5b7f77189bb90fa23a2da368f607418c2d98165
    components: {pydantic: 2.13.4, starlette: 1.3.1, httpx: 0.28.1}
