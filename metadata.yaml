        - {path: tests/test_tutorial/test_testing_dependencies/test_tutorial001.py, symbol: test_override_in_users_with_params}
        - {path: docs_src/dependency_testing/tutorial001_py310.py}
        - {path: tests/test_tutorial/test_metadata/test_tutorial001.py, symbol: test_openapi_schema}
        - {path: docs_src/metadata/tutorial001_py310.py}
        - {path: fastapi/openapi/utils.py, symbol: get_openapi}
