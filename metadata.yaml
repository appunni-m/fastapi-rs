      source_path: fastapi/routing.py
      source_line: 6415
      source_end_line: 6422
  operations:
    fastapi.applications.FastAPI.__init__:
      rust_binding: fastapi-rs/src/application_runtime.rs::PyFastApi::new
      target_binding:
        implementation_owner: fastapi-rs
        status: partial-contract
        known_gaps:
          - &response_field_lifecycle_gap >-
            Response-field construction must retain source registration and included
            effective-context timing, schema hooks/errors, and adapter reuse. The
            selected direct/repeated-inclusion inputs require fresh live receipts;
            static admission does not establish this lifecycle or sharing across
            arbitrary routes.
          - &response_field_metadata_gap >-
            FieldInfo annotation, metadata, attributes, mode/config, narrow
            UnsupportedFieldAttributeWarning suppression, and exact schema-generation
            error mapping are source requirements. Unselected metadata/configurations,
            callback errors, and warning-filter mutation remain unproven.
          - &response_class_provenance_gap >-
            Omitted placeholder provenance differs from explicit None and concrete
            JSONResponse/custom/inherited classes. Exact first-non-placeholder
            precedence and field-plus-placeholder byte-serialization eligibility require
            the selected immutable public gates; mutable placeholders/defaults,
            descriptors, and custom providers remain gaps.
          - &response_field_serialization_gap >-
            Selected validation/serialization callbacks, aliases, include/exclude flags,
            NaN, errors, warnings, and lossless raw sends require fresh comparison.
            Arbitrary serializers/types, exotic response classes, and sibling-owned
            generic response behavior are not established by these inputs.
          - &response_field_history_gap >-
            The sixteen cases use fixed declarations and ordinary async endpoints.
            Mutable model rebuild, route/default changes, endpoint-context/cache
            history, flattened snapshot route mutation/version refresh, raw proxies
            for included routes, URL/OpenAPI/WebSocket field-materialization traversal,
            concurrency/reentrancy, cancellation, dynamic warning filters, and
            broader sync validation/worker scheduling are outside this response-field
            gate.
          - Other FastAPI.__init__ options beyond the reviewed constructor slices
            remain unimplemented or unproven.
          - &response_field_traversal_gap >-
            Visited included branches must prepare all own effective fields before
            publishing the vector, retry the whole unpublished branch after a later
            own constructor fails, descend into child branches only when matching
            reaches them, and retain successful fields across miss/redirect/handle
            paths. The seven response-field-traversal inputs are a required fresh
            parity gate; static admission is not execution evidence.
          - &response_field_traversal_history_gap >-
            Route-version refresh/live additions, raw included-route proxies,
            URL/OpenAPI/WebSocket field traversal, empty-prefix validation traversal,
            reentrancy/concurrency, mutable model/default/metadata history, arbitrary
            schemas, terminal405, cancellation, streaming and worker scheduling remain
            outside traversal7. The one-use user hook is not a native fault injection
            or proof of resource finalizer timing, yield cleanup or private cache
            identity. Internal DefaultPlaceholder and ModelField remain source
            evidence with private/internal classification.
