        This workflow constructs default routers and one router with a `prefix`;
        it passes no other APIRouter constructor options apart from the
        response-precedence case. Source parameters `routes`,
        `redirect_slashes`, `default`, `dependency_overrides_provider`, and
        `route_class` are omitted by the current native constructor and are not
        established here.

        The `callbacks` constructor option is accepted and its callback routes
        are compared in the `atlas-pending-callbacks-source-wave` OpenAPI
        projection. Other callback errors and mutation histories remain
        unproven.

        The response-precedence input supplies router-level defaults and checks
        that app, include, router, and operation response maps shallow-merge by
        status with the deepest declaration winning collisions. It observes
        only selected OpenAPI response descriptions; other response metadata
        remains unproven.

        The native constructor accepts the default or a keyword-only prefix.
        A non-empty `/tenants/{tenant_id}` prefix combines with an app-level
        `/{version}` prefix and delivers all three path parameters to the
        endpoint in router-prefix-and-nested-composition-upstream. It also
        accepts a non-empty list of string tags, as sampled by
        router-tag-inheritance-upstream. The constructor also accepts
        `deprecated` and `include_in_schema`; their behavior is sampled by
        router-schema-policy-upstream. A list of synchronous Depends declarations
        with required scalar query inputs is validated and invoked in router-
        dependencies-isolated. Lifecycle options include legacy startup and
        shutdown callbacks, async context managers, and sync/async generator
        lifespans. Successful nested execution and request-visible yielded
        state are covered; lifecycle error paths are not. The
        `strict_content_type` accepts explicit booleans on APIRoute and
        APIRouter.add_api_route, and inherits the enclosing app/router policy
        when omitted. The
        `strict-content-type-router-level-upstream` workflow covers router
        defaults and nested inheritance; `strict-content-type-per-route-overrides`
        covers app inheritance and explicit strict/lax values through
        APIRouter.add_api_route. The direct APIRoute constructor's
        explicit lax option is checked by
        `apiroute-strict-content-type-constructor`. Direct inspection of the
        default placeholder remains outside this slice.
        FastAPI 0.141.1 also accepts inherited `routes`, `redirect_slashes`, and
        `default` constructor arguments. `routes` is explicitly deprecated in
        the source signature. The FastAPI constructor now snapshots the supplied
        iterable and dispatches the first generic route with a full match; the
        linked workflow covers one direct Starlette `Route` HTTP request. The
        APIRouter constructor also snapshots `routes`; linked inputs observe
        prefixed HTTP dispatch, included raw WebSocket dispatch through nested
        APIRouter and FastAPI inclusion, include-slot ordering against API
        routes, nested constructor-route prefixes, and generic HTTP
        partial-match fallback both after a later API full match and when no
        later route fully matches.
        Slash redirects, route families beyond the sampled Starlette Route,
        WebSocketRoute, Mount, and Host cases, and other ordering combinations
        remain open.
        Five response-field-lifecycle inputs reach router construction/GET and
        application inclusion with fixed response models and omitted or concrete
        router/include/route response classes. They observe original versus
        effective-context construction hooks, repeated-request retention, repeated
        prefixes, inherited precedence, NaN/errors, callbacks, exact bodies/headers and
        lossless probe sends in the public state body. The declared
        include_router(default_response_class=...) option remains a required public
        gate, including currently unsupported target behavior; the fixtures contain no
        workaround. Static mappings do not establish lifecycle or immutable provenance
        parity, mutable history, or broader custom response support.
        Seven response-field-traversal normal inputs map fixed public route trees, a
        one-use user schema-hook refusal and retry, parent own-field preparation
        before child traversal, earlier full versus partial matches, misses, slash
        search and returned-Response field setup. They retain actual construction,
        callbacks, warnings/errors, exact status/ordered headers/body and full prior
        non-state send fields through an early public state route. Source-derived
        branch publication and traversal contracts require fresh identity-checked
        source/target receipts; these mappings do not establish complete target
        support, mutable router-version history or generic sibling behavior.

        A router-level callback is used for its own routes and retained as an inclusion candidate in the nested-tree sample `generate-unique-id-function-precedence`. Callback errors and non-string results remain unproven.

        Its effective route view exposes `name`, `path_format`, `tags`, `summary`, `response_description`, `responses`, `deprecated`, and `include_in_schema`. The fixture reads them from direct router routes with default values and observes inherited true `deprecated` after inclusion. It does not establish explicit false normalization on a router-default path, callback mutation, or later-initialized APIRoute state.
