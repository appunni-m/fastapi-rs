      observation_selectors: [http.status, http.headers.ordered, http.body.bytes, openapi.document, openapi.paths, asgi.send.message_types, asgi.application_error.exception, construction.outcome, construction.exception_class, construction.exception_message]
      supported_slice: >-
        The workflow registers the tenant GET path with decorator defaults and
        the shared GET path with only `name="read_shared_items"`. It does not
        exercise or establish the other GET decorator options.

        `path-operation-configurations-tutorial003-upstream` compares an
        explicit description on an included APIRouter GET, docstring fallback,
        empty-string fallback to the docstring, and truncation at the first
        form feed. The exact OpenAPI description is compared. Whitespace-only
        explicit descriptions and other normalization inputs remain unproven.

        Registers a GET endpoint on a router for inclusion, including the
        sampled scalar query dependency, path parameters contributed by router
        and app prefixes, and route-level string tags combined with inherited
        tags in router-tag-inheritance-upstream. An explicit
        `response_description` is emitted in OpenAPI and sampled by
        path-operation-other-verbs-response-descriptions.
        Route-level `responses` maps with one or more non-colliding Python
        integer (not bool) status keys and one non-empty string `description`
        per key emit description-only OpenAPI response objects, sampled by
        `path-operation-other-verbs-responses`. Multiple fields per response,
        response models, content, headers, links, extensions, string status
        keys, empty descriptions, and router/include-level response maps remain
        outside this slice.
        Explicit `status_code=None` matches omission for the default
        JSONResponse class: HTTP status and OpenAPI use 200 in
        path-operation-status-code-none-isolated. Custom response-class
        defaults remain unresolved and outside this slice. A direct operation
        callback list containing an APIRoute is emitted as an OpenAPI callback
        path item, and its additional response model is registered in root
        components, sampled by
        `additional-responses-custom-model-in-callback.openapi-schema`.
        Router/include/app callback inheritance, non-APIRoute entries, callback
        security-scheme components, duplicate callback names or operation IDs,
        callback routes excluded from schema, same-name callback/parent model
        collisions, and nested callbacks remain unverified.
        Five response-field-lifecycle inputs reach router construction/GET and
        application inclusion with fixed response models and omitted or concrete
        router/include/route response classes. They observe original versus
        effective-context construction hooks, repeated-request retention, repeated
        prefixes, inherited precedence, NaN/errors, callbacks, exact bodies/headers and
        lossless probe sends in the public state body. The declared
        include_router(default_response_class=...) option remains a required public
        gate, including currently unsupported target behavior; the fixtures contain no
        workaround. Static mappings do not establish lifecycle or immutable provenance
        parity, mutable history, or broader custom response support.
        Seven response-field-traversal normal inputs map fixed public route trees, a
        one-use user schema-hook refusal and retry, parent own-field preparation
        before child traversal, earlier full versus partial matches, misses, slash
        search and returned-Response field setup. They retain actual construction,
        callbacks, warnings/errors, exact status/ordered headers/body and full prior
        non-state send fields through an early public state route. Source-derived
        branch publication and traversal contracts require fresh identity-checked
        source/target receipts; these mappings do not establish complete target
        support, mutable router-version history or generic sibling behavior.

        The GET decorator accepts a route-level callback that overrides router and include callbacks, sampled by `generate-unique-id-function-precedence`. Other verbs, callback errors or non-string results, and duplicate or empty operation IDs remain unproven.

        Its effective route view exposes `name`, `path_format`, `tags`, `summary`, `response_description`, `responses`, `deprecated`, and `include_in_schema`. The fixture reads these fields from direct router routes and included routes while producing their operation IDs and observes inherited true `deprecated`. It does not establish explicit false normalization with an APIRouter default, callback mutation, or later-initialized APIRoute state.
        `openapi_extra` is applied after generated operation metadata with recursive mapping merge, list concatenation, and scalar replacement. The direct and included-router cases in `openapi-extra-deep-merge` observe summary override, tag append, nested response merge, and operation extensions.
      target_binding:
        implementation_owner: fastapi-rs
        status: partial-contract
        known_gaps:
          - *response_field_lifecycle_gap
          - *response_class_provenance_gap
          - *response_field_serialization_gap
          - *response_field_history_gap
          - *response_field_traversal_gap
          - *response_field_traversal_history_gap
