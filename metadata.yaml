      supported_slice: >-
        The router-prefix-and-nested-composition workflow supplies only `router`,
        `prefix`, and `tags` to nested router inclusion. The native binding also
        accepts `responses`; `bigger-applications.response-precedence` checks
        app, include, router, and operation maps by selected OpenAPI status
        descriptions, including collision precedence. Callback routes supplied at
        app, router, include, and operation scopes are compared in the exact
        OpenAPI `/callbacks` projection by `atlas-pending-callbacks-source-wave`.
        Other unused include options remain outside this slice.

        Nested route sets can be included repeatedly with distinct prefixes and
        string tags. The reviewed inputs observe four concrete routes after two
        nested inclusions; the repeated-inclusion case compares effective
        context paths, inherited tags, and generated unique IDs for each branch.
        Its isolated OpenAPI fixture compares the complete `/paths` value,
        stricter than the source test's path-name set assertion.
        Ordered tags across five composition levels are also covered.
        `deprecated` and `include_in_schema` inheritance are also covered by
        router-schema-policy-upstream. Synchronous scalar-query dependencies
        at router and include scopes are covered by router-dependencies-isolated.
        Nested router inclusion also composes the tested startup/shutdown
        handlers and lifespan contexts. One input maps an included lifespan
        entry error suppressed by an already-entered parent context; it
        observes the resulting failed startup and cleanup trace. Its exact
        startup.failed message retains the traceback-format difference as an
        explicit Starlette-RS-owned parity gap. Other lifecycle failure modes
        and router-level options remain outside this slice. The
        source-defined self/transitive inclusion guard is compared at
        construction. Strict content
        type values from explicit child routers take precedence; omitted child
        values inherit the parent/include context, including across nested
        inclusions. `strict-content-type-router-level-upstream` covers lax
        outer and strict inner routers and defaults under a lax app.
        The response-field-traversal parent-own-fields-before-child-traversal input
        declares own A, nested included B and own C before app inclusion with nonempty
        prefixes. The public journal observes parent own-field preparation, later
        child visitation, retained fields and exact responses/sends. Source-defined
        eager parent-own preparation and lazy child traversal require fresh receipts;
        dynamic branch/version/proxy history and concurrency remain unproven.

        For nested inclusion, the router callback takes precedence over the include callback; a route callback overrides both, and the selected callback sees the effective prefixed route, sampled by `generate-unique-id-function-precedence`. Callback errors and non-string results remain unproven.
        The separate `atlas-pending-callbacks-source-wave` fixture observes
        OpenAPI callback routes inherited from the app, parent and child routers,
        each include level, and the path operation at the exact `/callbacks`
        pointer. This establishes only the selected ordered route-set projection;
        errors, route mutation, and broader callback model behavior remain gaps.

        The late-route-order workflow compares include-slot order for a route
        registered after inclusion against an app catch-all, a direct/included
        duplicate path, and a three-level nested route. It observes runtime
        selection, the winning OpenAPI operation, response-model schema, and
        nested prefix composition. Separate cases compare a later full match
        after an included partial match and the 405 fallback when no later full
        match exists. Other route classes and mutation histories remain outside
        this slice.

        The nested-late-api-websocket case registers a child WebSocket route
        after the child router is included in this router and after this router
        is included in the app. It compares the composed prefixes and emitted
        WebSocket events. The late-route-order workflow also compares API
        WebSocket collision priority after inclusion and named route reversal
        when direct and late-included routes share a name and parameter shape.

        Its effective route view exposes `name`, `path_format`, `tags`, `summary`, `response_description`, `responses`, `deprecated`, and `include_in_schema`. The fixture reads these fields from direct and nested included routes while producing operation IDs and observes inherited true `deprecated`. It does not establish explicit false normalization on this inclusion path, callback mutation, or later-initialized APIRoute state.

        `APIRouter(routes=...)` constructor HTTP and WebSocket routes participate
        at their include-registration slot. The focused nested constructor-route
        case covers raw WebSocket prefix dispatch through an APIRouter include
        and FastAPI inclusion. The route-order workflow compares generic/API
        order, nested constructor-route prefixes, and HTTP partial-match
        fallback. Prefixed Starlette Mount and Host constructor routes also
        compare HTTP dispatch and named URL reversal; WebSocket dispatch through
        those route families and other BaseRoute families remain open.
