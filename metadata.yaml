      supported_slice: >-
        Partial native slice: direct and Annotated Query declarations apply
        exclusive gt/lt and inclusive min_length/max_length validation and project
        those constraints into OpenAPI. Reviewed workflows also cover Query
        default=None, alias, title, description, and pattern; include_in_schema=False
        keeps runtime validation while omitting the parameter from OpenAPI and
        retaining the inferred 422 response. Annotated custom validation metadata
        remains in the runtime validation path. Inputs and exact source selectors
        are in query-params-str-validations-doc-examples,
        query-params-str-validations-doc-pattern-examples,
        query-params-str-validations-doc-title-description-examples, and
        query-params-str-validations-doc-exclude-schema-examples. Other Query and
        FieldInfo options remain outside this reviewed slice. The
        query-validation-alias-direct workflow covers string validation_alias
        behavior: a nonempty validation alias takes precedence over alias and
        the Python name for query lookup, required-error location, and OpenAPI
        name. ASGI cases for direct path-operation Query(BaseModel) parameters in
        query-param-models, query-param-model-tutorial-edges,
        request-parameter-model-tutorial-edges,
        model-extra-request-parameters-upstream,
        query-validation-alias-model, query-model-extra-forbid,
        query-model-extra-allow, and the query cases from
        request-param-model-field-aliases-wave cover a model as the callable's
        sole query parameter. Runtime extraction uses field validation aliases,
        repeated values for sequence fields, model defaults, and unknown query
        keys as model extras under ignore, forbid, and allow policies, then
        validates the assembled model once. For these dependency-free routes,
        OpenAPI expands the model into fields with aliases, requiredness,
        defaults, and constraints. Nested BaseModel, dict, and dataclass fields;
        custom model schema config; multiple query parameters alongside a model;
        default-factory OpenAPI schemas; empty explicit aliases; non-string
        AliasPath or AliasChoices validation aliases; and BaseModel parameters
        from Header() or Cookie() remain outside this reviewed slice.
