      supported_slice: >-
        Operation parameters are deduplicated by their (in, name) pair while
        preserving the first key position. The last definition supplies the
        value unless a required definition exists, in which case the last
        required definition takes precedence. The required-parameter-once
        input observes the resulting query parameter array without reducing
        its schema selectors.
        The signature-reanalysis workflow selects registered OpenAPI parameters
        after request-time signature mutation and override-map changes. This
        observes that request-time dependency reanalysis does not replace the
        route's stored schema parameters.
        Reuses the same cached schema object while the app route version is
        unchanged. Direct app.add_api_route registration invalidates that cache;
        the next openapi() call regenerates the schema and subsequent calls
        reuse the new object. The input workflow reports cache identity through
        response booleans and compares the OpenAPI paths before and after route
        registration. The built-in endpoint uses this canonical cache and adds
        a request root-path server to a shallow response copy without persisting
        it, as covered by openapi-cache-root-path. Assigning custom
        openapi_schema values, per-instance replacement of the openapi method,
        late mutation of already-included routers, callback declarations on
        path operations, webhook mutation after OpenAPI caching, and complete
        OpenAPI parity remain outside this slice. The root-path fixture selects
        configured-prefix fallback and precedence, ASGI scope propagation,
        mutable `root_path` and `root_path_in_servers` attributes, and automatic
        server insertion gating. The existing-server case verifies that a
        configured server equal to the request root path remains a single entry
        with its description. The disabled-insertion case verifies that
        `root_path_in_servers=False` preserves an explicitly configured server
        list. Both observe exact `/servers` content. The request-local isolation case observes
        three different incoming root paths, a following clean request, and
        caller-owned server configuration through the same app; this covers the
        per-request cache isolation contract without claiming complete OpenAPI
        parity. The `FastAPI.servers` instance-field candidate remains
        `uncertain` as an independently public attribute in the source atlas;
        this case observes it only as the configured OpenAPI server list during
        the cache-isolation workflow. In the pinned
        sub-applications workflow, parsed `/paths` match for the parent and
        mounted app, but exact response-body bytes differ because the target
        serializes schema-object keys in a different order; raw OpenAPI bytes
        remain a parity gap. The linked webhook cases cover constructor-supplied
        and default routers, body/security schema emission, and separation from
        inbound paths. A same-ID path/webhook pair emits the pinned duplicate
        operation warning while retaining each operation in its separate map.
        The separate-schema cases compare the constructor setting for ordinary
        and computed-field response models.
