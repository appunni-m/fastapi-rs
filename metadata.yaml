schema: fastapi-rs/api-source-authority@1

# Canonical human-maintained source identities, contract policy, and reviewed
# API overlays. Candidate rows are generated from the pinned source; reviewed
# overlays add only source-backed operation and observation links.
authority:
  project: FastAPI
  repository: https://github.com/fastapi/fastapi
  version: 0.141.1
  tag: 0.141.1
  commit: 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f
  checkout: ../fastapi
  python:
    requires: ">=3.10"
    oracle: {implementation: CPython, version: 3.12.13}
  pydantic:
    version: 2.13.4
    pydantic_core_version: 2.46.4
    source_lock_version: 2.13.4
    public_layer: Reuse Pydantic's public Python model API.
    native_layer: FastAPI-RS calls the separately built pydantic-core==2.46.4 Python wheel APIs through PyO3; its Rust implementation remains Pydantic-owned and is not a FastAPI-RS Cargo dependency or public API.
  upstream_source_lock:
    file: uv.lock
    purpose: FastAPI source-inventory provenance only; it does not select the oracle profile.
    sha256: 96ae079a121e11b4cc0d260df5b7f77189bb90fa23a2da368f607418c2d98165
    components: {pydantic: 2.13.4, starlette: 1.3.1, httpx: 0.28.1}
  starlette:
    repository: https://github.com/Kludex/starlette
    version: 1.6.0
    commit: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
    checkout: ../starlette
    contract: sole Starlette oracle and replacement contract

target_runtime:
  python: CPython 3.12.13
  lock:
    path: requirements/target-runtime-cpython-3.12.13.lock
    sha256: efb7ca633fc9a9c8587a6f59f8ee9b509151f6f77ceb75a56dd3cdeff2be99f7
    profile: CPython 3.12.13

fault_contract_policy:
  schema: fastapi-rs/fault-contract-policy@1
  target_only: true
  build_feature: fault-injection
  normal_build_control: absent
  result_rule: Oracle receipts must be not_applicable; target identity must prove the instrumented build.
  inputs_contain_expected_outputs: false
  contracts:
    - point: http.route.invoke.before
      contract: http-route-invocation-error-and-recovery
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect: {kind: http_response, status: 200}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.route.invoke.after_dependencies.before
      contract: http-route-invocation-error-cleans-dependencies
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect:
          kind: http_response
          status: 200
          body: {events: [dependency-enter, dependency-cleanup]}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.route.invoke.after_dependencies.before
      contract: http-route-invocation-error-orders-function-and-request-dependency-cleanup
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect:
          kind: http_response
          status: 200
          body:
            events: [function-enter, request-enter, function-cleanup, request-cleanup, response-start, response-end]
      excludes: [exception_message, stack_trace, source_line, private_state]

