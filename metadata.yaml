      supported_slice: >-
        The router-prefix-and-nested-composition workflow supplies only `router`
        and `prefix` to app inclusion, adding `tags` on repeated inclusion.
        This workflow does not establish include-level response-map precedence;
        that behavior is covered separately by `bigger-applications.response-precedence`.
        The callback include parameter is covered by
        `atlas-pending-callbacks-source-wave`, which observes the merged callback
        routes in an OpenAPI operation. Other unused include options remain
        outside this slice. The included Starlette Mount and Host cases compare
        prefixed HTTP dispatch and named URL reversal only; WebSocket dispatch
        through those route families, route-name collisions, and other prefix
        combinations remain unestablished.

        Includes routes registered on APIRouter, combines route, nested-router,
        and inclusion prefixes, and preserves endpoint dependency plans. The
        included Starlette Mount and Host cases compare prefixed HTTP dispatch and
        named URL reversal for constructor-supplied route families.
        relative-path router case observes inclusion with prefix `/v2`, dispatch
        at `/v2items/sku-17`, and URL reversal. The
        reviewed fixtures cover path parameters, repeated nested inclusions,
        the users router's scalar query dependency, and ordered string tag
        inheritance across app, parent-router, include, child-router, and route
        scopes. Router/include `deprecated` values propagate to OpenAPI, and
        `include_in_schema=False` omits routes without affecting dispatch.
        The late-route source-review cases observe API and raw WebSocket routes
        plus frontends registered after app inclusion, and a nested API
        WebSocket registered after both inclusion levels. They compare the
        configured prefixes, inherited API-WebSocket dependencies, protocol
        messages and close metadata, and frontend fallback. These cases do not
        establish precedence for route collisions after late registration.
        The repeated-inclusion fixture observes each effective context's path,
        inherited tags, and generated unique ID for all four concrete prefixes.
        Its isolated OpenAPI fixture compares the complete `/paths` value,
        stricter than the source test's path-name set assertion.
        Scalar-query dependencies supplied to `include_router` execute before
        the target router's dependencies and are included in its OpenAPI input
        parameters by router-dependencies-isolated.
        For WebSocket routes, the selected `test_ws_dependencies.py` cases
        preserve app, include, router, and route dependency ordering in emitted
        messages for both root and prefixed included routers.
        Router-level and include-level `responses` maps remain outside this
        APIRouter-specific slice. The callback-source-wave fixture observes
        callback routes supplied at FastAPI, router, nested include, and operation
        scopes in the exact OpenAPI `/callbacks` value. Callback errors,
        mutation history, and unsupported callback route families remain
        unproven. Custom response classes and other ID policies remain outside
        this slice.
        Route-level `responses` maps with one or more non-colliding Python
        integer (not bool) status keys and one non-empty string `description`
        per key are preserved on the included route, sampled by
        `path-operation-other-verbs-responses`. Included routers also contribute
        legacy startup/shutdown handlers and nested lifespan contexts. The
        lifecycle workflow observes successful startup/shutdown order and
        request-visible merged state, including app precedence for duplicate
        keys; lifecycle error paths and TestClient.app_state are not covered.
        The app's `strict_content_type` value is the root context for included
        routers; `strict-content-type-router-level-upstream` observes
        absent-header rejection or JSON parsing under app and router overrides.
        Five response-field-lifecycle inputs reach router construction/GET and
        application inclusion with fixed response models and omitted or concrete
