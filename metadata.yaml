      supported_slice: >-
        The router-prefix-and-nested-composition workflow calls `FastAPI()` with
        no constructor arguments. It records only default construction needed
        for those requests and adds no coverage for constructor options. Source
        parameters `debug`, `routes`, and `**extra` remain
        unsupported by that binding. The `responses` constructor map is carried
        into the app router and shallow-merged by status with include, router,
        and operation maps. `bigger-applications.response-precedence` selects
        distinct statuses and a repeated status at each layer in OpenAPI; live
        identity-checked comparison is still required.

        Constructor-supplied `callbacks` are included with router, include, and
        operation callback routes in the selected `/callbacks` OpenAPI pointer;
        `atlas-pending-callbacks-source-wave` compares this exact projection.
        Callback execution, mutation history, and malformed callback routes are
        outside this slice.

        Partial native constructor slice: the exception_handlers argument
        accepts a mapping keyed by exception class or HTTP status code, and
        registered custom HTTP handlers participate in response dispatch.
        Identity-checked workflows cover exception-class, status-code, and
        default Starlette HTTPException handling. The WebSocket validation
        workflow observes the default handler mapping and confirms that a
        constructor-supplied handler is preserved and used. The constructor also accepts
        the default and custom `docs_url` path and an optional `redoc_url`; the
        metadata tutorial workflow observes a moved Swagger UI route and a
        disabled ReDoc route. Attribute access to those stored values and other
        documentation options, including disabling OpenAPI with `None`, remain
        outside this slice.
        FastAPI forwards its redirect_slashes constructor option into the
        router. Independent request workflows cover the enabled default and
        explicit disabled setting; slash matching and redirect response
        mechanics remain owned by Starlette-RS.
        The application exposes a
        mutable dependency_overrides mapping used by the reviewed synchronous
        and asynchronous override slices in Depends. The synchronous slice
        replaces an app-level dependency with a callable whose nested
        dependency introduces exactly one required scalar query field `k`;
        missing `k` fails request validation and `?k=bar` succeeds. The async
        slice is constrained below. The constructor also supports the metadata
        tutorial's non-empty `summary`, `description`, and `terms_of_service`,
        plus truthy `contact` and `license_info`, in OpenAPI info through
        `metadata-summary-description-upstream`. That workflow also verifies a
        truthy constructor-provided `openapi_external_docs` mapping at
        `/externalDocs`; empty, omitted, and invalid values are not part of this
        slice. The `openapi_tags` constructor value is retained on the public app
        attribute and emitted as the ordered top-level OpenAPI `tags` array,
        including nested `externalDocs`; `constructor-openapi-tags` observes
        both through the public app and `/openapi.json`. Empty, invalid, and
        post-cache mutation behavior remain outside this slice. The
        `dependencies` argument applies to direct WebSocket routes
        and included-router WebSocket routes. Selected cases observe app,
        include, router, and route dependency order through WebSocket messages
        and ASGI event order; other dependency forms and HTTP-path ordering are
        not exercised by this workflow. Custom request/WebSocket validation
        handlers, default FastAPI RequestValidationError and
        WebSocketRequestValidationError entries, handler registration after
        middleware-stack caching, other constructor options, and override
        cache behavior beyond the reviewed Depends slice remain outside this
        reviewed slice. Lifecycle coverage exercises legacy event decorators,
        on_startup/on_shutdown constructor callbacks, async context managers,
        and sync/async generator lifespans through direct ASGI startup, request,
        and shutdown. Nested yielded state is merged with app values winning
        duplicate keys; empty and mixed yielded-state cases are included.
        One included-router startup error suppressed by an already-entered app
        lifespan is mapped. Exact `lifespan.startup.failed.message` traceback
        text differs between Python Starlette and Starlette-RS; the parity case
        keeps that observation exact and exposes the sibling-owned gap. Other
        failure modes and combining an explicit lifespan with legacy constructor
        callbacks are not established. The mounted-subapp case confirms that
        the parent lifespan does not start the mounted app.
        TestClient.app_state remains outside this direct-ASGI workflow. The
        `strict_content_type` constructor option is also covered: the default
        rejects a JSON body without a content-type, while `False` parses that
        body as JSON. App-level behavior is mapped by
        `strict-content-type-router-level-upstream`, which also observes
        nested app/router inheritance. Other media types are not treated as JSON
        unless they are `application/json` or an `application/*+json` subtype.
        The constructor's `middleware` sequence is also copied and applied in
        its declared order; the constructor-middleware-order workflow observes
        two user middleware entries over HTTP. FastAPI's additional
        AsyncExitStackMiddleware behavior and other constructor options remain
        outside this slice.
        The response-field-lifecycle inputs declare sixteen immutable response-field and
        response-class cases: direct registration and repeated inclusion,
        Annotated/Field metadata with schema hooks and exact warnings/errors, retained
        validation/serialization callbacks, aliases and output flags, omitted versus
        concrete/inherited/None response classes, NaN, and returned-Response bypass.
        Registration and each included effective context have distinct source
        field-construction/reuse boundaries. The public state body preserves ordered
        unfiltered warning entries and all prior probe send fields. These are input
        mappings requiring fresh live receipts, not target-complete support;
        DefaultPlaceholder and ModelField remain internal source evidence.
        Seven response-field-traversal normal inputs map fixed public route trees, a
        one-use user schema-hook refusal and retry, parent own-field preparation
        before child traversal, earlier full versus partial matches, misses, slash
        search and returned-Response field setup. They retain actual construction,
        callbacks, warnings/errors, exact status/ordered headers/body and full prior
        non-state send fields through an early public state route. Source-derived
        branch publication and traversal contracts require fresh identity-checked
        source/target receipts; these mappings do not establish complete target
        support, mutable router-version history or generic sibling behavior.

        The included-lifespan startup-suppression case compares the exact
        `lifespan.startup.failed.message`; traceback formatting differs between
        Python Starlette and Starlette-RS and remains a sibling-owned parity gap.
        Three additional-response-field lifecycle inputs observe saved-decorator
        attachment, original and two effective-context extra/primary core hooks,
        and second-extra ordinary user refusal/retry. They select the full warning,
        public error and raw-send journals through an earlier state route. Defined
        JSON hooks expose premature invocation only; no OpenAPI request is made.
        These are reviewed input mappings requiring fresh live receipts. Positive
        OpenAPI/shared-definition phases, falsy models, forbidden-body statuses,
        include-level responses, dependency schema timing and mutable history
        remain separate compatibility gates.

        The custom `generate_unique_id_function` is the default for direct routes and the application-level fallback when an included router retains its default callback, sampled by `generate-unique-id-function-precedence`. Duplicate operation-ID warnings and operation values are sampled by `generate-unique-id-duplicate-warnings`. Multi-method registration passes the full method set to one callback on direct and included routes, sampled by `generate-unique-id-multi-methods`. Callback exceptions, integer/empty/unhashable results, duplicate integer IDs, operation-ID short-circuit behavior, summary/tag mutation, a selected pre-callback APIRoute state projection, and method addition, removal, and clearing for direct and included routes are mapped by `generate-unique-id-callback-values`. These are input mappings; live parity remains required. Other APIRoute state and mutations remain unproven.

        Its route view exposes the selected source fields and supports `summary`, tag-list, and method-set mutation during the unique-ID callback. Inputs observe direct and included route values, explicit false normalized to `None` for direct `deprecated`, inherited true `deprecated`, selected callback-time response-model options, response-class/default placeholder, route regex and converters, dependency provider, strict content type, stream item type, and the absence of selected later-initialized attributes. Dedicated input recipes map removal/addition of methods, clearing the method set, exact HTTP dispatch, and OpenAPI projection; live parity remains required. Mutations beyond these selected fields, complete APIRoute constructor behavior, and later route-method effects remain unproven.
        Constructor-supplied `webhooks` APIRouter routes are emitted under the
        OpenAPI `webhooks` map and are absent from the app's inbound paths and
        dispatch, as observed by `webhooks-constructor`; this does not establish
        full constructor-signature parity or arbitrary route-object support.
        The documented `separate_input_output_schemas` keyword defaults to true;
        false maps ordinary response fields to validation-mode schemas while
        models with computed fields retain serialization-mode schemas. The
        linked inputs compare both modes through the generated OpenAPI document.
        Paired runtime inputs select status, exact body bytes, and parsed JSON
        for simple, nested, list, read-list, and computed-field requests under
        both settings; the five source test functions map to those cases.
