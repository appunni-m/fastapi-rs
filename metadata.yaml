  # These rules link method identities to the exact decorator evidence nested
  # in their containing class's atlas deprecation record. Warning category and
  # message observations are now captured for the legacy event
  # registration workflow; warning identity outside that tested call path stays
  # subject to the separate warning-classification review.
  deprecation_reference_rules:
    - id: fastapi-app-on-event
      symbol_id: fastapi.applications.FastAPI.on_event
