schema: fastapi-rs/api-source-authority@1

# Canonical human-maintained source identities, contract policy, and reviewed
# API overlays. Candidate rows are generated from the pinned source; reviewed
# overlays add only source-backed operation and observation links.
authority:
  project: FastAPI
  repository: https://github.com/fastapi/fastapi
  version: 0.141.1
  tag: 0.141.1
  commit: 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f
  checkout: ../fastapi
  python:
    requires: ">=3.10"
    oracle: {implementation: CPython, version: 3.12.13}
  pydantic:
    version: 2.13.4
    pydantic_core_version: 2.46.4
    source_lock_version: 2.13.4
    public_layer: Reuse Pydantic's public Python model API.
    native_layer: pydantic-core is Pydantic's Rust implementation detail, not FastAPI-RS API.
  upstream_source_lock:
    file: uv.lock
    purpose: FastAPI source-inventory provenance only; it does not select the oracle profile.
    components: {pydantic: 2.13.4, starlette: 1.3.1, httpx: 0.28.1}
  starlette:
    repository: https://github.com/Kludex/starlette
    version: 1.6.0
    commit: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
    checkout: ../starlette
    contract: sole Starlette oracle and replacement contract

manifest:
  path: tests/fixtures/manifest.yaml
  fastapi_identity_pointer: /selected_contracts/fastapi
  starlette_identity_pointer: /selected_contracts/starlette
  pydantic_identity_pointer: /selected_contracts/pydantic

api_inventory:
  completeness: generated source inventory plus classified candidate atlas; not a support claim
  generator: scripts/inventory_fastapi_api.py
  command: python scripts/inventory_fastapi_api.py ../fastapi --output tests/fixtures/api-inventory.json
  artifact: tests/fixtures/api-inventory.json
  schema: fastapi-rs/source-api-inventory@1
  source_identity_pointer: /source_identity
  source_pointers:
    root_exports: /root_exports
    documented_targets: /documented_targets
    modules_and_definitions: /modules
    import_bindings_and_aliases: /import_bindings
    source_deprecations: /deprecations
  count_pointers:
    root_exports:
      artifact: /counts/root_exports
      manifest: /source_artifacts/api_inventory/counts/root_exports
    documented_targets:
      artifact: /counts/documented_target_names
      manifest: /source_artifacts/api_inventory/counts/documented_targets
    python_source_modules:
      artifact: /counts/python_source_modules
      manifest: /source_artifacts/api_inventory/counts/python_source_modules
    source_defined_callables:
      artifact: /counts/source_defined_callables
      manifest: /source_artifacts/api_inventory/counts/source_defined_callables
    import_bindings:
      artifact: /counts/import_bindings
      manifest: /source_artifacts/api_inventory/counts/import_bindings
    source_deprecations:
      artifact: /counts/symbols_with_source_deprecation_evidence
      manifest: /source_artifacts/api_inventory/counts/source_deprecations

classification_atlas:
  artifact: tests/fixtures/compatibility-atlas.json
  schema: fastapi-rs/compatibility-atlas@2
  candidates_pointer: /api_candidates
  classification_pointer: /classification
  policy_pointer: /classification_policy
  section_pointers:
    aliases: /aliases
    deprecations: /deprecations
    errors: /errors
    optional_features: /optional_features
    starlette_integration_edges: /starlette_integration_edges
  count_pointers:
    api_candidates:
      artifact: /counts/api_candidates
      manifest: /source_artifacts/compatibility_atlas/counts/api_candidates
    supported:
      artifact: /counts/api_classifications/supported
      manifest: /source_artifacts/compatibility_atlas/counts/source_classifications/supported
    private_or_internal:
      artifact: /counts/api_classifications/private~1internal
      manifest: /source_artifacts/compatibility_atlas/counts/source_classifications/private_or_internal
    uncertain:
      artifact: /counts/api_classifications/uncertain
      manifest: /source_artifacts/compatibility_atlas/counts/source_classifications/uncertain
    aliases:
      artifact: /counts/alias_records
      manifest: /source_artifacts/compatibility_atlas/counts/alias_records
    source_deprecations:
      artifact: /counts/source_deprecations
      manifest: /source_artifacts/compatibility_atlas/counts/source_deprecations
  classifications:
    supported: Explicit root export, documented target/import, reviewed public contract, or documented model field; source evidence only.
    private/internal: Private-name or implementation/protocol evidence without a consumer-facing contract.
    uncertain: Public-looking or importable name whose consumer-facing status needs review; retain visibly.
  status: candidates require operation review before compatibility claims

starlette_rs:
  owner: ../starlette-rs
  repository: https://github.com/appunni-m/starlette-rs
  commit: e60b8f1dc6a50c0d5597587fe5408669ed7572e7
  distribution_version: 0.1.0
  contract_id: starlette-1.6.0-asgi-http-config-schema-slice
  metadata: ../starlette-rs/metadata.yaml
  manifest: ../starlette-rs/tests/fixtures/manifest.yaml
  api_catalog: ../starlette-rs/docs/api-surface.csv
  api_review: ../starlette-rs/docs/atlas/api-review.csv
  coverage_matrix: ../starlette-rs/docs/atlas/coverage-matrix.csv
  manifest_contract_pointer: /scope/id
  manifest_revision_pointer: /scope/inventory/revision
  metadata_revision_pointer: /authority/revision
  boundary: FastAPI records only its direct Starlette imports, aliases, inheritance and integration edges; generic Starlette API and behavior stay sibling-owned.
  catalog_policy: Link to sibling artifacts; never copy or expand the Starlette API catalog here.

reviewed_api_contract_overlay:
  schema: fastapi-rs/reviewed-api-contract-overlay@1
  purpose: >-
    Source-backed overlays link selected supported operations to documented
    features, observable selectors, and candidate error records. An error link
    does not promote an uncertain exception into the public import contract.
  error_selector_rules:
    - id: http-exception
      candidate_ids:
        - fastapi.exceptions.HTTPException
        - fastapi.exceptions.StarletteHTTPException
      target_paths:
        - fastapi.exceptions.HTTPException
        - starlette.exceptions.HTTPException
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
    - id: request-validation
      candidate_ids: [fastapi.exceptions.RequestValidationError]
      target_paths: [fastapi.exceptions.RequestValidationError]
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
        - validation.error_class
        - validation.error_details
    - id: websocket-exception
      candidate_ids:
        - fastapi.exceptions.WebSocketException
        - fastapi.exceptions.StarletteWebSocketException
      target_paths:
        - fastapi.exceptions.WebSocketException
        - starlette.exceptions.WebSocketException
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - websocket.close_code
        - websocket.close_reason
    - id: websocket-request-validation
      candidate_ids: [fastapi.exceptions.WebSocketRequestValidationError]
      target_paths: [fastapi.exceptions.WebSocketRequestValidationError]
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - validation.error_class
        - validation.error_details
        - websocket.close_code
        - websocket.close_reason
    - id: response-validation
      candidate_ids: [fastapi.exceptions.ResponseValidationError]
      target_paths: [fastapi.exceptions.ResponseValidationError]
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - asgi.application_error.exception
        - validation.error_class
        - validation.error_details
  operations:
    fastapi.exception_handlers.http_exception_handler:
      source_evidence:
        - {path: fastapi/exception_handlers.py, symbol: http_exception_handler}
        - {path: docs_src/handling_errors/tutorial006_py310.py, symbol: custom_http_exception_handler}
      feature_ids: [public-api-errors]
      observation_selectors:
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
      documentation_contract_refs:
        - source_path: docs/en/docs/tutorial/handling-errors.md
          fixture_id: fastapi.docs.tutorial-handling-errors
          observation_selectors:
            - http.status
            - http.headers.ordered
            - http.body.bytes
            - http.body.json
      error_contract_ids:
        - fastapi.exceptions.HTTPException
        - fastapi.exceptions.StarletteHTTPException
    fastapi.exception_handlers.request_validation_exception_handler:
      source_evidence:
        - {path: fastapi/exception_handlers.py, symbol: request_validation_exception_handler}
        - {path: docs_src/handling_errors/tutorial006_py310.py, symbol: validation_exception_handler}
      feature_ids: [public-api-errors, request-validation]
      observation_selectors:
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
        - validation.error_class
        - validation.error_details
      documentation_contract_refs:
        - source_path: docs/en/docs/tutorial/handling-errors.md
          fixture_id: fastapi.docs.tutorial-handling-errors
          observation_selectors:
            - http.status
            - http.body.bytes
            - http.body.json
            - validation.error_class
            - validation.error_details
      error_contract_ids: [fastapi.exceptions.RequestValidationError]
    fastapi.applications.FastAPI.websocket:
      source_evidence:
        - {path: fastapi/applications.py, symbol: websocket}
        - {path: fastapi/routing.py, symbol: get_websocket_app}
      feature_ids: [request-validation, websocket-lifecycle]
      observation_selectors:
        - validation.error_class
        - validation.error_details
        - websocket.close_code
        - websocket.close_reason
      error_contract_ids: [fastapi.exceptions.WebSocketRequestValidationError]
    fastapi.routing.APIRouter.websocket:
      source_evidence:
        - {path: fastapi/routing.py, symbol: websocket}
        - {path: fastapi/routing.py, symbol: get_websocket_app}
      feature_ids: [request-validation, websocket-lifecycle]
      observation_selectors:
        - validation.error_class
        - validation.error_details
        - websocket.close_code
        - websocket.close_reason
      error_contract_ids: [fastapi.exceptions.WebSocketRequestValidationError]
    fastapi.routing.APIRoute.get_route_handler:
      source_evidence:
        - {path: fastapi/routing.py, symbol: get_route_handler}
        - {path: fastapi/routing.py, symbol: get_request_handler}
      feature_ids: [response-serialization]
      observation_selectors:
        - asgi.application_error.exception
        - validation.error_class
        - validation.error_details
      error_contract_ids: [fastapi.exceptions.ResponseValidationError]
  warning_classification_reviews:
    fastapi.exceptions.FastAPIDeprecationWarning:
      classification: uncertain
      rationale: >-
        The source defines a custom warning and the release notes announce it,
        but neither establishes a direct public import contract. Keep the
        source candidate visible without promoting its classification.
      evidence:
        - kind: source-definition
          path: fastapi/exceptions.py
          symbol: FastAPIDeprecationWarning
          start_line: 252
          end_line: 256
        - kind: release-note
          path: docs/en/docs/release-notes.md
          line: 1073
          section: 0.127.1 (2025-12-26)
          statement: Add a custom FastAPIDeprecationWarning.
