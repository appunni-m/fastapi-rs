pydantic_core_dependency_inventory:
  schema: fastapi-rs/pydantic-core-cargo-inventory@1
  generator: scripts/render_pydantic_core_dependency_inventory.py
  artifact: docs/PYDANTIC_CORE_DEPENDENCIES.md
  purpose: >-
    Recursively map the native Cargo graph inside the separately installed
    pydantic-core Python wheel while preserving Pydantic ownership and the
    FastAPI-RS Cargo/runtime dependency boundary.
  role_policy: >-
    Roles are resolved Cargo reachability from the Pydantic Core package root;
    normal, build, and dev paths remain distinct, with optional-path labels.
  feature_policy: >-
    Report Cargo's enabled-feature union from the pinned lock graph, including
    defaults and activated optional features; this is not a per-platform wheel
    feature guarantee.

