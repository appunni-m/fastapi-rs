reviewed_api_contract_overlay:
  schema: fastapi-rs/reviewed-api-contract-overlay@2
  purpose: >-
    Source-backed overlays link selected supported operations to documented
    features, observable selectors, and candidate error records. Inherited
    operations record FastAPI exposure and either delegate to a canonical pinned
    Starlette-RS operation or state the exact sibling-contract gap and source
    signature. An error link does not promote an uncertain exception into the
    public import contract.
  error_selector_rules:
    - id: http-exception
      candidate_ids:
        - fastapi.exceptions.HTTPException
        - fastapi.exceptions.StarletteHTTPException
      target_paths:
        - fastapi.exceptions.HTTPException
        - starlette.exceptions.HTTPException
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
    - id: request-validation
      candidate_ids: [fastapi.exceptions.RequestValidationError]
      target_paths: [fastapi.exceptions.RequestValidationError]
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
        - validation.error_class
        - validation.error_details
    - id: websocket-exception
      candidate_ids:
        - fastapi.exceptions.WebSocketException
        - fastapi.exceptions.StarletteWebSocketException
      target_paths:
        - fastapi.exceptions.WebSocketException
        - starlette.exceptions.WebSocketException
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - websocket.close_code
        - websocket.close_reason
    - id: websocket-request-validation
      candidate_ids: [fastapi.exceptions.WebSocketRequestValidationError]
      target_paths: [fastapi.exceptions.WebSocketRequestValidationError]
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - validation.error_class
        - validation.error_details
        - websocket.close_code
        - websocket.close_reason
    - id: response-validation
      candidate_ids: [fastapi.exceptions.ResponseValidationError]
      target_paths: [fastapi.exceptions.ResponseValidationError]
      observation_selectors:
        - error.class
        - error.args
        - error.public_attributes
        - asgi.application_error.exception
        - validation.error_class
        - validation.error_details
  # These rules link method identities to the exact decorator evidence nested
  # in their containing class's atlas deprecation record. Warning category and
  # message observations are now captured for the legacy event
  # registration workflow; warning identity outside that tested call path stays
  # subject to the separate warning-classification review.
  deprecation_reference_rules:
    - id: fastapi-app-on-event
      symbol_id: fastapi.applications.FastAPI.on_event
      deprecation_symbol_id: fastapi.applications.FastAPI
      source_path: fastapi/applications.py
      source_line: 4654
      source_end_line: 4661
    - id: fastapi-router-on-event
      symbol_id: fastapi.routing.APIRouter.on_event
      deprecation_symbol_id: fastapi.routing.APIRouter
      source_path: fastapi/routing.py
      source_line: 6415
      source_end_line: 6422
  operations:
    fastapi.applications.FastAPI.__init__:
      rust_binding: fastapi-rs/src/application_runtime.rs::PyFastApi::new
      source_evidence:
        - path: fastapi/applications.py
          symbol: __init__
          kind: source-definition
          start_line: 58
          end_line: 1018
        - path: tests/test_tutorial/test_metadata/test_tutorial003.py
          symbol: test_swagger_ui_custom_url
          kind: source-definition
          start_line: 48
          end_line: 51
        - path: tests/test_exception_handlers.py
          symbol: test_override_http_exception
          kind: source-definition
          start_line: 58
          end_line: 61
        - {path: tests/test_strict_content_type_app_level.py}
        - {path: docs/en/docs/advanced/strict-content-type.md}
        - {path: fastapi/applications.py, symbol: __init__}
        - {path: tests/test_ws_dependencies.py, symbol: test_index}
        - {path: tests/test_ws_dependencies.py, symbol: test_routerindex}
        - {path: tests/test_ws_dependencies.py, symbol: test_routerprefixindex}
        - {path: tests/test_dependency_overrides.py, symbol: test_override_simple}
        - {path: tests/test_request_params/test_query/test_required_str.py, symbol: test_required_alias_missing}
        - {path: tests/test_request_params/test_query/test_required_str.py, symbol: test_required_alias_by_alias}
        - path: tests/test_dependency_overrides.py
          symbol: test_override_with_sub_main_depends
          kind: source-definition
          start_line: 216
          end_line: 231
        - path: tests/test_dependency_overrides.py
          symbol: test_override_with_sub_main_depends_k_bar
          kind: source-definition
          start_line: 252
          end_line: 257
        - {path: tests/test_tutorial/test_testing_dependencies/test_tutorial001.py, symbol: test_override_in_users_with_params}
        - {path: docs_src/dependency_testing/tutorial001_py310.py}
        - {path: tests/test_tutorial/test_metadata/test_tutorial001.py, symbol: test_openapi_schema}
        - {path: docs_src/metadata/tutorial001_py310.py}
        - {path: fastapi/openapi/utils.py, symbol: get_openapi}
        - {path: fastapi/applications.py, symbol: openapi}
        - {path: tests/test_application.py, symbol: test_openapi_schema}
        - {path: tests/main.py}
        - {path: tests/test_router_events.py, symbol: test_app_lifespan_state}
        - {path: tests/test_router_events.py, symbol: test_router_nested_lifespan_state}
        - {path: tests/test_router_events.py, symbol: test_router_nested_lifespan_state_overriding_by_parent}
        - {path: tests/test_router_events.py, symbol: test_merged_no_return_lifespans_return_none}
        - {path: tests/test_router_events.py, symbol: test_merged_mixed_state_lifespans}
        - {path: tests/test_router_events.py, symbol: test_router_sync_generator_lifespan}
        - {path: tests/test_router_events.py, symbol: test_router_async_generator_lifespan}
        - {path: tests/test_router_events.py, symbol: test_startup_shutdown_handlers_as_parameters}
        - {path: docs/en/docs/advanced/events.md}
      feature_ids: [public-api-errors, app-routing, dependency-security, request-validation, websocket-lifecycle, openapi-docs]
      observation_selectors: [http.status, http.headers.ordered, http.body.bytes, websocket.event_order, websocket.messages, openapi.document, asgi.lifespan.event_order, asgi.lifespan.startup, asgi.lifespan.shutdown, asgi.lifespan.application_errors, asgi.lifespan.workload_trace, warnings.category_message]
      supported_slice: >-
        Partial native constructor slice: the exception_handlers argument
        accepts a mapping keyed by exception class or HTTP status code, and
        registered custom HTTP handlers participate in response dispatch.
        Identity-checked workflows cover exception-class, status-code, and
        default Starlette HTTPException handling. The constructor also accepts
        the default and custom `docs_url` path and an optional `redoc_url`; the
        metadata tutorial workflow observes a moved Swagger UI route and a
        disabled ReDoc route. Attribute access to those stored values and other
        documentation options, including disabling OpenAPI with `None`, remain
        outside this slice.
        The application exposes a
        mutable dependency_overrides mapping used by the reviewed synchronous
        and asynchronous override slices in Depends. The synchronous slice
        replaces an app-level dependency with a callable whose nested
        dependency introduces exactly one required scalar query field `k`;
        missing `k` fails request validation and `?k=bar` succeeds. The async
        slice is constrained below. The constructor also supports the metadata
        tutorial's non-empty `summary`, `description`, and `terms_of_service`,
        plus truthy `contact` and `license_info`, in OpenAPI info through
        `metadata-summary-description-upstream`. That workflow also verifies a
        truthy constructor-provided `openapi_external_docs` mapping at
        `/externalDocs`; empty, omitted, and invalid values are not part of this
        slice. The `dependencies` argument applies to direct WebSocket routes
        and included-router WebSocket routes. Selected cases observe app,
        include, router, and route dependency order through WebSocket messages
        and ASGI event order; other dependency forms and HTTP-path ordering are
        not exercised by this workflow. Custom request/WebSocket validation
        handlers, default FastAPI RequestValidationError and
        WebSocketRequestValidationError entries, handler registration after
        middleware-stack caching, other constructor options, and override
        cache behavior beyond the reviewed Depends slice remain outside this
        reviewed slice. Lifecycle coverage exercises legacy event decorators,
        on_startup/on_shutdown constructor callbacks, async context managers,
        and sync/async generator lifespans through direct ASGI startup, request,
        and shutdown. Nested yielded state is merged with app values winning
        duplicate keys; empty and mixed yielded-state cases are included.
        Startup/shutdown failure parity and combining an explicit lifespan with
        legacy constructor callbacks are not established. The mounted-subapp
        case confirms that the parent lifespan does not start the mounted app.
        TestClient.app_state remains outside this direct-ASGI workflow. The
        `strict_content_type` constructor option is also covered: the default
        rejects a JSON body without a content-type, while `False` parses that
        body as JSON. App-level behavior is mapped by
        `strict-content-type-router-level-upstream`, which also observes
        nested app/router inheritance. Other media types are not treated as JSON
        unless they are `application/json` or an `application/*+json` subtype.
    fastapi.applications.FastAPI.exception_handler:
      rust_binding: fastapi-rs/src/application_runtime.rs::PyFastApi::exception_handler
      source_evidence:
        - path: fastapi/applications.py
          symbol: exception_handler
          kind: source-definition
          start_line: 4729
          end_line: 4774
        - {path: tests/test_exception_handlers.py, symbol: http_exception_handler}
        - path: docs/en/docs/tutorial/handling-errors.md
          kind: documentation-text
          start_line: 82
          end_line: 102
          required_text:
            - "You could add a custom exception handler with `@app.exception_handler()`:"
      feature_ids: [public-api-errors]
      observation_selectors: [http.status, http.headers.ordered, http.body.bytes, asgi.lifespan.workload_trace]
      supported_slice: >-
        Partial native slice: registers custom HTTP exception handlers through
        the decorator and returns the original handler object. A custom class
        handler for an application exception and the documented 418 status
        handler are exercised by input-only, identity-checked ASGI workflows.
        The custom handler receives the same Request object used by the FastAPI
        path operation. Built-in Starlette HTTPException JSON handling is also
        included.
        Handler registration after the middleware stack has been cached,
        custom request/WebSocket validation handlers, custom WebSocket
        exception object identity, and default FastAPI validation-handler
        entries remain outside this slice.
    fastapi.applications.FastAPI.frontend:
      rust_binding: fastapi-rs/src/application_runtime.rs::PyFastApi::frontend
      source_evidence:
        - {path: fastapi/applications.py, symbol: frontend}
        - {path: fastapi/routing.py, symbol: _FrontendStaticFiles}
        - {path: fastapi/routing.py, symbol: _FrontendRoute}
        - {path: fastapi/routing.py, symbol: _FrontendRouteGroup}
        - {path: tests/test_frontend.py}
        - {path: docs/en/docs/tutorial/frontend.md}
      feature_ids: [app-routing, dependency-security, public-api-errors]
      observation_selectors: [construction.outcome, construction.exception_class, construction.exception_message, dependency.call_order, http.status, http.headers.ordered, http.body.bytes, asgi.application_error.exception, route.match]
      supported_slice: >-
        Source-backed operation scope for FastAPI.frontend. The pinned
        frontend-fallback-routing-source-review workflow maps API-route
        precedence, low-priority static fallback routing, root-path behavior,
        router dependencies, GET/HEAD responses, and directory/fallback
        configuration outcomes. Only behavior observed by identity-checked
        comparisons may be claimed; development warnings, broader Accept
        parsing, unusual path-like values, and unrepresented static-file edge
        cases remain outside this reviewed slice.
    fastapi.Path:
      rust_binding: fastapi-rs/src/parameters.rs::path
      source_evidence:
        - {path: fastapi/param_functions.py, symbol: Path}
        - {path: fastapi/params.py, symbol: Path}
        - {path: tests/test_path.py, symbol: test_path_param_ge_int_2}
        - {path: tests/test_path.py, symbol: test_path_param_le_ge_int_4}
        - {path: tests/test_path.py, symbol: test_path_param_le_int_42}
      feature_ids: [request-validation]
      observation_selectors: [http.status, http.body.bytes]
      supported_slice: >-
        Partial native slice: Annotated[int, Path(gt=0)] validates path integers
        with a strict lower bound; Path(ge=..., le=...) applies inclusive integer
        bounds. The body-surface workflow checks lower and upper bound failures.
        Other Path constructor parameters and FieldInfo options remain outside
        this reviewed slice.
    fastapi.applications.FastAPI.options:
      rust_binding: fastapi-rs/src/application_runtime.rs::PyFastApi::options
      source_evidence:
        - {path: fastapi/applications.py, symbol: options}
        - {path: fastapi/routing.py, symbol: options}
        - {path: fastapi/openapi/utils.py, symbol: get_openapi_operation_metadata}
        - {path: fastapi/openapi/utils.py, symbol: get_openapi_path}
        - {path: tests/test_extra_routes.py, symbol: test_options}
        - {path: tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial004.py, symbol: test_openapi_schema}
        - {path: docs_src/path_operation_advanced_configuration/tutorial004_py310.py}
        - {path: tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial001.py, symbol: test_openapi_schema}
        - {path: docs_src/path_operation_advanced_configuration/tutorial001_py310.py}
        - {path: tests/test_tutorial/test_path_operation_configurations/test_tutorial006.py, symbol: test_openapi_schema}
        - {path: docs_src/path_operation_configuration/tutorial006_py310.py, symbol: read_elements}
        - {path: tests/test_additional_responses_router.py}
