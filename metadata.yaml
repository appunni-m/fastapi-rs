      feature_ids: [dependency-security]
      observation_selectors: [http.status, http.body.bytes, python.signature, construction.outcome, asgi.application_error.exception]
      supported_slice: >-
        The callable-classification inputs declare immutable partial/wrapped
        function, method and instance classification, original invocation, generator
        scopes/cleanup, unmarked returned-coroutine values, and scalar-await errors.
        The worker-dispatch inputs observe sync/async dependency context boundaries.
        Fresh receipts are required; classification LRU history, descriptors, and
        native bound methods remain separate gaps.
        The generator-awaitable-protocol inputs declare direct flagged
        generator awaits, checkpoint/Future resume and errors, original native
        coroutine error propagation, returned ordinary generator iterators,
        rejected flagged/noniterator __await__ returns, synchronous returned
        generator values, validation/cache order, cleanup, and recovery. The
        public state response retains all warning entries and raw ASGI sends.
        These selected inputs require fresh source/target execution receipts;
        they do not establish the complete Python await protocol.
        The override-policy-mutation inputs declare selection at each reached
        edge from the current provider dictionary, including whole-map
        replacement after awaits. Selected parent plans retain captured child
        declarations; policies and cache hits follow child/input solving.
        Later malformed overrides, yielded cleanup, and recovery are observed.
        Classification-cache mutation, custom providers/dict subclasses,
        and dynamic cache-key protocols remain gaps. Fresh receipts are
        required; see the same-request lazy override contract review.
        The dynamic-cache-policy inputs declare raw policy capture, one
        truthiness decision after successful child/input solving, cache
        population even for a false policy, original outer policies across
        overrides, and error/cleanup/recovery observations. Parameterless
        declarations ignore their supplied policy. These inputs require
        fresh execution evidence; see the dynamic cache policy contract review.
        Module-callable review: the root-alias identity workflow observes
        `fastapi.Depends` and `fastapi.param_functions.Depends` as the same
        object, and the direct signature input probes the module path itself.
        The additional dependency-record inputs declare the returned frozen dataclass protocol, source argument binding, raw values, and selected default/Annotated/inferred/parameterless cache and cleanup workflows. Their presence is not an execution result. Native descriptor function-type/code/globals/closure introspection and mutable function-default protocols remain gaps; full dependency graphs and arbitrary nonstring scope execution remain outside this slice.
      target_binding:
        implementation_owner: fastapi-rs
        status: partial-contract
        known_gaps:
          - *generator_await_audit_gap
          - *generator_await_generic_throw_gap
          - *generator_await_protocol_gap
          - *generator_await_history_gap
          - Native descriptor function-type/code/globals/closure and mutable function-default introspection remain different; unexercised dependency graphs and arbitrary nonstring scopes remain incomplete.
