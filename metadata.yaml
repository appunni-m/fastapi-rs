      supported_slice: >-
        When Depends() omits its callable, FastAPI infers the dependency from
        the annotated type. Zero-argument dependency classes are instantiated
        and injected; the independent generic-parameterless-depends workflow
        exercises two distinct classes.
        A single asynchronous parent dependency may depend on an asynchronous
        child with no inputs or only required scalar query inputs; the child is
        resolved before the parent. The independent dependency-wave workflow
        exercises this child-first path. Other request-derived child inputs and
        deeper coroutine graphs remain outside this slice.
        Partial native slice: synchronous callable dependencies with one nested
        dependency level share cached results for repeated dependencies during a
        request. For unoverridden dependency edges, use_cache=False bypasses
        cache lookup while the result can populate an empty cache entry. For a
        synchronous app-level override, lookup and storage use the original
        dependency edge's cache key, including the original callable identity;
        repeated edges to the same original callable therefore invoke the
        replacement once within a request. A new request starts with an empty
        cache, so the replacement runs once again. This behavior is exercised by
        tests/fixtures/input-recipes/parity/dependency-override-cache-request-local.yaml,
        case fastapi.dependencies.override-cache-request-local. `use_cache=False`
        semantics on override edges remain outside this slice. Synchronous
        app-level overrides also rebuild the replacement dependency from its
        signature. This includes a replacement with one nested dependency that
        introduces exactly one required scalar query field `k`: omitting it
        produces 422 required-query validation, while `?k=bar` supplies the
        value and succeeds. Newly introduced body, header, cookie, or path
        fields remain unsupported. On synchronous endpoints, flat Python
        coroutine-function app-level replacements with no nested dependencies
        are also supported when every direct endpoint dependency edge uses
        default caching and is replaced by a coroutine function. The async-
        endpoint coroutine override shape is limited to the separate sample
        below.
        Rust awaits replacements sequentially in declaration order, then caches
        each resolved value under the original callable for the request;
        repeated edges share that value, distinct original callables keep
        separate values, and a later request resolves them again. Input-only
        fixtures exercise repeated edges with one original callable and four
        edges across two originals, each over two requests:
        tests/fixtures/input-recipes/parity/dependency-override-async-cache-request-local.yaml,
        case fastapi.dependencies.override-async-cache-request-local, and
        tests/fixtures/input-recipes/parity/dependency-override-async-two-keys-request-local.yaml,
        case fastapi.dependencies.override-async-two-keys-request-local. A
        narrower query-bearing slice also supports a flat coroutine-function
        override with exactly one optional scalar query parameter defaulting to
        None, when repeated direct endpoint edges reference the same original
        callable, use default caching, and the synchronous endpoint has no
        additional request inputs.
        Reviewed declarations are `q: str | None = None`,
        `q: Annotated[str | None, Query(alias="search")] = None`, and
        `q: int | None = None`. Omission supplies None; `?q=foo`,
        `?search=foo`, and `?q=42` resolve to the matching string or integer
        values. For the integer form, `?q=oops` returns one matching query
        validation issue per repeated edge without invoking the override; a
        later valid request confirms request-local cache reset. Input-only
        fixtures cover these exact shapes:
        tests/fixtures/input-recipes/parity/dependency-override-async-query-cache-request-local.yaml,
        case fastapi.dependencies.override-async-query-cache-request-local;
        tests/fixtures/input-recipes/parity/dependency-override-async-query-alias-cache-request-local.yaml,
        case fastapi.dependencies.override-async-query-alias-cache-request-local;
        and tests/fixtures/input-recipes/parity/dependency-override-async-query-validation-aggregation.yaml,
        case fastapi.dependencies.override-async-query-validation-aggregation.
        A separate uncached-edge slice covers a synchronous endpoint with the
        same original dependency on direct edges, all replaced by the same flat
        coroutine function. It covers two orderings: two `use_cache=False`
        edges followed by one default-cached edge, and default-cached followed
        by uncached then cached. Uncached edges bypass lookup and invoke the
        replacement; they fill an empty request cache but leave an existing
        value intact, and later cached edges reuse the first value. A later
        request resolves all three edges again. These independently authored
        partial samples combine cache and override behavior; no single upstream
        test asserts these exact async/uncached combinations:
        tests/fixtures/input-recipes/parity/dependency-override-async-uncached-edges-request-local.yaml,
        cases fastapi.dependencies.override-async-uncached-edges-request-local
        and fastapi.dependencies.override-async-cache-uncached-edges-request-local.
        A mixed-edge sample covers a synchronous endpoint whose first direct
        edge is a flat, unoverridden synchronous dependency and whose second
        direct edge is a distinct flat coroutine-function override; neither
        dependency has inputs or nested dependencies. Rust resolves them in
        declaration order, offloading the synchronous callable through
        Starlette-RS `run_in_threadpool` and awaiting the coroutine override.
        Two requests expose values, cumulative call counts, and resolution
        order; the sample does not assert worker thread identity:
        tests/fixtures/input-recipes/parity/dependency-override-mixed-sync-async-direct-order-request-local.yaml,
        case fastapi.dependencies.override-mixed-sync-async-direct-order-request-local.
        A narrow async-endpoint sample follows the main endpoint from
        `test_override_simple`: its original async dependency requires `q`,
        while the flat async override accepts only optional scalar `q` and
        returns the reviewed fixed `skip` and `limit` values. Omitted `q` and
        `?q=foo` are observed in independent requests. This is an independent
        two-case sample and does not establish other async-endpoint edge,
        cache, or parameter layouts:
        tests/fixtures/input-recipes/parity/dependency-override-async-endpoint-request-local.yaml,
        cases fastapi.dependencies.override-async-endpoint-omitted-query and
        fastapi.dependencies.override-async-endpoint-supplied-query.
        A separate async-endpoint sample covers one app-level coroutine
        override with one nested coroutine dependency whose signature adds
        exactly two required, unaliased scalar query parameters (`k: str` and
        `revision: int`). Both missing, one missing, an invalid integer beside
        the valid string, and both valid are observed independently. This
        extends the pinned async nested-override test's single required `k`
        field using FastAPI's generic query validation path; the independently
        authored input is
        tests/fixtures/input-recipes/parity/dependency-override-async-nested-two-required-query-wave.yaml,
        case fastapi.dependency-overrides.async-nested-two-required-query.
        A second case composes the same nested override shape with two required
        `Annotated` query aliases (`item-key` and `revision-number`). It
        observes missing, partial, invalid-integer, and valid alias inputs.
        The upstream override and required-alias tests establish these
        component rules; no upstream test asserts their exact combination:
        tests/fixtures/input-recipes/parity/dependency-override-async-nested-two-required-query-wave.yaml,
        case fastapi.dependency-overrides.async-nested-two-distinct-query-aliases.
        `Query(...)` used as the Python default, validation aliases, constraints,
        validators, non-scalar parameters, other query-bearing multi-key
        layouts, and newly introduced body, header, cookie, or path inputs
        remain outside the query-bearing slice. Outside these
        coroutine-override slices are mixed-edge arrangements other than the
        reviewed unoverridden-sync-then-coroutine shape, uncached-edge layouts
        other than the reviewed repeated-callable cache-fill and cache-retention
        orderings, nested dependencies of coroutine overrides, async endpoints
        outside the reviewed one-edge optional-query sample, and async callable-
        instance endpoints and overrides.
        Direct sync-generator and async-generator dependencies are supported as
        yielded contexts for HTTP and WebSocket endpoints. A direct yield
        dependency uses `Depends(scope="function")` for function scope,
        `Depends(scope="request")` for request scope, and defaults to request
        scope. HTTP function contexts exit after the endpoint constructs its
        response and before response sending; request contexts exit only after
        the response ASGI call finishes, including streaming. WebSocket function
        and request contexts both exit after endpoint completion, in function-
        then request-scope order. Route exceptions are passed through both
        stacks before HTTP exception handling. A yielded request-scoped parent
        that directly depends on a function-scoped child fails during route
        construction with `DependencyScopeError` and FastAPI's source message.
        The independent `dependency-lifecycle` scope-cleanup case covers HTTP
        streaming lifetime; the independent `dependency-scope-websocket`
        workflow covers function- and request-scope WebSocket cleanup; the
        independent `dependency-scope-construction-errors` workflow covers
        invalid HTTP and WebSocket graphs. A yielded dependency may have nested ordinary
        synchronous dependencies, but nested coroutine or yielded dependency
        graphs remain unsupported. Injected `BackgroundTasks`, generator
        overrides, None-based dependency inference, Security/OAuth scope
        injection and OpenAPI integration,
        invalid scope values, cleanup suppression semantics, and constructor
        behavior beyond the reviewed sync, async, and yielded dependency slices
        remain unsupported. The public `Depends` signature, including its
        annotated parameter documentation, is covered by the independent
        `tests/fixtures/input-recipes/parity/depends-signature.yaml` case
        `fastapi.dependencies.depends-yield-scope-signature`.
