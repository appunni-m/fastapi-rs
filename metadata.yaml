    fastapi.Body:
      rust_binding: fastapi-rs/src/parameters.rs::body
      source_evidence:
        - {path: fastapi/param_functions.py, symbol: Body}
        - {path: fastapi/params.py, symbol: Body}
      feature_ids: [request-validation, openapi-docs]
      observation_selectors: [http.status, http.body.bytes, openapi.request_schema]
      supported_slice: >-
