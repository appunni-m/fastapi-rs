        - {path: docs_src/handling_errors/tutorial006_py310.py, symbol: validation_exception_handler}
      feature_ids: [public-api-errors, request-validation]
      observation_selectors:
        - http.status
        - http.headers.ordered
        - http.body.bytes
        - http.body.json
        - validation.error_class
        - validation.error_details
      documentation_contract_refs:
        - source_path: docs/en/docs/tutorial/handling-errors.md
          fixture_id: fastapi.docs.tutorial-handling-errors
          observation_selectors:
            - http.status
            - http.body.bytes
            - http.body.json
            - validation.error_class
            - validation.error_details
      error_contract_ids: [fastapi.exceptions.RequestValidationError]
    fastapi.applications.FastAPI.websocket:
      source_evidence:
        - {path: fastapi/applications.py, symbol: websocket}
        - {path: fastapi/routing.py, symbol: get_websocket_app}
      feature_ids: [request-validation, websocket-lifecycle]
      observation_selectors:
        - validation.error_class
        - validation.error_details
        - websocket.close_code
        - websocket.close_reason
      error_contract_ids: [fastapi.exceptions.WebSocketRequestValidationError]
    fastapi.routing.APIRouter.websocket:
      source_evidence:
