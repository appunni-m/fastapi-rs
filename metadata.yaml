      supported_slice: >-
        The router-prefix-and-nested-composition workflow dispatches HTTP GET
        through the application for its concrete tenant path and four repeated-
        inclusion paths. This records only those requests; other methods,
        paths, and ASGI scopes are outside this workflow.

        Partial native slice: when a path operation declares response_model
        and returns a prebuilt Starlette Response, including JSONResponse,
        FastAPI passes the response through without response-model validation,
        filtering, or its response serialization/encoding path. The focused
        JSONResponse case includes fields absent from its declared response
        model and observes the emitted status, headers, body, and ASGI message
        types. On the default JSON response path, valid response-model values
        with status 205 or 304 are validated and serialized before FastAPI's
        body policy clears the wire body; status 205 retains the serialized
        Content-Length while 304 omits it under Starlette 1.6.0. A malformed
        response model at status 304 still raises response validation before
        the body policy runs. Custom response classes and other status cases
        remain outside this reviewed slice.
        The generator-awaitable-protocol inputs declare direct flagged
        generator awaits, checkpoint/Future resume and errors, original native
        coroutine error propagation, returned ordinary generator iterators,
        rejected flagged/noniterator __await__ returns, synchronous returned
        generator values, validation/cache order, cleanup, and recovery. The
        public state response retains all warning entries and raw ASGI sends.
        These selected inputs require fresh source/target execution receipts;
        they do not establish the complete Python await protocol.
        Fifteen response-field-lifecycle cases dispatch HTTP through fixed async
        endpoints. They require source field-plus-placeholder dump_json eligibility,
        concrete/inherited class dump_python invocation, explicit None failure after
        validation/serialization, returned-Response bypass, adapter retention after
        errors and recovery, exact warning and callback order, aliases/exclusion flags,
        NaN bytes/errors, ordered headers, and lossless prior probe sends via the public
        state response. Construction-only unsupported-model failure is linked to
        registration rather than HTTP execution. Fresh unchanged-input source/target
        receipts are required; these inputs do not extend sync worker, mutable
        cache-history, cancellation, or generic sibling claims.
        Seven response-field-traversal normal inputs map fixed public route trees, a
        one-use user schema-hook refusal and retry, parent own-field preparation
        before child traversal, earlier full versus partial matches, misses, slash
        search and returned-Response field setup. They retain actual construction,
        callbacks, warnings/errors, exact status/ordered headers/body and full prior
        non-state send fields through an early public state route. Source-derived
        branch publication and traversal contracts require fresh identity-checked
        source/target receipts; these mappings do not establish complete target
        support, mutable router-version history or generic sibling behavior.
        FastAPI(root_path=...) also writes its configured prefix into an empty ASGI
        scope before route execution; the proxy-root-path-without-auto-server input
        observes that scope value in the endpoint response and the associated
        OpenAPI request.
        Four additional-response cases cover media-type content merging, model-derived
        response schemas, preserved examples, and status-description defaults for
        declared responses; they do not establish arbitrary metadata-key or malformed
        declaration parity.
      target_binding:
