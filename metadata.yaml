        non-empty `operation_id` values are used in OpenAPI, sampled across the
        six decorators by `path-operation-other-verb-operation-ids-isolated`.
        Explicit `response_description` values are emitted in the success
        response and sampled with the other direct and router methods by
        `path-operation-other-verbs-response-descriptions`.
        Explicit `deprecated=True` emits `deprecated: true`; false and
        omitted values remain absent, sampled by
        `path-operation-other-verbs-deprecated`.
        One route-level `responses` entry with one non-colliding Python integer (not bool)
        status key and a non-empty string `description` maps to a
        description-only OpenAPI response object, sampled by
        `path-operation-other-verbs-responses`. Multiple status entries,
        response models, extra response fields, string status keys, empty
        descriptions, and router/include-level response maps remain outside.
    fastapi.applications.FastAPI.head:
      rust_binding: fastapi-rs/src/application_runtime.rs::PyFastApi::head
      source_evidence:
        - {path: fastapi/applications.py, symbol: head}
        - {path: fastapi/routing.py, symbol: head}
        - {path: fastapi/openapi/utils.py, symbol: get_openapi_operation_metadata}
        - {path: fastapi/openapi/utils.py, symbol: get_openapi_path}
        - {path: tests/test_extra_routes.py, symbol: test_head}
        - {path: tests/test_extra_routes.py, symbol: test_get_api_route}
        - {path: tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial004.py, symbol: test_openapi_schema}
        - {path: docs_src/path_operation_advanced_configuration/tutorial004_py310.py}
        - {path: tests/test_tutorial/test_path_operation_advanced_configurations/test_tutorial001.py, symbol: test_openapi_schema}
        - {path: docs_src/path_operation_advanced_configuration/tutorial001_py310.py}
        - {path: tests/test_tutorial/test_path_operation_configurations/test_tutorial006.py, symbol: test_openapi_schema}
        - {path: docs_src/path_operation_configuration/tutorial006_py310.py, symbol: read_elements}
        - {path: tests/test_additional_responses_router.py}
        - {path: docs/en/docs/advanced/additional-responses.md}
        - {path: tests/test_tutorial/test_additional_responses/test_tutorial004.py}
      feature_ids: [app-routing, openapi-docs]
      observation_selectors: [http.status, http.headers.ordered, http.body.bytes, openapi.document, openapi.paths]
      supported_slice: >-
        Partial native slice: registers exact HEAD operations, lets an explicit
        HEAD route win after a same-path GET route, and does not treat a GET-only
        route as HEAD. include_in_schema=False keeps the route dispatchable while
        omitting it from OpenAPI. Other route decorator options and customization
