            uncommon or invalid response status conversions remain unverified.
          - &generator_await_audit_gap >-
            Safe gi_code property lookup can emit extra audit events or invoke
            rejecting audit hooks compared with CPython native field access;
            audit-event parity is not exercised by these inputs.
          - &generator_await_generic_throw_gap >-
            Generic iterator throw argument arity and user-returned
            coroutine_wrapper provenance remain unproven; the existing generic
            three-argument throw path does not establish source parity for
            every iterator.
          - &generator_await_protocol_gap >-
            Instance-versus-type await-slot lookup, ABC-only awaitable
            registration, coroutine reuse/already-awaited checks, cancellation,
            GeneratorExit, and arbitrary send/throw/close protocols remain gaps.
          - &generator_await_history_gap >-
            The selected immutable generator roles do not establish mutable
            classification-cache history, descriptor hooks, arbitrary awaitable
            concurrency, or exact traceback parity. Static admission is not
            live source/target execution evidence.
          - *response_field_traversal_gap
          - *response_field_traversal_history_gap
