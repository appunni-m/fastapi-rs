fault_contract_policy:
  schema: fastapi-rs/fault-contract-policy@1
  target_only: true
  build_feature: fault-injection
  normal_build_control: absent
  result_rule: Oracle receipts must be not_applicable; target identity must prove the instrumented build.
  inputs_contain_expected_outputs: false
  contracts:
    - point: http.route.invoke.before
      contract: http-route-invocation-error-and-recovery
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect: {kind: http_response, status: 200}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.route.invoke.after_dependencies.before
      contract: http-route-invocation-error-cleans-dependencies
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect:
          kind: http_response
          status: 200
          body: {events: [dependency-enter, dependency-cleanup]}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.route.invoke.after_dependencies.before
      contract: http-route-invocation-error-orders-function-and-request-dependency-cleanup
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect:
          kind: http_response
          status: 200
          body:
            events: [function-enter, request-enter, function-cleanup, request-cleanup, response-start, response-end]
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.request.json_decode.before
      contract: http-body-json-decode-error-returns-400
      assertion:
        first_response:
          kind: http_response
          status: 400
          body: {detail: There was an error parsing the body}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.request.form_parse.before
      contract: http-body-form-parse-error-returns-400
      assertion:
        first_response:
          kind: http_response
          status: 400
          body: {detail: There was an error parsing the body}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.frontend.lookup.permission-error
      contract: frontend-static-lookup-permission-denied-401
      assertion:
        first_response: {kind: http_response, status: 401}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.frontend.lookup.value-error
      contract: frontend-static-lookup-value-error-404
      assertion:
        first_response: {kind: http_response, status: 404}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.frontend.lookup.name-too-long
      contract: frontend-static-lookup-name-too-long-404
      assertion:
        first_response: {kind: http_response, status: 404}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: http.frontend.lookup.os-error
      contract: frontend-static-lookup-os-error-propagates
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.OSError}
        first_response: {kind: http_response, status: 500}
      excludes: [exception_message, stack_trace, source_line, private_state]
    - point: openapi.cache.publish.before
      contract: openapi-cache-publication-error-returns-500-and-retries-full-document
      assertion:
        first_effect: {kind: application_error, selector: exception, exception_class: builtins.RuntimeError}
        first_send: {kind: asgi_send, selector: message_types, value: [http.response.start, http.response.body]}
        first_response: {kind: http_response, selector: status, value: 500}
        later_effect:
          kind: http_response
          status: 200
          body: {retry_and_cached_document_equal: true}
      excludes: [exception_message, stack_trace, source_line, private_state]

