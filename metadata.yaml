reviewed_api_contract_overlay:
  schema: fastapi-rs/reviewed-api-contract-overlay@7
  purpose: >-
    Source-backed overlays link selected supported operations to documented
    features, observable selectors, and candidate error records. Inherited
    operations delegate to a canonical pinned Starlette-RS operation or state
    the exact sibling-contract gap and source signature. Classification-only
    inherited candidates record their reviewed source disposition without
    creating a target operation contract. Identity workflow references link
    root import bindings to runtime identity relations; an error link does not
    promote an uncertain exception into the public import contract.
  identity_workflow_refs:
    fastapi.status:
      - {case_id: fastapi.root-alias-identity.http-reexports, relation: root_to_starlette_module, observation_selector: http.body.bytes, projection: http_json_body_boolean}
    fastapi.FastAPI:
      - {case_id: fastapi.root-alias-identity.http-reexports, relation: root_to_public_module, observation_selector: http.body.bytes, projection: http_json_body_boolean}
    fastapi.BackgroundTasks:
