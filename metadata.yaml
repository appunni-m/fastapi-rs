        - {path: tests/test_application.py, symbol: test_openapi_schema}
        - {path: tests/main.py}
      feature_ids: [app-routing, dependency-security, request-validation, openapi-docs]
      observation_selectors: [http.status, http.body.bytes, openapi.document]
      supported_slice: >-
        Partial native constructor slice: the application exposes a mutable
        dependency_overrides mapping used by the reviewed synchronous and
        asynchronous override slices in Depends. The synchronous slice replaces
        an app-level dependency with a callable whose nested dependency
        introduces exactly one required scalar query field `k`. Missing `k`
