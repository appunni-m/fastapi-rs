name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fastapi-rs
          persist-credentials: false
      - name: Checkout FastAPI 0.141.1 source authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fastapi/fastapi
          ref: 95f8322ee1dcda7ceace7b1c4f6c9915b36d748f
          path: fastapi
          persist-credentials: false
      - name: Checkout Starlette 1.6.0 source authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kludex/starlette
          ref: 4f250d6b814587e20c5365f0a5f0c4d42bcb929f
          path: starlette
          persist-credentials: false
      - name: Checkout pinned Starlette-RS replacement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: appunni-m/starlette-rs
          ref: 2de1e56b38c32d9d1b89445190f37bd1e7739515
          path: starlette-rs
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
          rustc --version
          cargo --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Install pinned Python tooling
        run: python -m pip install --requirement requirements-dev.txt
        working-directory: fastapi-rs
      - name: Verify formatting, lints, static contracts, and wheel build
        run: make verify
        working-directory: fastapi-rs
      - name: Prepare pinned FastAPI oracle
        run: make parity-prepare-oracle
        working-directory: fastapi-rs
      - name: Prepare FastAPI-RS target
        run: make parity-prepare-target
        working-directory: fastapi-rs
      - name: Compare the pinned first HTTP slice
        run: make parity-first-slice
        working-directory: fastapi-rs
